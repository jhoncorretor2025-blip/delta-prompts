const dadosBrutos=[
{categoria:'🧭 Coaching Pessoal',nivel:'intermediario',titulo:'🎯 Plano de Coaching Pessoal',quando:'Para criar um plano de desenvolvimento numa área específica da vida.',prompt:`Aja como meu coach pessoal e me ajude a criar um plano de desenvolvimento.

Área da vida que eu quero desenvolver: [ÁREA, EX: CARREIRA, RELACIONAMENTOS, SAÚDE, FINANÇAS]
Onde eu estou hoje: [SITUAÇÃO ATUAL]
Onde eu quero chegar: [OBJETIVO]
Prazo: [PRAZO]

Faça perguntas poderosas pra me ajudar a esclarecer o que realmente eu quero, aponte possíveis obstáculos internos (crenças limitantes) e externos, e monte um plano de ação em etapas.`,en:`Act as my personal coach and help me create a development plan.

Life area I want to develop: [AREA, EG: CAREER, RELATIONSHIPS, HEALTH, FINANCES]
Where I am today: [CURRENT SITUATION]
Where I want to get to: [GOAL]
Timeframe: [TIMEFRAME]

Ask powerful questions to help clarify what I really want, point out possible internal obstacles (limiting beliefs) and external ones, and put together a step-by-step action plan.`},
{categoria:'🧭 Coaching Pessoal',nivel:'basico',titulo:'💪 Construir um Novo Hábito com Coaching',quando:'Para quebrar um hábito novo em passos pequenos e realistas.',prompt:`Quero construir um novo hábito e preciso de apoio como um coach.

Hábito que eu quero criar: [HÁBITO]
Tentativas anteriores e por que não deram certo: [O QUE JÁ TENTOU]

Me ajude a quebrar esse hábito em um passo inicial bem pequeno e fácil, sugira um gatilho (algo que já faço no dia que possa lembrar de fazer o novo hábito), e uma forma de acompanhar meu progresso sem me cobrar demais.`,en:`I want to build a new habit and need support like a coach.

Habit I want to create: [HABIT]
Previous attempts and why they didn't work: [WHAT YOU'VE TRIED]

Help me break this habit down into a very small, easy first step, suggest a trigger (something I already do in the day that can remind me to do the new habit), and a way to track my progress without being too hard on myself.`},
{categoria:'🧠 Autossugestão & Hipnose',nivel:'basico',titulo:'🧠 Roteiro de Autossugestão para Relaxamento',quando:'Para um roteiro guiado de relaxamento profundo por autossugestão.',prompt:`Crie um roteiro de autossugestão para relaxamento profundo.

Tempo disponível: [TEMPO]
O que mais me deixa tenso(a) hoje: [O QUE TE DEIXA TENSO]

Escreva um roteiro guiado de autossugestão para relaxamento, com indução progressiva (contagem, respiração, relaxamento muscular) e sugestões positivas de calma. Deixe claro que isso é uma técnica de relaxamento e autossugestão, não um tratamento médico ou psicológico.`,en:`Create a self-suggestion script for deep relaxation.

Time available: [TIME]
What makes me most tense today: [WHAT MAKES YOU TENSE]

Write a guided self-suggestion script for relaxation, with progressive induction (counting, breathing, muscle relaxation) and positive calming suggestions. Make clear this is a relaxation and self-suggestion technique, not a medical or psychological treatment.`},
{categoria:'🧠 Autossugestão & Hipnose',nivel:'intermediario',titulo:'🚭 Autossugestão para Largar um Hábito',quando:'Para reforçar a motivação de largar um hábito com autossugestão positiva.',prompt:`Quero usar autossugestão pra me ajudar a largar um hábito.

Hábito que eu quero largar: [HÁBITO]
Por que eu quero mudar isso: [MOTIVAÇÃO]

Crie um roteiro de autossugestão com indução de relaxamento e frases de reforço positivo focadas nesse objetivo específico. Deixe claro que isso é uma ferramenta de apoio e autossugestão, não substitui acompanhamento profissional se o hábito envolver dependência.`,en:`I want to use self-suggestion to help me quit a habit.

Habit I want to quit: [HABIT]
Why I want to change this: [MOTIVATION]

Create a self-suggestion script with relaxation induction and positive reinforcement phrases focused on this specific goal. Make clear this is a self-suggestion support tool, and does not replace professional support if the habit involves dependency.`},
{categoria:'📜 Filosofia de Vida',nivel:'intermediario',titulo:'🏛️ Aplicar Filosofia Estoica no Dia a Dia',quando:'Para usar princípios estoicos numa situação real que você está vivendo.',prompt:`Quero aplicar princípios do estoicismo na minha vida prática.

Situação que estou enfrentando hoje: [SITUAÇÃO]

Explique 2 ou 3 princípios estoicos relevantes pra essa situação (ex: dicotomia do controle, aceitação, virtude), de forma simples, e mostre como eu poderia aplicar cada um na prática nessa situação específica.`,en:`I want to apply Stoic principles to my practical life.

Situation I'm facing today: [SITUATION]

Explain 2 or 3 Stoic principles relevant to this situation (eg: dichotomy of control, acceptance, virtue), simply, and show how I could apply each one practically to this specific situation.`},
{categoria:'🎯 Propósito & Disciplina',nivel:'intermediario',titulo:'🧭 Definir Minha Missão de Vida',quando:'Para refletir sobre propósito de forma prática, sem viés religioso.',prompt:`Me ajude a refletir sobre minha missão de vida, de forma prática, sem viés religioso.

O que eu faço que me dá mais energia: [RESPOSTA]
O que as pessoas costumam me agradecer ou elogiar: [RESPOSTA]
Problemas do mundo que mais me incomodam: [RESPOSTA]

Com base nessas respostas, ajude a identificar padrões e sugira 2 ou 3 possíveis direções de missão de vida, sempre deixando claro que é uma reflexão, não uma resposta definitiva.`,en:`Help me reflect on my life mission, practically, with no religious bias.

What I do that gives me the most energy: [ANSWER]
What people usually thank or compliment me for: [ANSWER]
World problems that bother me the most: [ANSWER]

Based on these answers, help identify patterns and suggest 2 or 3 possible life mission directions, always making clear this is a reflection, not a definitive answer.`},
{categoria:'📜 Filosofia de Vida',nivel:'basico',titulo:'⏳ Refletir Sobre uma Decisão Importante',quando:'Para olhar uma decisão difícil por diferentes ângulos, sem receber uma resposta pronta.',prompt:`Preciso tomar uma decisão importante e quero refletir com mais clareza.

A decisão: [DECISÃO]
O que pesa a favor de cada opção: [PRÓS DE CADA LADO]
O que eu tenho medo de perder ou de me arrepender: [MEDOS]

Me ajude a olhar essa decisão sob diferentes perspectivas (o que eu penso a longo prazo, o que meus valores dizem, o que eu diria pra um amigo na mesma situação), sem me dizer o que decidir.`,en:`I need to make an important decision and want to reflect with more clarity.

The decision: [DECISION]
What weighs in favor of each option: [PROS OF EACH SIDE]
What I'm afraid of losing or regretting: [FEARS]

Help me look at this decision from different angles (what I think long-term, what my values say, what I'd tell a friend in the same situation), without telling me what to decide.`},
{categoria:'📜 Filosofia de Vida',nivel:'intermediario',titulo:'🏔️ Encontrar Sentido num Momento Difícil',quando:'Para refletir sobre aprendizado e crescimento sem minimizar a dificuldade real.',prompt:`Estou passando por um momento difícil e quero encontrar sentido nele, não só superá-lo.

O que está acontecendo: [SITUAÇÃO, NO QUANTO VOCÊ SE SENTIR CONFORTÁVEL EM COMPARTILHAR]

Sem minimizar a dificuldade, me ajude a refletir sobre possíveis aprendizados, forças que estou descobrindo em mim, e formas de encontrar significado nesse momento, com base em ideias filosóficas sobre superação e crescimento.`,en:`I'm going through a hard time and want to find meaning in it, not just get through it.

What's happening: [SITUATION, AS MUCH AS YOU FEEL COMFORTABLE SHARING]

Without minimizing the difficulty, help me reflect on possible lessons, strengths I'm discovering in myself, and ways to find meaning in this moment, based on philosophical ideas about overcoming hardship and growth.`},
{categoria:'🎯 Propósito & Disciplina',nivel:'basico',titulo:'🔥 Vencer a Procrastinação com Coaching',quando:'Para entender a raiz da procrastinação numa tarefa específica e dar o primeiro passo.',prompt:`Quero vencer a procrastinação numa tarefa específica, com abordagem de coaching.

Tarefa que estou adiando: [TAREFA]
O que eu acho que está me impedindo de fazer: [MOTIVO, SE SOUBER]

Faça perguntas pra entender a raiz da procrastinação (medo, perfeccionismo, falta de clareza, etc.), e depois me ajude a quebrar essa tarefa no menor passo possível pra eu começar agora.`,en:`I want to overcome procrastination on a specific task, with a coaching approach.

Task I'm putting off: [TASK]
What I think is stopping me: [REASON, IF YOU KNOW]

Ask questions to understand the root of the procrastination (fear, perfectionism, lack of clarity, etc.), and then help me break this task down into the smallest possible step so I can start now.`},
{categoria:'📜 Filosofia de Vida',nivel:'avancado',titulo:'📖 Criar Meus Próprios Princípios de Vida',quando:'Para transformar seus valores numa lista de princípios pessoais claros e memoráveis.',prompt:`Quero criar meus próprios princípios de vida, inspirado em diferentes filosofias, mas com minha cara.

Valores que eu já sei que são importantes pra mim: [VALORES]
Filosofias ou pensadores que já me inspiram, se tiver: [REFERÊNCIAS, SE TIVER]

Me ajude a transformar isso em uma lista de 5 a 10 princípios de vida pessoais, escritos de forma clara e memorável, que eu possa revisar quando precisar tomar decisões difíceis.`,en:`I want to create my own life principles, inspired by different philosophies, but in my own voice.

Values I already know are important to me: [VALUES]
Philosophies or thinkers that already inspire me, if any: [REFERENCES, IF ANY]

Help me turn this into a list of 5 to 10 personal life principles, written clearly and memorably, that I can revisit when I need to make difficult decisions.`}
];

const prompts=dadosBrutos.map((x,i)=>{
  const obj={id:'decor-'+i,categoria:x.categoria,nivel:x.nivel,titulo:x.titulo,quando:x.quando,prompt:x.prompt,promptEn:x.en,novo:true};
  obj.placeholders=[...new Set((obj.prompt.match(/\[([^\]]+)\]/g)||[]).map(s=>s.slice(1,-1)))];
  return obj;
});

const idiomaAtivo={};
let categoriaAtual='todos';

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function nivelLabel(n){return n==='avancado'?'🔴 Avançado':n==='intermediario'?'🟡 Intermediário':'🟢 Básico'}
function mostrarToast(texto){const t=document.getElementById('toast');if(!t)return;t.textContent=texto;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}

function _loadFav(){try{return JSON.parse(localStorage.getItem('deltaFavoritos'))||[]}catch(e){return[]}}
function _saveFav(l){try{localStorage.setItem('deltaFavoritos',JSON.stringify(l))}catch(e){}}
function isFav(id){return _loadFav().some(f=>f.id===id)}
function textoBase(id){const p=getItem(id);if(!p)return'';return idiomaAtivo[id]==='en'?(p.promptEn||p.prompt):p.prompt}
function textoFinal(id){const p=getItem(id);if(!p)return'';let t=textoBase(id);(p.placeholders||[]).forEach((ph,idx)=>{const el=document.getElementById('campo-'+id+'-'+idx);const val=el?el.value.trim():'';if(val){const re=new RegExp('\\['+ph.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]','g');t=t.replace(re,val)}});return t}
function getItem(id){return prompts.find(p=>p.id===id)}
function atualizarBtnFav(id,btn){if(!btn)return;if(isFav(id)){btn.textContent='❤️ Favoritado';btn.classList.add('is-fav')}else{btn.textContent='🤍 Favoritar';btn.classList.remove('is-fav')}}
function favoritar(id,btn){const p=getItem(id);if(!p)return;let l=_loadFav();const idx=l.findIndex(f=>f.id===id);if(idx===-1){l.unshift({id,titulo:p.titulo,texto:textoFinal(id),categoria:'Filosofia de Vida',createdAt:Date.now()});_saveFav(l);mostrarToast('💖 Adicionado aos favoritos!')}else{l.splice(idx,1);_saveFav(l);mostrarToast('🤍 Removido dos favoritos')}atualizarBtnFav(id,btn);window.dispatchEvent(new CustomEvent('delta:favoritos-updated'))}

function _loadUsos(){try{return JSON.parse(localStorage.getItem('deltaFilosofiaUsos'))||{}}catch(e){return{}}}
function _saveUsos(o){try{localStorage.setItem('deltaFilosofiaUsos',JSON.stringify(o))}catch(e){}}
function registrarUso(id){const usos=_loadUsos();usos[id]=(usos[id]||0)+1;_saveUsos(usos)}

function _loadFeedback(){try{return JSON.parse(localStorage.getItem('deltaFilosofiaFeedback'))||{}}catch(e){return{}}}
function _saveFeedback(o){try{localStorage.setItem('deltaFilosofiaFeedback',JSON.stringify(o))}catch(e){}}
function darFeedback(id,tipo){
  const fb=_loadFeedback();const atual=fb[id]&&fb[id].voto;if(!fb[id])fb[id]={voto:null};
  const g=window.deltaAuth;
  if(atual===tipo){fb[id].voto=null;if(g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,tipo,-1)}
  else{if(atual&&g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,atual,-1);fb[id].voto=tipo;if(g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,tipo,1)}
  _saveFeedback(fb);atualizarFeedbackUI(id);
  mostrarToast(tipo==='up'?'👍 Obrigado pelo feedback!':'👎 Obrigado, vamos melhorar esse!');
}
function atualizarFeedbackUI(id){
  const fb=_loadFeedback()[id]||{voto:null};
  const up=document.getElementById('fbup-'+id),down=document.getElementById('fbdown-'+id);
  if(up)up.classList.toggle('marcado',fb.voto==='up');
  if(down)down.classList.toggle('marcado',fb.voto==='down');
  const g=window.deltaAuth;
  if(g&&g.obterFeedbackGlobal){g.obterFeedbackGlobal(id).then(r=>{if(up)up.textContent='👍 '+(r.up||0);if(down)down.textContent='👎 '+(r.down||0)})}
}

function alternarIdioma(id){
  idiomaAtivo[id]=idiomaAtivo[id]==='en'?'pt':'en';
  const pre=document.getElementById('prompt-'+id),btn=document.getElementById('idioma-'+id);
  if(pre)pre.textContent=textoFinal(id);
  if(btn){btn.textContent=idiomaAtivo[id]==='en'?'🇧🇷 Ver em Português':'🌐 View in English';btn.classList.toggle('ativo-en',idiomaAtivo[id]==='en')}
}
async function copiarPorId(id){registrarUso(id);try{await navigator.clipboard.writeText(textoFinal(id));mostrarToast('📋 Copiado!')}catch(e){mostrarToast('Não foi possível copiar')}}
async function abrirChat(id){registrarUso(id);try{await navigator.clipboard.writeText(textoFinal(id))}catch(e){}mostrarToast('✓ Copiado! Abrindo...');setTimeout(()=>window.open('https://chatgpt.com/','_blank'),300)}
async function abrirGemini(id){registrarUso(id);try{await navigator.clipboard.writeText(textoFinal(id))}catch(e){}mostrarToast('✓ Copiado! Abrindo...');setTimeout(()=>window.open('https://gemini.google.com/app','_blank'),300)}
function compartilhar(id){
  const p=getItem(id);if(!p)return;
  const texto='🛋️ '+p.titulo+'\n\n'+textoFinal(id)+'\n\n— via Delta Prompts';
  if(navigator.share){navigator.share({title:p.titulo,text:texto}).catch(()=>{})}
  else{navigator.clipboard.writeText(texto).then(()=>mostrarToast('🔗 Copiado! Cole onde quiser compartilhar.'))}
}
function exportarTodos(){
  const linhas=prompts.map(p=>p.titulo+' ('+p.categoria+')\n'+p.prompt);
  const blob=new Blob(['🛋️ FILOSOFIA DE VIDA & COACH — DELTA PROMPTS\n\n'+linhas.join('\n\n'+'─'.repeat(40)+'\n\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='deltafilosofia.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  mostrarToast('📥 Arquivo baixado!');
}
function toggleSugerir(){const box=document.getElementById('sugerirBox');box.style.display=(box.style.display==='none'||!box.style.display)?'block':'none'}
function copiarSugestao(){const texto=document.getElementById('sugestaoTexto').value.trim();if(!texto){mostrarToast('Escreva sua ideia antes de copiar 🙂');return}navigator.clipboard.writeText('💡 Sugestão para o Delta Prompts (Filosofia de Vida):\n\n'+texto).then(()=>mostrarToast('📋 Sugestão copiada! Envie pra gente 💌'))}
function atualizarStats(){const favs=_loadFav().filter(f=>f.categoria==='Filosofia de Vida').length;document.getElementById('statsBar').innerHTML='⭐ Você já favoritou <strong>'+favs+'</strong> modelo'+(favs===1?'':'s')+' · 🛋️ <strong>'+prompts.length+'</strong> modelos disponíveis'}
function aplicarTema(t){document.documentElement.setAttribute('data-theme',t);const btn=document.getElementById('themeToggle');if(btn)btn.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('deltaTheme',t)}catch(e){}}

function montarFiltroCategoria(){
  const cont=document.getElementById('filtrosCategoria');
  const categorias=[...new Set(prompts.map(p=>p.categoria))];
  cont.innerHTML='<button class="'+(categoriaAtual==='todos'?'ativo':'')+'" data-categoria="todos">Todos <span class="count-badge">'+prompts.length+'</span></button>'+
    categorias.map(c=>{const n=prompts.filter(p=>p.categoria===c).length;return `<button class="${categoriaAtual===c?'ativo':''}" data-categoria="${c}">${c} <span class="count-badge">${n}</span></button>`}).join('');
  cont.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{categoriaAtual=b.dataset.categoria;montarFiltroCategoria();render()}));
}

function render(){
  const termo=norm(document.getElementById('busca').value);
  const filtrados=prompts.filter(p=>{
    const texto=norm([p.titulo,p.quando,p.categoria,p.prompt].join(' '));
    return(!termo||texto.includes(termo))&&(categoriaAtual==='todos'||p.categoria===categoriaAtual);
  });
  document.getElementById('contador').textContent=filtrados.length+' de '+prompts.length+' modelos';
  const lista=document.getElementById('lista');
  lista.innerHTML=filtrados.length?filtrados.map(p=>`
    <section class="card" id="card-${p.id}">
      <span class="tag">${p.categoria}</span><span class="nivel nivel-${p.nivel}">${nivelLabel(p.nivel)}</span>
      <h3>${p.titulo}</h3>
      <p style="color:#667085;font-size:13.5px;margin:4px 0 10px">${p.quando}</p>
      ${p.placeholders.length?`<div class="campos-preenchimento">${p.placeholders.map((ph,idx)=>`<label class="campo-label">✏️ ${ph}<input type="text" id="campo-${p.id}-${idx}" placeholder="Preencha antes de copiar (opcional)"></label>`).join('')}</div>`:''}
      <div class="prompt-text" id="prompt-${p.id}">${p.prompt}</div>
      <div class="acoes">
        <button class="copiar" data-acao="copiar" data-id="${p.id}">📋 Copiar</button>
        <button class="favoritar" data-acao="favoritar" data-id="${p.id}">🤍 Favoritar</button>
        <button data-acao="chat" data-id="${p.id}">🤖 ChatGPT</button>
        <button data-acao="gemini" data-id="${p.id}">✨ Gemini</button>
        <button class="compartilhar" data-acao="compartilhar" data-id="${p.id}">🔗 Compartilhar</button>
        <button class="idioma" id="idioma-${p.id}" data-acao="idioma" data-id="${p.id}">🌐 View in English</button>
      </div>
      <div class="feedback-row"><span style="font-size:12px;color:#8a92a6">Esse modelo te ajudou?</span><button id="fbup-${p.id}" data-acao="fbup" data-id="${p.id}">👍 0</button><button id="fbdown-${p.id}" data-acao="fbdown" data-id="${p.id}">👎 0</button></div>
    </section>`).join('') : '<div style="text-align:center;padding:30px;opacity:.7">🔎 Nenhum modelo encontrado.</div>';

  filtrados.forEach(p=>{atualizarBtnFav(p.id,document.querySelector('#card-'+p.id+' .favoritar'));atualizarFeedbackUI(p.id)});
}

document.getElementById('lista').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-acao]');
  if(!btn)return;
  const acao=btn.dataset.acao,id=btn.dataset.id;
  if(acao==='copiar')copiarPorId(id);
  else if(acao==='chat')abrirChat(id);
  else if(acao==='gemini')abrirGemini(id);
  else if(acao==='idioma')alternarIdioma(id);
  else if(acao==='favoritar')favoritar(id,btn);
  else if(acao==='compartilhar')compartilhar(id);
  else if(acao==='fbup')darFeedback(id,'up');
  else if(acao==='fbdown')darFeedback(id,'down');
});

document.getElementById('busca').addEventListener('input',render);
document.getElementById('btnExportar').addEventListener('click',exportarTodos);
document.getElementById('btnSugerir').addEventListener('click',toggleSugerir);
document.getElementById('btnCopiarSugestao').addEventListener('click',copiarSugestao);
document.getElementById('themeToggle').addEventListener('click',()=>{const atual=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';aplicarTema(atual)});

aplicarTema((function(){try{return localStorage.getItem('deltaTheme')||'light'}catch(e){return'light'}})());
montarFiltroCategoria();
atualizarStats();
render();
window.addEventListener('delta:favoritos-updated',atualizarStats);
</script></body></html>
