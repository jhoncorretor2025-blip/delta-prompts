<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tomada de Decisão | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js?v=20260813"></script><main><h1>🧠 Tomada de Decisão</h1><p>Prompts para organizar escolhas, reduzir impulsividade e enxergar consequências com mais clareza.</p><section class="card"><h2>🧭 Como funciona</h2><p>Use os prompts para estruturar o raciocínio. Em decisões importantes, valide informações e não trate a resposta da IA como substituta do seu julgamento.</p></section><div id="lista-prompts"></div></main><script>const prompts=[['⚖️ Comparar duas opções','Preciso decidir entre [OPÇÃO A] e [OPÇÃO B]. Meu objetivo: [OBJETIVO]. Restrições: [RESTRIÇÕES]. Compare benefícios, custos, riscos, reversibilidade e impacto no curto e longo prazo.'],['🎯 Criar critérios de decisão','Ajude a definir critérios objetivos para decidir [DECISÃO]. Primeiro identifique o que realmente importa, depois crie pesos e uma forma simples de comparar alternativas.'],['🔮 Pensar nas consequências','Analise as consequências de escolher [OPÇÃO]. Mostre efeitos prováveis em 1 mês, 1 ano e 5 anos, incluindo efeitos de segunda ordem e incertezas.'],['🧪 Testar antes de decidir','Quero decidir [DECISÃO], mas posso testar antes. Crie experimentos pequenos, baratos e reversíveis para reduzir a incerteza antes do compromisso maior.'],['⚠️ Pré-mortem','Imagine que escolhi [DECISÃO] e deu errado. Liste motivos plausíveis, sinais de alerta e formas de reduzir cada risco antes de decidir.'],['🪞 Identificar vieses','Analise meu raciocínio sobre esta decisão: [CONTEXTO E PENSAMENTO]. Identifique possíveis vieses cognitivos, emoções ou pressupostos sem evidência. Não decida por mim.'],['🚪 Decisão reversível ou irreversível','Classifique esta decisão [DECISÃO] pelo grau de reversibilidade. Explique quanto tempo de análise ela merece e como preservar opções futuras.'],['📊 Matriz de decisão','Monte uma matriz para comparar [OPÇÕES] usando [CRITÉRIOS]. Peça dados que faltam antes de atribuir notas que não tenham base.'],['🤔 Advogado do diabo','Minha preferência atual é [ESCOLHA] porque [MOTIVOS]. Faça a melhor argumentação possível contra minha escolha e depois mostre quais críticas são realmente relevantes.'],['✅ Próximo passo depois da decisão','Minha decisão foi [DECISÃO]. Transforme-a em próximos passos concretos, prazos, pontos de revisão e sinais que justificariam reconsiderar.']];document.getElementById('lista-prompts').innerHTML=prompts.map((p,i)=>`<article class="card"><h2>${p[0]}</h2><pre class="prompt-text">${p[1]}</pre><button onclick="navigator.clipboard.writeText(prompts[${i}][1])">📋 Copiar</button></article>`).join('');</script></body></html>
