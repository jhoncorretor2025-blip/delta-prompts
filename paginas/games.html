<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Games com IA | Delta Prompts</title><meta name="description" content="Prompts para jogar melhor e prompts para criar seus próprios jogos simples, do jogo da velha ao plataforma."><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"><style>

.feedback-row{display:flex;align-items:center;gap:8px;margin-top:14px}
.feedback-row button{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:#475467}
.feedback-row button.marcado{background:#eef2ff;border-color:#5b5ce2;color:#5b5ce2}
.top-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}
.top-bar input{flex:1;min-width:220px;padding:14px;border-radius:12px;border:1px solid #ddd}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.sugerir-box{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:0 0 20px;background:#f0fdf4}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#172033;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:9999}

[data-theme="dark"] .filtros button,[data-theme="dark"] .toolbar-extra button,[data-theme="dark"] .feedback-row button{background:#0f1424;border-color:rgba(255,255,255,.15);color:#cbd5e1}

<h1>🎮 Games com IA</h1>
<p>Prompts pra jogar melhor os jogos que você já joga, e prompts pra <strong>criar seus próprios jogos simples</strong> — do jogo da velha ao plataforma, prontos pra colar numa IA e testar na hora.</p>

<div class="stats-bar" id="statsBar"></div>

<div class="top-bar">
  <input id="busca" type="search" placeholder="🔎 Buscar modelo para games...">

</div>

  <button id="btnExportar">📥 Exportar todos</button>

</div>

  <div class="sugerir-acoes"><button id="btnCopiarSugestao">📋 Copiar sugestão</button><span class="sugerir-dica">Copie e envie pra gente pelo WhatsApp ou e-mail de suporte 💌</span></div>

</main>

<script>

const dadosBrutos=[
{categoria:'🎓 Entender o Código',nivel:'basico',titulo:'📖 Explicar Como Esse Jogo Funciona',quando:'Para quando você pegou um jogo pronto (aqui do site ou de outro lugar) e quer entender o código, mesmo sem saber programar.',prompt:'Vou colar o código de um jogo que eu gerei/encontrei, e quero entender como ele funciona, mesmo sem saber programar.\n\n[COLE O CÓDIGO DO JOGO AQUI]\n\nExplique de forma simples, como se fosse pra um iniciante completo:\n• O que cada parte principal do código faz (HTML, CSS, JavaScript), sem entrar em detalhes técnicos demais\n• Onde estão as regras do jogo (pontuação, vitória, derrota)\n• Se eu quisesse mudar uma coisa simples (tipo a cor, o texto ou a velocidade), me diga exatamente qual linha eu procuraria\n\nNão reescreva o código, só explique o que já está ali.',en:'I\'m going to paste the code of a game I generated/found, and I want to understand how it works, even without knowing how to code.\n\n[PASTE THE GAME CODE HERE]\n\nExplain it simply, as if for a complete beginner:\n• What each main part of the code does (HTML, CSS, JavaScript), without going into too much technical detail\n• Where the game rules are (scoring, winning, losing)\n• If I wanted to change something simple (like the color, text, or speed), tell me exactly which line I would look for\n\nDo not rewrite the code, just explain what\'s already there.'},
{categoria:'🎮📚 Jogos que Ensinam',nivel:'intermediario',titulo:'🎮📚 Jogo Arcade Educativo (Aprenda Brincando)',quando:'Para quando você quer aprender de verdade brincando — não é um quiz de múltipla escolha, é um jogo de arcade real (tipo cobrinha, nave ou blocos) com o conteúdo educativo dentro da própria jogabilidade.',prompt:'Crie um jogo educativo completo em um único arquivo HTML (com CSS e JavaScript inclusos), jogável no navegador, no estilo: [ESCOLHA: COBRINHA/SNAKE, ESPAÇONAVE/SHOOTER, OU BLOCOS QUE CAEM ESTILO TETRIS]\n\nAssunto que quero aprender brincando: [TEMA, EX: PSORÍASE, TABUADA, PAÍSES E CAPITAIS, VOCABULÁRIO EM INGLÊS]\n\nO jogo deve:\n• Ter a mecânica de jogo de verdade funcionando (movimento, colisão, pontuação) do estilo escolhido\n• Embutir o conteúdo educativo NA jogabilidade (ex: na cobrinha, cada "comida" representa uma pergunta/fato sobre o tema antes de comer; na nave, você atira nas respostas certas e desvia das erradas; nos blocos, cada peça representa um conceito que precisa ser encaixado corretamente)\n• Mostrar uma explicação rápida (1 a 2 frases) sempre que eu acertar ou errar algo, sem travar o jogo\n• Ter pontuação, e aumentar a dificuldade aos poucos\n• Não usar bibliotecas externas — tudo em HTML/CSS/JS puro\n\nNão é um quiz com botões de múltipla escolha — é um jogo de arcade de verdade com o aprendizado embutido na mecânica.',en:'Create a complete educational game in a single HTML file (with CSS and JavaScript included), playable in the browser, in this style: [CHOOSE: SNAKE, SPACESHIP/SHOOTER, OR FALLING BLOCKS LIKE TETRIS]\n\nTopic I want to learn while playing: [TOPIC, EG: PSORIASIS, MULTIPLICATION TABLE, COUNTRIES AND CAPITALS, ENGLISH VOCABULARY]\n\nThe game must:\n• Have the real game mechanics actually working (movement, collision, scoring) for the chosen style\n• Embed the educational content INTO the gameplay itself (eg: in snake, each "food" represents a question/fact about the topic before eating it; in the spaceship, you shoot the correct answers and dodge the wrong ones; in the blocks, each piece represents a concept that needs to be fitted correctly)\n• Show a quick explanation (1 to 2 sentences) whenever I get something right or wrong, without stopping the game\n• Have scoring, and gradually increase difficulty\n• Not use external libraries — pure HTML/CSS/JS only\n\nThis is not a multiple-choice quiz — it\'s a real arcade game with the learning built into the mechanics.'},
{categoria:'🕹️ Criar Jogos',nivel:'basico',titulo:'⭕ Jogo da Velha com Variação',quando:'Para criar um jogo da velha diferente do comum, com uma regra extra.',prompt:'Crie um jogo da velha completo em um único arquivo HTML (com CSS e JavaScript inclusos), jogável no navegador, com esta variação: [DESCREVA A VARIAÇÃO, EX: TABULEIRO 4X4, PEÇAS QUE SOMEM APÓS 3 JOGADAS]. O jogo deve ter: tabuleiro clicável, marcação de vez do jogador, detecção de vitória/empate, e botão de reiniciar. Não use nenhuma biblioteca externa.',en:'Create a complete tic-tac-toe game in a single HTML file (with CSS and JavaScript included), playable in the browser, with this twist: [DESCRIBE THE TWIST, EG: 4X4 BOARD, PIECES THAT DISAPPEAR AFTER 3 MOVES]. The game must have: a clickable board, turn indicator, win/draw detection, and a restart button. Do not use any external library.'},
{categoria:'🕹️ Criar Jogos',nivel:'basico',titulo:'💣 Campo Minado Simples',quando:'Para criar um campo minado básico e funcional.',prompt:'Crie um jogo de Campo Minado completo em um único arquivo HTML, jogável no navegador. Tabuleiro de [LINHAS]x[COLUNAS] com [QUANTIDADE] minas. Deve ter: clique esquerdo para revelar, clique direito para marcar bandeira, contagem de minas ao redor, mensagem de vitória ou derrota, e botão de novo jogo. Não use bibliotecas externas.',en:'Create a complete Minesweeper game in a single HTML file, playable in the browser. Board of [ROWS]x[COLUMNS] with [AMOUNT] mines. It must have: left click to reveal, right click to flag, count of nearby mines, win/lose message, and a new game button. Do not use external libraries.'},
{categoria:'🕹️ Criar Jogos',nivel:'basico',titulo:'🧠 Jogo da Memória',quando:'Para criar um jogo de memória com cartas viradas.',prompt:'Crie um jogo da memória completo em um único arquivo HTML, com [QUANTIDADE] pares de cartas usando emojis como símbolos. O jogo deve: embaralhar as cartas a cada partida, virar 2 cartas por vez, comparar automaticamente, contar tentativas e tempo, e mostrar mensagem de vitória. Não use bibliotecas externas.',en:'Create a complete memory match game in a single HTML file, with [AMOUNT] pairs of cards using emojis as symbols. The game should: shuffle the cards each round, flip 2 cards at a time, compare them automatically, count attempts and time, and show a win message. Do not use external libraries.'},
{categoria:'🕹️ Criar Jogos',nivel:'basico',titulo:'🎯 Adivinhe o Número',quando:'Para criar um joguinho simples de adivinhação com dicas.',prompt:'Crie um jogo de "Adivinhe o Número" em um único arquivo HTML. A IA (JavaScript) sorteia um número entre [MÍNIMO] e [MÁXIMO], o jogador digita palpites, e o jogo responde se é "maior" ou "menor", contando quantas tentativas foram usadas até acertar. Inclua botão de jogar novamente.',en:'Create a "Guess the Number" game in a single HTML file. The game (JavaScript) picks a random number between [MINIMUM] and [MAXIMUM], the player types guesses, and the game responds "higher" or "lower", counting how many attempts were used until correct. Include a play again button.'},
{categoria:'🕹️ Criar Jogos',nivel:'intermediario',titulo:'🐍 Jogo da Cobrinha (Snake)',quando:'Para criar o clássico jogo da cobrinha com teclado.',prompt:'Crie o jogo da Cobrinha (Snake) completo em um único arquivo HTML usando canvas. Controle por setas do teclado, comida que aparece em posição aleatória, cobra que cresce ao comer, detecção de colisão com a parede e com o próprio corpo, contador de pontuação, e tela de "Game Over" com opção de reiniciar. Não use bibliotecas externas.',en:'Create the complete Snake game in a single HTML file using canvas. Arrow key controls, food appearing at random positions, snake growing when eating, collision detection with walls and itself, score counter, and a "Game Over" screen with a restart option. Do not use external libraries.'},
{categoria:'🕹️ Criar Jogos',nivel:'intermediario',titulo:'🏓 Pong Simples',quando:'Para criar o jogo Pong clássico, contra o computador.',prompt:'Crie o jogo Pong completo em um único arquivo HTML usando canvas. Uma raquete controlada pelo jogador (mouse ou teclado) e outra controlada por uma IA simples. Bola que quica nas paredes e raquetes, contador de pontuação de cada lado, e o jogo deve reiniciar a rodada após cada ponto. Não use bibliotecas externas.',en:'Create the complete Pong game in a single HTML file using canvas. One paddle controlled by the player (mouse or keyboard) and another controlled by a simple AI. Ball that bounces off walls and paddles, score counter for each side, and the game should restart the round after each point. Do not use external libraries.'},
{categoria:'🕹️ Criar Jogos',nivel:'intermediario',titulo:'🧩 Quebra-Cabeça Deslizante',quando:'Para criar o clássico jogo dos 15 números deslizantes.',prompt:'Crie um Quebra-Cabeça Deslizante (15-puzzle) completo em um único arquivo HTML, com um tabuleiro [TAMANHO]x[TAMANHO] usando números ou emojis. O jogador clica numa peça adjacente ao espaço vazio para movê-la. Inclua embaralhamento garantindo que o quebra-cabeça seja sempre solucionável, contador de movimentos, e detecção automática de vitória.',en:'Create a complete Sliding Puzzle (15-puzzle) in a single HTML file, with a [SIZE]x[SIZE] board using numbers or emojis. The player clicks a tile adjacent to the empty space to move it. Include shuffling that guarantees the puzzle is always solvable, a move counter, and automatic win detection.'},
{categoria:'🕹️ Criar Jogos',nivel:'avancado',titulo:'🚀 Mini Jogo de Plataforma',quando:'Para criar um jogo de plataforma básico, com pulo e gravidade.',prompt:'Crie um mini jogo de plataforma (platformer) em um único arquivo HTML usando canvas. Personagem controlado pelas setas do teclado, com gravidade e física de pulo simples. Inclua algumas plataformas fixas, um objetivo a ser alcançado (ex: chegar numa bandeira), e reinício automático se o personagem cair. Tema visual: [DESCREVA O TEMA, EX: ESPACIAL, FLORESTA]. Não use bibliotecas externas.',en:'Create a mini platformer game in a single HTML file using canvas. Character controlled by arrow keys, with gravity and simple jump physics. Include a few fixed platforms, a goal to reach (eg: reaching a flag), and automatic restart if the character falls. Visual theme: [DESCRIBE THE THEME, EG: SPACE, FOREST]. Do not use external libraries.'},
{categoria:'🕹️ Criar Jogos',nivel:'avancado',titulo:'♟️ Damas Completo',quando:'Para criar o jogo de damas com regras completas, 2 jogadores no mesmo dispositivo.',prompt:'Crie o jogo de Damas completo em um único arquivo HTML, para 2 jogadores no mesmo dispositivo (alternando turnos). Implemente: tabuleiro 8x8, movimento diagonal das peças, captura obrigatória de peças adversárias saltando sobre elas, promoção a dama ao chegar no fim do tabuleiro, e detecção de fim de jogo. Não use bibliotecas externas.',en:'Create the complete Checkers game in a single HTML file, for 2 players on the same device (alternating turns). Implement: 8x8 board, diagonal piece movement, mandatory capture of opponent pieces by jumping over them, promotion to king upon reaching the far row, and end-of-game detection. Do not use external libraries.'},
{categoria:'🕹️ Criar Jogos',nivel:'avancado',titulo:'🎮 Jogo com Pontuação e Níveis',quando:'Para transformar um jogo simples em algo com progressão e dificuldade crescente.',prompt:'Pegue este jogo que já tenho: [COLE O CÓDIGO OU DESCREVA O JOGO], e adicione um sistema de níveis com dificuldade progressiva (ex: velocidade aumenta, menos tempo, mais obstáculos a cada nível), um sistema de pontuação com recorde salvo (usando localStorage), e uma tela inicial com botão de "Jogar". Mantenha o restante do jogo funcionando como já está.',en:'Take this game I already have: [PASTE THE CODE OR DESCRIBE THE GAME], and add a level system with progressive difficulty (eg: speed increases, less time, more obstacles each level), a scoring system with a saved high score (using localStorage), and a start screen with a "Play" button. Keep the rest of the game working as it already does.'},
{categoria:'🌐 Jogos Online (com um amigo)',nivel:'intermediario',titulo:'⭕ Jogo da Velha Online (2 Jogadores)',quando:'Para jogar com outra pessoa pelo celular, cada um no seu aparelho, à distância.',prompt:'Crie um Jogo da Velha online para 2 jogadores, jogável no celular, cada um em seu próprio aparelho, usando Firebase Firestore (gratuito) para sincronizar as jogadas em tempo real. O jogo deve: gerar um código de sala ao criar o jogo, permitir que o segundo jogador entre digitando esse código, mostrar de quem é a vez, atualizar o tabuleiro automaticamente para os dois jogadores, e detectar vitória/empate. Explique passo a passo como eu crio um projeto Firebase gratuito e onde colar as chaves de configuração no código. Entregue o HTML, CSS e JavaScript completos em um único arquivo.',en:'Create an online Tic-Tac-Toe game for 2 players, playable on mobile, each on their own device, using Firebase Firestore (free tier) to sync moves in real time. The game should: generate a room code when creating the game, let the second player join by typing that code, show whose turn it is, update the board automatically for both players, and detect win/draw. Explain step by step how to create a free Firebase project and where to paste the config keys in the code. Deliver the complete HTML, CSS and JavaScript in a single file.'},
{categoria:'🌐 Jogos Online (com um amigo)',nivel:'avancado',titulo:'🚢 Batalha Naval Online',quando:'Para jogar Batalha Naval completo com um amigo à distância.',prompt:'Crie um jogo de Batalha Naval online para 2 jogadores, jogável no celular, cada um em seu próprio aparelho, usando Firebase Firestore para sincronizar em tempo real. O jogo deve ter: fase de posicionar os navios no próprio tabuleiro (privado), código de sala para o amigo entrar, alternância de turnos para atirar no tabuleiro do adversário, indicação de acerto/erro, e detecção de vitória quando todos os navios do oponente forem afundados. Explique como configurar o Firebase gratuito. Entregue o HTML, CSS e JavaScript completos em um único arquivo.',en:'Create an online Battleship game for 2 players, playable on mobile, each on their own device, using Firebase Firestore to sync in real time. The game should have: a ship placement phase on your own board (private), a room code for a friend to join, alternating turns to fire at the opponent board, hit/miss indication, and win detection when all opponent ships are sunk. Explain how to set up free Firebase. Deliver the complete HTML, CSS and JavaScript in a single file.'},
{categoria:'🌐 Jogos Online (com um amigo)',nivel:'intermediario',titulo:'🔤 Forca Online (2 Jogadores)',quando:'Para um jogador escolher a palavra e o outro tentar adivinhar, à distância.',prompt:'Crie um jogo da Forca (Hangman) online para 2 jogadores, jogável no celular, usando Firebase Firestore para sincronizar em tempo real. Um jogador cria a sala e digita a palavra secreta (escondida do outro), gera um código de sala, e o segundo jogador entra com esse código para tentar adivinhar letra por letra. Mostre o número de erros restantes, as letras já tentadas, e uma mensagem de vitória ou derrota visível pros dois. Explique como configurar o Firebase gratuito. Entregue o HTML, CSS e JavaScript completos em um único arquivo.',en:'Create an online Hangman game for 2 players, playable on mobile, using Firebase Firestore to sync in real time. One player creates the room and types the secret word (hidden from the other), generates a room code, and the second player joins with that code to guess letter by letter. Show remaining wrong guesses, letters already tried, and a win/loss message visible to both. Explain how to set up free Firebase. Deliver the complete HTML, CSS and JavaScript in a single file.'},
{categoria:'🌐 Jogos Online (com um amigo)',nivel:'avancado',titulo:'❓ Quiz Online por Turnos',quando:'Para criar um quiz de perguntas e respostas competitivo entre dois jogadores.',prompt:'Crie um Quiz online para 2 jogadores, jogável no celular, usando Firebase Firestore para sincronizar em tempo real. Tema das perguntas: [TEMA]. O jogo deve: sortear [QUANTIDADE] perguntas de múltipla escolha sobre o tema, gerar código de sala pro segundo jogador entrar, mostrar a pontuação de cada jogador ao vivo, alternar ou sincronizar as respostas por rodada, e mostrar o resultado final com o vencedor. Explique como configurar o Firebase gratuito. Entregue o HTML, CSS e JavaScript completos em um único arquivo, com as perguntas já incluídas no código.',en:'Create an online Quiz for 2 players, playable on mobile, using Firebase Firestore to sync in real time. Question topic: [TOPIC]. The game should: draw [AMOUNT] multiple-choice questions about the topic, generate a room code for the second player to join, show both players scores live, sync answers per round, and show the final result with the winner. Explain how to set up free Firebase. Deliver the complete HTML, CSS and JavaScript in a single file, with the questions already included in the code.'},
{categoria:'🌐 Jogos Online (com um amigo)',nivel:'avancado',titulo:'🎨 Desenhe e Adivinhe Online',quando:'Para um jogador desenhar e o outro tentar adivinhar o que é, à distância.',prompt:'Crie um jogo de Desenhe e Adivinhe online para 2 jogadores, jogável no celular, usando Firebase Firestore para sincronizar em tempo real. Um jogador recebe uma palavra secreta e desenha num canvas simples de toque; o traço deve aparecer ao vivo pro outro jogador, que tenta adivinhar digitando palpites. Inclua código de sala, cronômetro da rodada, e alternância de quem desenha a cada rodada. Explique como configurar o Firebase gratuito. Entregue o HTML, CSS e JavaScript completos em um único arquivo.',en:'Create an online Draw and Guess game for 2 players, playable on mobile, using Firebase Firestore to sync in real time. One player gets a secret word and draws on a simple touch canvas; the strokes should appear live to the other player, who tries to guess by typing. Include a room code, a round timer, and alternating who draws each round. Explain how to set up free Firebase. Deliver the complete HTML, CSS and JavaScript in a single file.'},

, CSS and JavaScript in a single file, making it very clear where to paste each configuration key.'},

const prompts=dadosBrutos.map((x,i)=>{
  const obj={id:'game-'+i,categoria:x.categoria,nivel:x.nivel,titulo:x.titulo,quando:x.quando,prompt:x.prompt,promptEn:x.en,novo:i<10};
  obj.placeholders=[...new Set((obj.prompt.match(/\[([^\]]+)\]/g)||[]).map(s=>s.slice(1,-1)))];
  return obj;
});

const idiomaAtivo={};
let categoriaAtual='todos';

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function nivelLabel(n){return n==='avancado'?'🔴 Avançado':n==='intermediario'?'🟡 Intermediário':'🟢 Básico'}
function mostrarToast(texto){const t=document.getElementById('toast');if(!t)return;t.textContent=texto;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}

function _loadFav(){try{return JSON.parse(localStorage.getItem('deltaFavoritos'))||[]}catch(e){return[]}}
function _saveFav(l){try{localStorage.setItem('deltaFavoritos',JSON.stringify(l))}catch(e){}}
function isFav(id){return _loadFav().some(f=>f.id===id)}
function textoBase(id){const p=getItem(id);if(!p)return'';return idiomaAtivo[id]==='en'?(p.promptEn||p.prompt):p.prompt}
function textoFinal(id){const p=getItem(id);if(!p)return'';let t=textoBase(id);(p.placeholders||[]).forEach((ph,idx)=>{const el=document.getElementById('campo-'+id+'-'+idx);const val=el?el.value.trim():'';if(val){const re=new RegExp('\\['+ph.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]','g');t=t.replace(re,val)}});return t}
function getItem(id){return prompts.find(p=>p.id===id)}
function atualizarBtnFav(id,btn){if(!btn)return;if(isFav(id)){btn.textContent='❤️ Favoritado';btn.classList.add('is-fav')}else{btn.textContent='🤍 Favoritar';btn.classList.remove('is-fav')}}
function favoritar(id,btn){const p=getItem(id);if(!p)return;let l=_loadFav();const idx=l.findIndex(f=>f.id===id);if(idx===-1){l.unshift({id,titulo:p.titulo,texto:textoFinal(id),categoria:'Games',createdAt:Date.now()});_saveFav(l);mostrarToast('💖 Adicionado aos favoritos!')}else{l.splice(idx,1);_saveFav(l);mostrarToast('🤍 Removido dos favoritos')}atualizarBtnFav(id,btn);window.dispatchEvent(new CustomEvent('delta:favoritos-updated'))}

function _loadUsos(){try{return JSON.parse(localStorage.getItem('deltaGamesUsos'))||{}}catch(e){return{}}}
function _saveUsos(o){try{localStorage.setItem('deltaGamesUsos',JSON.stringify(o))}catch(e){}}
function registrarUso(id){const usos=_loadUsos();usos[id]=(usos[id]||0)+1;_saveUsos(usos)}

function _loadFeedback(){try{return JSON.parse(localStorage.getItem('deltaGamesFeedback'))||{}}catch(e){return{}}}
function _saveFeedback(o){try{localStorage.setItem('deltaGamesFeedback',JSON.stringify(o))}catch(e){}}

// ===== QUAL IA RESPONDEU MELHOR =====
function _loadPreferenciaIA(){try{return JSON.parse(localStorage.getItem('deltaGamesPreferenciaIA'))||{}}catch(e){return{}}}
function _savePreferenciaIA(o){try{localStorage.setItem('deltaGamesPreferenciaIA',JSON.stringify(o))}catch(e){}}
function darPreferenciaIA(id,ia){
  const pref=_loadPreferenciaIA();const atual=pref[id];
  const g=window.deltaAuth;
  if(atual===ia){delete pref[id];if(g&&g.registrarPreferenciaIA)g.registrarPreferenciaIA(id,ia,-1)}
  else{if(atual&&g&&g.registrarPreferenciaIA)g.registrarPreferenciaIA(id,atual,-1);pref[id]=ia;if(g&&g.registrarPreferenciaIA)g.registrarPreferenciaIA(id,ia,1)}
  _savePreferenciaIA(pref);atualizarPreferenciaIAUI(id);
  mostrarToast(atual===ia?'Marcação removida':'✅ Valeu por avaliar!');
}
function atualizarPreferenciaIAUI(id){
  const pref=_loadPreferenciaIA()[id];
  const btnChat=document.getElementById('prefchat-'+id),btnGem=document.getElementById('prefgem-'+id),btnEmp=document.getElementById('prefemp-'+id);
  if(btnChat)btnChat.classList.toggle('marcado',pref==='chatgpt');
  if(btnGem)btnGem.classList.toggle('marcado',pref==='gemini');
  if(btnEmp)btnEmp.classList.toggle('marcado',pref==='empate');
  const g=window.deltaAuth;
  if(g&&g.obterPreferenciaIA){g.obterPreferenciaIA(id).then(r=>{
    const total=(r.chatgpt||0)+(r.gemini||0)+(r.empate||0);
    if(btnChat)btnChat.textContent='🤖 ChatGPT'+(total?' ('+r.chatgpt+')':'');
    if(btnGem)btnGem.textContent='✨ Gemini'+(total?' ('+r.gemini+')':'');
    if(btnEmp)btnEmp.textContent='🤝 Empate'+(total?' ('+r.empate+')':'');
  })}
}

function _loadCriados(){try{return JSON.parse(localStorage.getItem('deltaGamesCriados'))||[]}catch(e){return[]}}
function _saveCriados(l){try{localStorage.setItem('deltaGamesCriados',JSON.stringify(l))}catch(e){}}
function estaCriado(id){return _loadCriados().includes(id)}
function toggleCriado(id){
  let l=_loadCriados();const idx=l.indexOf(id);
  if(idx===-1){l.push(id);mostrarToast('✅ Marcado como já criado!')}
  else{l.splice(idx,1);mostrarToast('Desmarcado')}

}
function atualizarBtnCriado(id){
  const btn=document.getElementById('criado-'+id);if(!btn)return;

function _loadProjetosGames(){try{return JSON.parse(localStorage.getItem('deltaGamesProjetos'))||{}}catch(e){return{}}}
function _saveProjetosGames(o){try{localStorage.setItem('deltaGamesProjetos',JSON.stringify(o))}catch(e){}}
function projetoDoGame(id){return _loadProjetosGames()[id]||''}
function todosProjetosGames(){return[...new Set(Object.values(_loadProjetosGames()).filter(Boolean))]}
function moverParaProjetoGame(id,nome){
  const p=_loadProjetosGames();
  if(nome&&nome.trim())p[id]=nome.trim();else delete p[id];

  atualizarDatalistProjetosGames();
  render();
}

function darFeedback(id,tipo){
  const fb=_loadFeedback();const atual=fb[id]&&fb[id].voto;if(!fb[id])fb[id]={voto:null};
  const g=window.deltaAuth;
  if(atual===tipo){fb[id].voto=null;if(g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,tipo,-1)}
  else{if(atual&&g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,atual,-1);fb[id].voto=tipo;if(g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,tipo,1)}
  _saveFeedback(fb);atualizarFeedbackUI(id);
  mostrarToast(tipo==='up'?'👍 Obrigado pelo feedback!':'👎 Obrigado, vamos melhorar esse!');
}
function atualizarFeedbackUI(id){
  const fb=_loadFeedback()[id]||{voto:null};
  const up=document.getElementById('fbup-'+id),down=document.getElementById('fbdown-'+id);
  if(up)up.classList.toggle('marcado',fb.voto==='up');
  if(down)down.classList.toggle('marcado',fb.voto==='down');
  const g=window.deltaAuth;
  if(g&&g.obterFeedbackGlobal){g.obterFeedbackGlobal(id).then(r=>{if(up)up.textContent='👍 '+(r.up||0);if(down)down.textContent='👎 '+(r.down||0)})}
}

function alternarIdioma(id){
  idiomaAtivo[id]=idiomaAtivo[id]==='en'?'pt':'en';
  const pre=document.getElementById('prompt-'+id),btn=document.getElementById('idioma-'+id);
  if(pre)pre.textContent=textoFinal(id);
  if(btn){btn.textContent=idiomaAtivo[id]==='en'?'🇧🇷 Ver em Português':'🌐 View in English';btn.classList.toggle('ativo-en',idiomaAtivo[id]==='en')}
}
async function copiarPorId(id){registrarUso(id);try{await navigator.clipboard.writeText(textoFinal(id));mostrarToast('📋 Copiado!')}catch(e){mostrarToast('Não foi possível copiar')}}
async function abrirChat(id){registrarUso(id);try{await navigator.clipboard.writeText(textoFinal(id))}catch(e){}mostrarToast('✓ Copiado! Abrindo...');setTimeout(()=>window.open('https://chatgpt.com/','_blank'),300)}
async function abrirGemini(id){registrarUso(id);try{await navigator.clipboard.writeText(textoFinal(id))}catch(e){}mostrarToast('✓ Copiado! Abrindo...');setTimeout(()=>window.open('https://gemini.google.com/app','_blank'),300)}
function compartilhar(id){
  const p=getItem(id);if(!p)return;
  const texto='🎮 '+p.titulo+'\n\n'+textoFinal(id)+'\n\n— via Delta Prompts';
  if(navigator.share){navigator.share({title:p.titulo,text:texto}).catch(()=>{})}
  else{navigator.clipboard.writeText(texto).then(()=>mostrarToast('🔗 Copiado! Cole onde quiser compartilhar.'))}
}
function exportarTodos(){
  const linhas=prompts.map(p=>p.titulo+' ('+p.categoria+')\n'+p.prompt);
  const blob=new Blob(['🎮 GAMES COM IA — DELTA PROMPTS\n\n'+linhas.join('\n\n'+'─'.repeat(40)+'\n\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='delta-prompts-games.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  mostrarToast('📥 Arquivo baixado!');
}
function toggleSugerir(){const box=document.getElementById('sugerirBox');box.style.display=(box.style.display==='none'||!box.style.display)?'block':'none'}
function copiarSugestao(){const texto=document.getElementById('sugestaoTexto').value.trim();if(!texto){mostrarToast('Escreva sua ideia antes de copiar 🙂');return}navigator.clipboard.writeText('💡 Sugestão para o Delta Prompts (Games):\n\n'+texto).then(()=>mostrarToast('📋 Sugestão copiada! Envie pra gente 💌'))}
function atualizarStats(){const favs=_loadFav().filter(f=>f.categoria==='Games').length;document.getElementById('statsBar').innerHTML='⭐ Você já favoritou <strong>'+favs+'</strong> modelo'+(favs===1?'':'s')+' · 🎮 <strong>'+prompts.length+'</strong> modelos disponíveis'}
function aplicarTema(t){document.documentElement.setAttribute('data-theme',t);const btn=document.getElementById('themeToggle');if(btn)btn.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('deltaTheme',t)}catch(e){}}

function montarFiltroCategoria(){
  const cont=document.getElementById('filtrosCategoria');
  const categorias=[...new Set(prompts.map(p=>p.categoria))];
  cont.innerHTML='<button class="'+(categoriaAtual==='todos'?'ativo':'')+'" data-categoria="todos">Todos <span class="count-badge">'+prompts.length+'</span></button>'+
    categorias.map(c=>{const n=prompts.filter(p=>p.categoria===c).length;return `<button class="${categoriaAtual===c?'ativo':''}" data-categoria="${c}">${c} <span class="count-badge">${n}</span></button>`}).join('');
  cont.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{categoriaAtual=b.dataset.categoria;montarFiltroCategoria();render()}));
}

function render(){
  const termo=norm(document.getElementById('busca').value);
  const filtrados=prompts.filter(p=>{
    const texto=norm([p.titulo,p.quando,p.categoria,p.prompt].join(' '));
    return(!termo||texto.includes(termo))&&(categoriaAtual==='todos'||p.categoria===categoriaAtual);
  });
  document.getElementById('contador').textContent=filtrados.length+' de '+prompts.length+' modelos';
  const lista=document.getElementById('lista');
  lista.innerHTML=filtrados.length?filtrados.map(p=>`
    <section class="card" id="card-${p.id}">
      <span class="tag">${p.categoria}</span><span class="nivel nivel-${p.nivel}">${nivelLabel(p.nivel)}</span>
      <h3>${p.titulo}</h3>
      <p style="color:#667085;font-size:14px">📌 ${p.quando}</p>
      ${p.placeholders.length?`<div class="campos-preenchimento">${p.placeholders.map((ph,idx)=>`<label class="campo-label">✏️ ${ph}<input type="text" id="campo-${p.id}-${idx}" placeholder="Preencha antes de copiar (opcional)"></label>`).join('')}</div>`:''}
      <div class="prompt-text" id="prompt-${p.id}">${p.prompt}</div>
      <div class="acoes">
        <button data-acao="copiar" data-id="${p.id}">📋 Copiar</button>
        <button class="favoritar" data-acao="favoritar" data-id="${p.id}">🤍 Favoritar</button>
        <button data-acao="chat" data-id="${p.id}">🤖 ChatGPT</button>
        <button data-acao="gemini" data-id="${p.id}">✨ Gemini</button>
        <button class="compartilhar" data-acao="compartilhar" data-id="${p.id}">🔗 Compartilhar</button>
        <button class="idioma" id="idioma-${p.id}" data-acao="idioma" data-id="${p.id}">🌐 View in English</button>
      </div>
      <div class="feedback-row"><span style="font-size:12px;color:#8a92a6">Esse modelo te ajudou?</span><button id="fbup-${p.id}" data-acao="fbup" data-id="${p.id}">👍 0</button><button id="fbdown-${p.id}" data-acao="fbdown" data-id="${p.id}">👎 0</button></div>
    </section>`).join('') : '<div style="text-align:center;padding:30px;opacity:.7">🔎 Nenhum modelo encontrado.</div>';

  filtrados.forEach(p=>{atualizarBtnFav(p.id,document.querySelector('#card-'+p.id+' .favoritar'));atualizarFeedbackUI(p.id)});
}

document.getElementById('lista').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-acao]');
  if(!btn)return;
  const acao=btn.dataset.acao,id=btn.dataset.id;
  if(acao==='copiar')copiarPorId(id);
  else if(acao==='chat')abrirChat(id);
  else if(acao==='gemini')abrirGemini(id);
  else if(acao==='idioma')alternarIdioma(id);
  else if(acao==='favoritar')favoritar(id,btn);
  else if(acao==='compartilhar')compartilhar(id);
  else if(acao==='fbup')darFeedback(id,'up');
  else if(acao==='fbdown')darFeedback(id,'down');
});

document.getElementById('busca').addEventListener('input',render);
document.getElementById('btnExportar').addEventListener('click',exportarTodos);
document.getElementById('btnSugerir').addEventListener('click',toggleSugerir);
document.getElementById('btnCopiarSugestao').addEventListener('click',copiarSugestao);
document.getElementById('themeToggle').addEventListener('click',()=>{const atual=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';aplicarTema(atual)});

aplicarTema((function(){try{return localStorage.getItem('deltaTheme')||'light'}catch(e){return'light'}})());
montarFiltroCategoria();
atualizarStats();
render();
window.addEventListener('delta:favoritos-updated',atualizarStats);
</script></body></html>
