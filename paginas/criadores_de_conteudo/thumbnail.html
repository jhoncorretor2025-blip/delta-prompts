<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Thumbnail Estratégica | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Prompts profissionais para criação de Thumbnails com IA. Aumente seu CTR com estratégias de polêmica, segredo revelado e design mobile-first na Delta Prompts.">
<meta name="keywords" content="prompts thumbnail, thumbnail youtube ia, aumentar ctr youtube, prompt para thumbnail, design youtube mobile">
<meta name="author" content="Delta Prompts">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css">
</head>

<body>

<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js"></script>

<main>

<h1>🖼 Thumbnail Estratégica com IA</h1>

<p>
Prompts profissionais para criar thumbnails magnéticas, aumentar CTR e dominar o mobile.
</p>

<section class="card">
<h3>🎯 Objetivo</h3>
<p>
Ajudar criadores a desenvolver thumbnails que param o scroll, geram curiosidade e aumentam a taxa de cliques.
</p>
</section>

<div class="top-bar">
<input
type="text"
id="busca"
placeholder="🔎 Buscar modelo..."
oninput="filtrarPrompts()"
>
<div class="contador" id="contador"></div>
</div>

<div class="filtro-nivel">
<button onclick="filtrarNivel(event, 'todos')" class="ativo">Todos</button>
<button onclick="filtrarNivel(event, 'basico')">🟢 Básico</button>
<button onclick="filtrarNivel(event, 'intermediario')">🟡 Intermediário</button>
<button onclick="filtrarNivel(event, 'avancado')">🔴 Avançado</button>
</div>

<div id="lista-prompts"></div>

</main>

<script>

const ordemCategorias = [
"🔥 Magnética",
"🎯 Mais Cliques",
"📱 Mobile"
];

const prompts = [

{
  categoria: "🔥 Magnética",
  nivel: "basico",
  titulo: "Thumbnail Magnética Simples",
  quando: "Para vídeos que precisam chamar atenção imediatamente.",
  tipo: "Vlog / Tutorial / Gaming",
  prompt: `Tema: [INSIRA SEU TEMA AQUI]

Crie uma thumbnail magnética com:

- Texto curto (máx 3 palavras)
- Fundo contrastante
- Expressão facial forte
- Elemento visual central destacado

Objetivo: parar o scroll imediatamente.`
},

{
  categoria: "🎯 Mais Cliques",
  nivel: "basico",
  titulo: "Thumbnail com Número Forte",
  quando: "Quando o vídeo apresenta lista ou promessa objetiva.",
  tipo: "Tutorial / Lista / Review",
  prompt: `Tema: [INSIRA SEU TEMA AQUI]

Crie uma thumbnail focada em número forte:

- Número grande e chamativo
- Texto curto de apoio
- Fundo simples com alto contraste
- Expressão coerente com o resultado

Objetivo: gerar curiosidade e clique.`
},

{
  categoria: "📱 Mobile",
  nivel: "basico",
  titulo: "Thumbnail Ultra Simples Mobile",
  quando: "Quando a audiência é majoritariamente mobile.",
  tipo: "Shorts / Conteúdo rápido",
  prompt: `Tema: [INSIRA SEU TEMA AQUI]

Crie uma thumbnail otimizada para celular:

- Máximo 3 palavras
- Texto extremamente grande
- Fundo simples
- Um único elemento principal

Objetivo: ser entendida em 1 segundo durante o scroll.`
}

];

const lista = document.getElementById("lista-prompts");
const contador = document.getElementById("contador");
const busca = document.getElementById("busca");

function renderizar(arr) {

lista.innerHTML = "";
contador.innerText = `Total: ${arr.length} modelo${arr.length !== 1 ? "s" : ""}`;

ordemCategorias.forEach(cat => {

const grupo = arr.filter(p => p.categoria === cat);
if (grupo.length === 0) return;

const tituloSecao = document.createElement("h2");
tituloSecao.className = "secao-titulo";
tituloSecao.innerText = cat;
lista.appendChild(tituloSecao);

grupo.forEach(p => {

const card = document.createElement("div");
card.className = "card";
card.setAttribute("data-nivel", p.nivel);

card.innerHTML = `
<div class="nivel nivel-${p.nivel}">
${p.nivel === 'avancado' ? '🔴 Avançado' :
p.nivel === 'intermediario' ? '🟡 Intermediário' :
'🟢 Básico'}
</div>

<h3>${p.titulo}</h3>

<p class="meta"><strong>Tipo:</strong> ${p.tipo || "Geral"}</p>

<p><strong>📌 Quando usar:</strong> ${p.quando}</p>

<pre class="prompt-text">${p.prompt}</pre>

<p class="meta">
⚙️ <strong>Personalize:</strong> Substitua os textos entre colchetes como <b>[INSIRA SEU TEMA AQUI]</b>.
</p>

<div class="acoes">
<button class="btn-copy" onclick="copiar(this)">📋 Copiar</button>
<button class="btn-chat" onclick="chat(this)">💬 ChatGPT</button>
<button class="btn-gemini" onclick="gemini(this)">🔷 Gemini</button>
<button class="btn-favorito">☆ Favoritar</button>
</div>
`;

lista.appendChild(card);

});

});

}

function filtrarPrompts() {
const termo = busca.value.toLowerCase();
const filtrados = prompts.filter(p =>
p.titulo.toLowerCase().includes(termo) ||
p.prompt.toLowerCase().includes(termo) ||
p.categoria.toLowerCase().includes(termo)
);
renderizar(filtrados);
}

function filtrarNivel(event, nivel) {

const botoes = document.querySelectorAll(".filtro-nivel button");
botoes.forEach(btn => btn.classList.remove("ativo"));
event.target.classList.add("ativo");

renderizar(
nivel === "todos"
? prompts
: prompts.filter(p => p.nivel === nivel)
);

}

renderizar(prompts);

</script>

<script src="/delta-prompts/funcoes.js"></script>

<style>
.top-bar {
display: flex;
gap: 15px;
align-items: center;
margin: 20px 0;
flex-wrap: wrap;
}

.top-bar input {
flex: 1;
padding: 14px;
border-radius: 10px;
border: 1px solid #e5e7eb;
}

.contador {
font-size: 14px;
opacity: 0.75;
}

.meta {
font-size: 13px;
opacity: 0.75;
margin-bottom: 8px;
}

pre {
white-space: pre-wrap;
font-size: 14px;
background: #f9fafb;
padding: 15px;
border-radius: 10px;
border: 1px solid #e5e7eb;
}
</style>

</body>
</html>
