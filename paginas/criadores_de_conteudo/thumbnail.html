<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Thumbnail Estratégica | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css">

</head>
<body>

<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js"></script>

<main>

<h1>🖼 Thumbnail Estratégica com IA</h1>

<p>
Prompts profissionais para criar thumbnails magnéticas, com alto CTR e totalmente otimizadas para mobile.
</p>

<section class="card">
<h3>🎯 Objetivo</h3>
<p>
Ajudar criadores a desenvolver thumbnails que param o scroll, geram curiosidade e aumentam a taxa de cliques.
</p>
</section>

<div class="top-bar">
<input
type="text"
id="busca"
placeholder="🔎 Buscar modelo de thumbnail..."
oninput="filtrarPrompts()"
>
<div class="contador" id="contador"></div>
</div>

<div class="filtro-nivel">
<button onclick="filtrarNivel(event, 'todos')" class="ativo">Todos</button>
<button onclick="filtrarNivel(event, 'basico')">🟢 Básico</button>
<button onclick="filtrarNivel(event, 'intermediario')">🟡 Intermediário</button>
<button onclick="filtrarNivel(event, 'avancado')">🔴 Avançado</button>
</div>

<div id="lista-prompts"></div>

</main>

<script>

const ordemCategorias = [
"🔥 Magnética",
"🎯 Mais Cliques",
"📱 Mobile"
];

const prompts = [

{
categoria: "🔥 Magnética",
nivel: "basico",
titulo: "Thumbnail Magnética Simples",
quando: "Para vídeos gerais que precisam chamar atenção rápida",
prompt: `Crie uma thumbnail magnética para YouTube.

Tema: [TEMA]

Use:
- Texto grande (máx 3 palavras)
- Fundo com alto contraste
- Expressão facial forte
- Elemento visual central destacado

Objetivo: parar o scroll imediatamente.`
},

  {
  categoria: "📱 Mobile",
  nivel: "avancado",
  titulo: "ThumbMagnet Mobile — Público Feminino IA",
  quando: "Quando quiser criar conceitos de thumbnail altamente clicáveis para vídeos sobre Inteligência Artificial voltados para mulheres iniciantes.",
  prompt: `🔥 PROMPT DEFINITIVO — ThumbMagnet Mobile

Quero que você atue como meu assistente especialista chamado ThumbMagnet Mobile, focado em criar thumbnails altamente virais para YouTube.

Contexto do canal:

Nicho: Inteligência Artificial e tecnologias
Público: 90% mulheres
Nível da audiência: iniciante
Eu apareço em todas as thumbnails
Foco total em visualização via celular
Objetivo principal: aumentar CTR e potencial de viralização

Sua missão é criar conceitos de thumbnail que:

Sejam extremamente claros em tela pequena
Gerem curiosidade imediata
Conectem emocionalmente com mulheres
Transmitam tecnologia de forma acessível
Misturem feminilidade + autoridade + modernidade

Você deve aplicar:

• Psicologia das cores voltada ao público feminino
• Design mobile-first (leitura em menos de 1 segundo)
• Máximo de 3 a 5 palavras
• Letras grossas, com alto contraste
• Fundo simples e impactante
• Foco principal no meu rosto como elemento emocional
• Estética moderna, limpa e tecnológica

Sempre entregue no seguinte formato:

TEXTO PRINCIPAL DA THUMBNAIL

PALETA DE CORES:
Fundo:
Texto:
Elementos de destaque:

EXPRESSÃO FACIAL RECOMENDADA:

COMPOSIÇÃO:

ELEMENTOS VISUAIS EXTRAS:

EMOÇÃO QUE PRECISA PROVOCAR:

JUSTIFICATIVA ESTRATÉGICA:

REGRAS OBRIGATÓRIAS:

Nada genérico
Nada poluído
Nada técnico demais
Nada com muito texto
Sempre priorizar leitura instantânea
Sempre considerar que estou presente na imagem
Se a ideia não tiver alto potencial de clique, reformule
Se necessário, gere 3 variações diferentes para testar CTR.`
},

  {
  categoria: "🎯 Mais Cliques",
  nivel: "avancado",
  titulo: "Thumbnail de Polêmica Estratégica",
  quando: "Quando o vídeo envolve opinião forte, erro, crítica ou quebra de expectativa.",
  prompt: `Você é um especialista em thumbnails de alto impacto focadas em polêmica e CTR extremo.

Crie uma thumbnail altamente clicável para o tema: [INSIRA TEMA]

Objetivo:
Gerar tensão, conflito visual e curiosidade imediata.

A thumbnail deve incluir:

- Expressão facial intensa (choque, indignação, dúvida ou surpresa)
- Texto curto e provocativo (máximo 3 palavras)
- Contraste forte de cores
- Elemento visual que sugira conflito (seta, X vermelho, comparação, reação exagerada)
- Fundo simples e dramático

Estratégia:
- Criar sensação de "isso vai dar problema"
- Estimular curiosidade sem revelar tudo
- Induzir clique por tensão emocional

Explique por que essa thumbnail gera alto CTR.`
},

  {
  categoria: "🎯 Mais Cliques",
  nivel: "basico",
  titulo: "Thumbnail de Polêmica Simples",
  quando: "Quando o vídeo envolve opinião forte ou assunto controverso.",
  prompt: `Crie uma thumbnail com foco em polêmica para o tema: [INSIRA TEMA]

Inclua:

- Expressão facial de choque ou indignação
- Texto curto e provocativo (máx 3 palavras)
- Cores contrastantes
- Elemento visual que indique conflito (X vermelho, seta, comparação)

Objetivo:
Gerar curiosidade e tensão para aumentar cliques.`
},

{
  categoria: "🔥 Magnética",
  nivel: "basico",
  titulo: "Thumbnail Segredo Revelado Simples",
  quando: "Quando o vídeo revela dica, estratégia ou informação pouco conhecida.",
  prompt: `Crie uma thumbnail estilo “segredo revelado” para o tema: [INSIRA TEMA]

Inclua:

- Expressão facial de surpresa ou descoberta
- Texto curto como: “O SEGREDO” ou “NINGUÉM CONTA”
- Fundo com bom contraste
- Destaque visual simples

Objetivo:
Criar sensação de descoberta exclusiva.`
},

{
  categoria: "📱 Mobile",
  nivel: "basico",
  titulo: "Thumbnail Ultra Simples para Celular",
  quando: "Quando o foco principal é visualização rápida no celular.",
  prompt: `Crie uma thumbnail otimizada para celular para o tema: [INSIRA TEMA]

Regras:

- Máximo 3 palavras
- Texto grande e centralizado
- Fundo simples
- Um único elemento principal
- Sem detalhes pequenos

Objetivo:
Ser entendida imediatamente durante o scroll.`
},

{
  categoria: "🔥 Magnética",
  nivel: "intermediario",
  titulo: "Thumbnail Viral Profissional 16:9",
  quando: "Quando quiser criar uma thumbnail profissional pronta para alto impacto visual.",
  prompt: `Você é um designer especialista em thumbnails virais para YouTube.

Crie uma thumbnail profissional no formato 16:9 (1280x720), ultra nítida e focada em alta taxa de cliques.

Tema do vídeo: [TEMA DO VÍDEO]

Incluir:

- Expressão facial forte transmitindo [EMOÇÃO PRINCIPAL: surpresa, choque, felicidade, medo, curiosidade]
- Fundo com cores contrastantes e vibrantes
- Iluminação dramática destacando o rosto
- Texto curto e grande com a frase: “[TEXTO DA CAPA]”
- Tipografia bold, extremamente legível mesmo em telas pequenas
- Composição limpa com foco principal no rosto e no texto
- Estilo moderno de canal grande de YouTube

Regras:
- Sem logo
- Sem bordas
- Nada poluído
- Pronto para uso imediato como capa de vídeo

Explique brevemente a lógica estratégica por trás das escolhas visuais.`
},

{
categoria: "🎯 Mais Cliques",
nivel: "intermediario",
titulo: "Thumbnail para Aumentar CTR",
quando: "Quando o vídeo precisa melhorar taxa de clique",
prompt: `Crie uma thumbnail altamente clicável.

Tema: [TEMA]

Use:
- Curiosidade aberta
- Texto provocativo
- Expressão emocional intensa
- Elemento que gere pergunta mental

Foco total em aumentar CTR.`
},

{
categoria: "📱 Mobile",
nivel: "avancado",
titulo: "Thumbnail Dominante para Celular",
quando: "Para canais com maioria da audiência mobile",
prompt: `Você é especialista em design para YouTube mobile.

Crie uma thumbnail dominante para telas pequenas.

Tema: [TEMA]

Aplique:
- Hierarquia visual forte
- Elemento principal exagerado
- Máximo 3 palavras
- Redução total de ruído visual

Explique a lógica estratégica.`
}

];

const lista = document.getElementById("lista-prompts");
const contador = document.getElementById("contador");
const busca = document.getElementById("busca");

function renderizar(arr) {

lista.innerHTML = "";
contador.innerText = `Total: ${arr.length} modelo${arr.length !== 1 ? "s" : ""}`;

ordemCategorias.forEach(cat => {

const grupo = arr.filter(p => p.categoria === cat);
if (grupo.length === 0) return;

const tituloSecao = document.createElement("h2");
tituloSecao.className = "secao-titulo";
tituloSecao.innerText = cat;
lista.appendChild(tituloSecao);

grupo.forEach(p => {

const card = document.createElement("div");
card.className = "card";
card.setAttribute("data-nivel", p.nivel);

card.innerHTML = `
<div class="nivel nivel-${p.nivel}">
${p.nivel === 'avancado' ? '🔴 Avançado' :
p.nivel === 'intermediario' ? '🟡 Intermediário' :
'🟢 Básico'}
</div>

<h3>${p.titulo}</h3>
<p><strong>📌 Quando usar:</strong> ${p.quando}</p>

<pre>${p.prompt}</pre>

<div class="acoes">
<button onclick="copiarPrompt(\`${p.prompt}\`)">📋 Copiar</button>
<button onclick="abrirChatGPT(\`${p.prompt}\`)">💬 ChatGPT</button>
<button onclick="abrirGemini(\`${p.prompt}\`)">🔷 Gemini</button>
</div>
`;

lista.appendChild(card);

});

});

}

function filtrarPrompts() {
const termo = busca.value.toLowerCase();
const filtrados = prompts.filter(p =>
p.titulo.toLowerCase().includes(termo) ||
p.prompt.toLowerCase().includes(termo) ||
p.categoria.toLowerCase().includes(termo)
);
renderizar(filtrados);
}

function filtrarNivel(event, nivel) {

const botoes = document.querySelectorAll(".filtro-nivel button");
botoes.forEach(btn => btn.classList.remove("ativo"));
event.target.classList.add("ativo");

renderizar(
nivel === "todos"
? prompts
: prompts.filter(p => p.nivel === nivel)
);

}

function copiarPrompt(texto) {
navigator.clipboard.writeText(texto);
alert("📋 Prompt copiado!");
}

function abrirChatGPT(texto) {
window.open("https://chat.openai.com/?prompt=" + encodeURIComponent(texto));
}

function abrirGemini(texto) {
window.open("https://gemini.google.com/app?prompt=" + encodeURIComponent(texto));
}

renderizar(prompts);

</script>

<style>

.top-bar {
display: flex;
gap: 15px;
align-items: center;
margin: 20px 0;
flex-wrap: wrap;
}

.top-bar input {
flex: 1;
padding: 14px;
border-radius: 10px;
border: 1px solid #e5e7eb;
}

.contador {
font-size: 14px;
opacity: 0.75;
}

pre {
white-space: pre-wrap;
font-size: 14px;
background: #f9fafb;
padding: 15px;
border-radius: 10px;
border: 1px solid #e5e7eb;
}

</style>

</body>
</html>
