<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Thumbnail Estratégica | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Prompts profissionais para criação de Thumbnails com IA. Aumente seu CTR com estratégias avançadas na Delta Prompts.">
<meta name="keywords" content="prompts thumbnail, thumbnail youtube ia, aumentar ctr youtube, design mobile youtube">
<meta name="author" content="Delta Prompts">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css">
</head>

<body>

<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js"></script>

<main>

<h1>🖼 Thumbnail Estratégica com IA</h1>

<p>
Prompts profissionais para criar thumbnails magnéticas, aumentar CTR e dominar o mobile.
</p>

<section class="card">
<h3>🎯 Objetivo</h3>
<p>
Fornecer modelos estratégicos para criação de thumbnails altamente clicáveis e otimizadas.
</p>
</section>

<div class="top-bar">
<input type="text" id="busca" placeholder="🔎 Buscar modelo..." oninput="filtrarPrompts()">
<div class="contador" id="contador"></div>
</div>

<div class="filtro-nivel">
<button onclick="filtrarNivel(event, 'todos')" class="ativo">Todos</button>
<button onclick="filtrarNivel(event, 'basico')">🟢 Básico</button>
<button onclick="filtrarNivel(event, 'intermediario')">🟡 Intermediário</button>
<button onclick="filtrarNivel(event, 'avancado')">🔴 Avançado</button>
</div>

<div id="lista-prompts"></div>

</main>

<script>

const ordemCategorias = [
"🔥 Magnética",
"🎯 Mais Cliques",
"📱 Mobile",
"⚡ Alta Conversão",
"🧠 Psicologia Visual",
"🎬 Storytelling Visual"
];

const prompts = [

{
categoria:"🔥 Magnética",
nivel:"basico",
titulo:"Impacto Visual Imediato",
quando:"Para parar o scroll rapidamente.",
tipo:"Vlog / Tutorial",
prompt:`Tema: [INSIRA TEMA]

Crie uma thumbnail com:
- Texto curto (máx 3 palavras)
- Fundo contrastante
- Expressão forte
- Elemento central destacado`
},

{
categoria:"🎯 Mais Cliques",
nivel:"basico",
titulo:"Número Forte Chamativo",
quando:"Quando o vídeo tem promessa objetiva.",
tipo:"Lista / Review",
prompt:`Tema: [INSIRA TEMA]

Inclua:
- Número grande
- Texto provocativo
- Contraste alto
- Expressão coerente`
},

  {
  categoria: "📱 Mobile",
  nivel: "avancado",
  titulo: "ThumbMagnet Mobile — Público Feminino IA",
  quando: "Quando quiser criar conceitos de thumbnail altamente clicáveis para vídeos sobre Inteligência Artificial voltados para mulheres iniciantes.",
  tipo: "Tecnologia / Educacional / Autoridade",
  prompt: `🔥 PROMPT DEFINITIVO — ThumbMagnet Mobile

Quero que você atue como meu assistente especialista chamado ThumbMagnet Mobile, focado em criar thumbnails altamente virais para YouTube.

Contexto do canal:

Nicho: Inteligência Artificial e tecnologias
Público: 90% mulheres
Nível da audiência: iniciante
Eu apareço em todas as thumbnails
Foco total em visualização via celular
Objetivo principal: aumentar CTR e potencial de viralização

Sua missão é criar conceitos de thumbnail que:

Sejam extremamente claros em tela pequena
Gerem curiosidade imediata
Conectem emocionalmente com mulheres
Transmitam tecnologia de forma acessível
Misturem feminilidade + autoridade + modernidade

Você deve aplicar:

• Psicologia das cores voltada ao público feminino
• Design mobile-first (leitura em menos de 1 segundo)
• Máximo de 3 a 5 palavras
• Letras grossas, com alto contraste
• Fundo simples e impactante
• Foco principal no meu rosto como elemento emocional
• Estética moderna, limpa e tecnológica

Sempre entregue no seguinte formato:

TEXTO PRINCIPAL DA THUMBNAIL

PALETA DE CORES:
Fundo:
Texto:
Elementos de destaque:

EXPRESSÃO FACIAL RECOMENDADA:

COMPOSIÇÃO:

ELEMENTOS VISUAIS EXTRAS:

EMOÇÃO QUE PRECISA PROVOCAR:

JUSTIFICATIVA ESTRATÉGICA:

REGRAS OBRIGATÓRIAS:

Nada genérico
Nada poluído
Nada técnico demais
Nada com muito texto
Sempre priorizar leitura instantânea
Sempre considerar que estou presente na imagem
Se a ideia não tiver alto potencial de clique, reformule
Se necessário, gere 3 variações diferentes para testar CTR.`
},

{
  categoria: "🔥 Magnética",
  nivel: "intermediario",
  titulo: "Thumbnail Viral Profissional 16:9",
  quando: "Quando quiser criar uma thumbnail profissional pronta para alto impacto visual.",
  tipo: "Vlog / Tutorial / Review",
  prompt: `Você é um designer especialista em thumbnails virais para YouTube.

Crie uma thumbnail profissional no formato 16:9 (1280x720), ultra nítida e focada em alta taxa de cliques.

Tema do vídeo: [INSIRA SEU TEMA AQUI]

Incluir:

- Expressão facial forte transmitindo [ESCOLHA A EMOÇÃO PRINCIPAL]
- Fundo com cores contrastantes e vibrantes
- Iluminação dramática destacando o rosto
- Texto curto e grande com a frase: “[TEXTO DA CAPA]”
- Tipografia bold, extremamente legível mesmo em telas pequenas
- Composição limpa com foco principal no rosto e no texto
- Estilo moderno de canal grande de YouTube

Regras:
- Sem logo
- Sem bordas
- Nada poluído
- Pronto para uso imediato como capa de vídeo

Explique brevemente a lógica estratégica por trás das escolhas visuais.`
},

{
categoria:"📱 Mobile",
nivel:"basico",
titulo:"Mobile 1 Segundo",
quando:"Para público majoritariamente mobile.",
tipo:"Shorts / Conteúdo rápido",
prompt:`Tema: [INSIRA TEMA]

Regras:
- Máximo 3 palavras
- Texto enorme
- Fundo simples
- Zero poluição`
},

{
categoria:"⚡ Alta Conversão",
nivel:"intermediario",
titulo:"Promessa Irresistível",
quando:"Quando o vídeo entrega resultado forte.",
tipo:"Educacional / Estratégia",
prompt:`Tema: [INSIRA TEMA]

Inclua:
- Frase impactante
- Emoção intensa
- Fundo vibrante
- Foco no rosto`
},

{
categoria:"🧠 Psicologia Visual",
nivel:"intermediario",
titulo:"Gatilho de Curiosidade",
quando:"Quando quiser gerar pergunta mental.",
tipo:"Opinião / Descoberta",
prompt:`Tema: [INSIRA TEMA]

Use:
- Texto incompleto
- Expressão de surpresa
- Elemento que esconda informação`
},

{
categoria:"🎬 Storytelling Visual",
nivel:"intermediario",
titulo:"Cena Congelada Dramática",
quando:"Quando o vídeo conta uma história.",
tipo:"Vlog / Narrativa",
prompt:`Tema: [INSIRA TEMA]

Crie:
- Cena dramática
- Emoção clara
- Texto curto
- Composição cinematográfica`
},

{
categoria:"📱 Mobile",
nivel:"avancado",
titulo:"Mobile Teste A/B",
quando:"Para testar variações de CTR.",
tipo:"Tecnologia / Educacional",
prompt:`Tema: [INSIRA TEMA]

Crie 3 versões diferentes:
- Máx 3 palavras
- Alto contraste
- Emoção forte

Explique qual tem maior potencial de clique.`
},

{
categoria:"⚡ Alta Conversão",
nivel:"avancado",
titulo:"Thumbnail Polêmica Estratégica",
quando:"Quando o vídeo envolve opinião forte.",
tipo:"React / Opinião",
prompt:`Tema: [INSIRA TEMA]

Inclua:
- Expressão intensa
- Texto provocativo
- Elemento de conflito
- Fundo dramático

Objetivo: gerar tensão e clique imediato.`
}

];

const lista = document.getElementById("lista-prompts");
const contador = document.getElementById("contador");
const busca = document.getElementById("busca");

function renderizar(arr) {
lista.innerHTML = "";
contador.innerText = `Total: ${arr.length} modelo${arr.length !== 1 ? "s" : ""}`;

ordemCategorias.forEach(cat => {

const grupo = arr.filter(p => p.categoria === cat);
if(grupo.length === 0) return;

const tituloSecao = document.createElement("h2");
tituloSecao.className = "secao-titulo";
tituloSecao.innerText = cat;
lista.appendChild(tituloSecao);

grupo.forEach(p => {

const card = document.createElement("div");
card.className = "card";
card.setAttribute("data-nivel", p.nivel);

card.innerHTML = `
<div class="nivel nivel-${p.nivel}">
${p.nivel === 'avancado' ? '🔴 Avançado' :
p.nivel === 'intermediario' ? '🟡 Intermediário' :
'🟢 Básico'}
</div>

<h3>${p.titulo}</h3>
<p class="meta"><strong>Tipo:</strong> ${p.tipo || "Geral"}</p>
<p><strong>📌 Quando usar:</strong> ${p.quando}</p>

<pre class="prompt-text">${p.prompt}</pre>

<p class="meta">
⚙️ <strong>Personalize:</strong> Substitua textos como <b>[INSIRA TEMA]</b>.
</p>

<div class="acoes">
<button class="btn-copy" onclick="copiar(this)">📋 Copiar</button>
<button class="btn-chat" onclick="chat(this)">💬 ChatGPT</button>
<button class="btn-gemini" onclick="gemini(this)">🔷 Gemini</button>
<button class="btn-favorito">☆ Favoritar</button>
</div>
`;

lista.appendChild(card);

});

});
}

function filtrarPrompts(){
const termo = busca.value.toLowerCase();
const filtrados = prompts.filter(p =>
p.titulo.toLowerCase().includes(termo) ||
p.prompt.toLowerCase().includes(termo) ||
p.categoria.toLowerCase().includes(termo)
);
renderizar(filtrados);
}

function filtrarNivel(event,nivel){
const botoes = document.querySelectorAll(".filtro-nivel button");
botoes.forEach(btn=>btn.classList.remove("ativo"));
event.target.classList.add("ativo");

renderizar(
nivel==="todos"
? prompts
: prompts.filter(p=>p.nivel===nivel)
);
}

renderizar(prompts);

</script>

<script src="/delta-prompts/funcoes.js"></script>

<style>
.top-bar{display:flex;gap:15px;align-items:center;margin:20px 0;flex-wrap:wrap;}
.top-bar input{flex:1;padding:14px;border-radius:10px;border:1px solid #e5e7eb;}
.contador{font-size:14px;opacity:0.75;}
.meta{font-size:13px;opacity:0.75;margin-bottom:8px;}
pre{white-space:pre-wrap;font-size:14px;background:#f9fafb;padding:15px;border-radius:10px;border:1px solid #e5e7eb;}
</style>

</body>
</html>
