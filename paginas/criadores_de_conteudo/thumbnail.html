<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Thumbnail Estratégica | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Prompts profissionais para criação de Thumbnails com IA. Aumente seu CTR com a Delta Prompts.">
<meta name="keywords" content="prompts thumbnail, youtube ctr, design mobile youtube">
<meta name="author" content="Delta Prompts">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css">

<style>
.top-bar{display:flex;gap:15px;align-items:center;margin:20px 0;flex-wrap:wrap;}
.top-bar input{flex:1;padding:14px;border-radius:10px;border:1px solid #e5e7eb;}
.contador{font-size:14px;opacity:0.75;}
.meta{font-size:13px;opacity:0.75;margin-bottom:8px;}
pre{white-space:pre-wrap;font-size:14px;background:#f9fafb;padding:15px;border-radius:10px;border:1px solid #e5e7eb;}
</style>

</head>
<body>

<!-- MENU LATERAL -->
<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js"></script>

<main>

<h1>🖼 Thumbnail Estratégica com IA</h1>

<p>Biblioteca profissional de prompts para thumbnails de alta conversão.</p>

<section class="card">
<h3>🎯 Objetivo</h3>
<p>Criar thumbnails altamente clicáveis e otimizadas para mobile.</p>
</section>

<div class="top-bar">
<input type="text" id="busca" placeholder="🔎 Buscar modelo..." oninput="filtrarPrompts()">
<div class="contador" id="contador"></div>
</div>

<div class="filtro-nivel">
<button onclick="filtrarNivel('todos')" class="ativo">Todos</button>
<button onclick="filtrarNivel('basico')">🟢 Básico</button>
<button onclick="filtrarNivel('intermediario')">🟡 Intermediário</button>
<button onclick="filtrarNivel('avancado')">🔴 Avançado</button>
</div>

<div id="lista-prompts"></div>

</main>

<script>

const ordemCategorias = [
"🔥 Magnética",
"🎯 Mais Cliques",
"📱 Mobile",
"⚡ Alta Conversão",
"🧠 Psicologia Visual",
"📊 Teste A/B",
"🎬 Storytelling Visual"
];

const prompts = [

{
categoria:"⚡ Alta Conversão",
nivel:"basico",
titulo:"Promessa Direta de Resultado",
quando:"Quando o vídeo entrega benefício claro.",
tipo:"Educacional",
prompt:`Tema: [INSIRA TEMA]

Crie thumbnail com promessa direta:
- Texto forte
- Emoção positiva
- Fundo vibrante`
},

{
categoria:"🧠 Psicologia Visual",
nivel:"basico",
titulo:"Curiosidade Incompleta",
quando:"Para gerar pergunta mental.",
tipo:"Descoberta",
prompt:`Tema: [INSIRA TEMA]

Use:
- Texto incompleto
- Expressão surpresa
- Elemento oculto`
},

{
categoria:"📊 Teste A/B",
nivel:"basico",
titulo:"Teste Simples A/B",
quando:"Para testar duas versões.",
tipo:"Experimento",
prompt:`Tema: [INSIRA TEMA]

Crie versão A e versão B com:
- Texto diferente
- Emoção diferente`
},

{
categoria:"🎬 Storytelling Visual",
nivel:"basico",
titulo:"Momento Congelado Dramático",
quando:"Quando há narrativa.",
tipo:"Vlog",
prompt:`Tema: [INSIRA TEMA]

Crie cena dramática com:
- Expressão forte
- Texto curto`
},

{
categoria:"🔥 Magnética",
nivel:"basico",
titulo:"Contraste Explosivo",
quando:"Para impacto imediato.",
tipo:"Geral",
prompt:`Tema: [INSIRA TEMA]

Use:
- Fundo muito contrastante
- Texto curto
- Elemento grande`
},

{
categoria:"📱 Mobile",
nivel:"basico",
titulo:"Mobile Ultra Simples",
quando:"Para leitura em 1 segundo.",
tipo:"Shorts",
prompt:`Tema: [INSIRA TEMA]

Regras:
- Máx 3 palavras
- Fundo limpo
- Texto enorme`
}

];

const lista=document.getElementById("lista-prompts");
const contador=document.getElementById("contador");
const busca=document.getElementById("busca");

function renderizar(arr){
lista.innerHTML="";
contador.innerText=`Total: ${arr.length} modelo${arr.length!==1?"s":""}`;

ordemCategorias.forEach(cat=>{
const grupo=arr.filter(p=>p.categoria===cat);
if(grupo.length===0)return;

const titulo=document.createElement("h2");
titulo.className="secao-titulo";
titulo.innerText=cat;
lista.appendChild(titulo);

grupo.forEach(p=>{
const card=document.createElement("div");
card.className="card";
card.setAttribute("data-nivel",p.nivel);

card.innerHTML=`
<div class="nivel nivel-${p.nivel}">
${p.nivel==="avancado"?"🔴 Avançado":
p.nivel==="intermediario"?"🟡 Intermediário":"🟢 Básico"}
</div>

<h3>${p.titulo}</h3>
<p class="meta"><strong>Tipo:</strong> ${p.tipo}</p>
<p><strong>📌 Quando usar:</strong> ${p.quando}</p>

<pre class="prompt-text">${p.prompt}</pre>

<div class="acoes">
<button onclick="copiar(this)">📋 Copiar</button>
<button onclick="chat(this)">💬 ChatGPT</button>
<button onclick="gemini(this)">🔷 Gemini</button>
<button onclick="favoritar(this)">⭐ Favoritar</button>
</div>
`;
lista.appendChild(card);
});
});
}

function copiar(btn){
const texto=btn.closest(".card").querySelector(".prompt-text").innerText;
navigator.clipboard.writeText(texto);
alert("Copiado!");
}

function chat(btn){
const texto=btn.closest(".card").querySelector(".prompt-text").innerText;
window.open("https://chat.openai.com/?prompt="+encodeURIComponent(texto));
}

function gemini(btn){
const texto=btn.closest(".card").querySelector(".prompt-text").innerText;
window.open("https://gemini.google.com/app?prompt="+encodeURIComponent(texto));
}

function favoritar(btn){
const texto=btn.closest(".card").querySelector(".prompt-text").innerText;
const titulo=btn.closest(".card").querySelector("h3").innerText;
let fav=JSON.parse(localStorage.getItem("deltaFav"))||[];
fav.push({id:Date.now(),titulo,conteudo:texto});
localStorage.setItem("deltaFav",JSON.stringify(fav));
alert("Favoritado!");
}

function filtrarPrompts(){
const termo=busca.value.toLowerCase();
renderizar(prompts.filter(p=>
p.titulo.toLowerCase().includes(termo)||
p.prompt.toLowerCase().includes(termo)||
p.categoria.toLowerCase().includes(termo)
));
}

function filtrarNivel(nivel){
if(nivel==="todos"){renderizar(prompts);return;}
renderizar(prompts.filter(p=>p.nivel===nivel));
}

renderizar(prompts);

</script>

</body>
</html>
