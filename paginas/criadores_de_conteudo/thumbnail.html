<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Thumbnail Estratégica | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Prompts profissionais para criação de Thumbnails com IA.">
<meta name="keywords" content="prompts thumbnail, youtube, ctr">
<meta name="author" content="Delta Prompts">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css">

<style>
.top-bar{display:flex;gap:15px;align-items:center;margin:20px 0;flex-wrap:wrap;}
.top-bar input{flex:1;padding:14px;border-radius:10px;border:1px solid #e5e7eb;}
.contador{font-size:14px;opacity:0.75;}
.meta{font-size:13px;opacity:0.75;margin-bottom:8px;}
pre{white-space:pre-wrap;font-size:14px;background:#f9fafb;padding:15px;border-radius:10px;border:1px solid #e5e7eb;}
</style>

</head>
<body>

<main>

<h1>🖼 Thumbnail Estratégica com IA</h1>

<p>Prompts profissionais para criar thumbnails magnéticas e aumentar CTR.</p>

<section class="card">
<h3>🎯 Objetivo</h3>
<p>Criar thumbnails altamente clicáveis e otimizadas para mobile.</p>
</section>

<div class="top-bar">
<input type="text" id="busca" placeholder="🔎 Buscar modelo..." oninput="filtrarPrompts()">
<div class="contador" id="contador"></div>
</div>

<div class="filtro-nivel">
<button onclick="filtrarNivel('todos')" class="ativo">Todos</button>
<button onclick="filtrarNivel('basico')">🟢 Básico</button>
<button onclick="filtrarNivel('intermediario')">🟡 Intermediário</button>
<button onclick="filtrarNivel('avancado')">🔴 Avançado</button>
</div>

<div id="lista-prompts"></div>

</main>

<script>

const ordemCategorias = [
"🔥 Magnética",
"🎯 Mais Cliques",
"📱 Mobile"
];

const prompts = [

{
categoria:"📱 Mobile",
nivel:"avancado",
titulo:"ThumbMagnet Mobile — Público Feminino IA",
quando:"Para thumbnails virais focadas em mulheres iniciantes.",
tipo:"Tecnologia",
prompt:`🔥 PROMPT DEFINITIVO — ThumbMagnet Mobile

Tema: [INSIRA SEU TEMA AQUI]

Crie conceito otimizado para celular:
- Máximo 3 palavras
- Alto contraste
- Emoção forte
- Fundo simples
- Leitura em 1 segundo`
},

{
categoria:"🔥 Magnética",
nivel:"intermediario",
titulo:"Thumbnail Viral Profissional 16:9",
quando:"Para alto impacto visual.",
tipo:"Vlog / Tutorial",
prompt:`Você é um designer especialista em thumbnails virais.

Tema: [INSIRA SEU TEMA AQUI]

Inclua:
- Expressão forte
- Fundo contrastante
- Texto grande
- Composição limpa`
}

];

const lista = document.getElementById("lista-prompts");
const contador = document.getElementById("contador");
const busca = document.getElementById("busca");

function renderizar(arr){
lista.innerHTML="";
contador.innerText=`Total: ${arr.length} modelo${arr.length!==1?"s":""}`;

ordemCategorias.forEach(cat=>{
const grupo=arr.filter(p=>p.categoria===cat);
if(grupo.length===0)return;

const tituloSecao=document.createElement("h2");
tituloSecao.innerText=cat;
lista.appendChild(tituloSecao);

grupo.forEach(p=>{

const card=document.createElement("div");
card.className="card";
card.setAttribute("data-nivel",p.nivel);

card.innerHTML=`
<div class="nivel nivel-${p.nivel}">
${p.nivel==="avancado"?"🔴 Avançado":
p.nivel==="intermediario"?"🟡 Intermediário":
"🟢 Básico"}
</div>

<h3>${p.titulo}</h3>
<p class="meta"><strong>Tipo:</strong> ${p.tipo}</p>
<p><strong>📌 Quando usar:</strong> ${p.quando}</p>

<pre class="prompt-text">${p.prompt}</pre>

<div class="acoes">
<button onclick="copiarPrompt(this)">📋 Copiar</button>
<button onclick="abrirChatGPT(this)">💬 ChatGPT</button>
<button onclick="abrirGemini(this)">🔷 Gemini</button>
<button onclick="favoritarPrompt(this)">⭐ Favoritar</button>
</div>
`;

lista.appendChild(card);

});

});
}

function copiarPrompt(btn){
const texto=btn.closest(".card").querySelector(".prompt-text").innerText;
navigator.clipboard.writeText(texto);
alert("Prompt copiado!");
}

function abrirChatGPT(btn){
const texto=btn.closest(".card").querySelector(".prompt-text").innerText;
window.open("https://chat.openai.com/?prompt="+encodeURIComponent(texto),"_blank");
}

function abrirGemini(btn){
const texto=btn.closest(".card").querySelector(".prompt-text").innerText;
window.open("https://gemini.google.com/app?prompt="+encodeURIComponent(texto),"_blank");
}

function favoritarPrompt(btn){
const card=btn.closest(".card");
const titulo=card.querySelector("h3").innerText;
const conteudo=card.querySelector(".prompt-text").innerText;

let favoritos=JSON.parse(localStorage.getItem("deltaFavoritos"))||[];

favoritos.push({
id:Date.now(),
titulo,
conteudo
});

localStorage.setItem("deltaFavoritos",JSON.stringify(favoritos));
alert("Adicionado aos favoritos!");
}

function filtrarPrompts(){
const termo=busca.value.toLowerCase();
const filtrados=prompts.filter(p=>
p.titulo.toLowerCase().includes(termo)||
p.prompt.toLowerCase().includes(termo)||
p.categoria.toLowerCase().includes(termo)
);
renderizar(filtrados);
}

function filtrarNivel(nivel){
if(nivel==="todos"){renderizar(prompts);return;}
renderizar(prompts.filter(p=>p.nivel===nivel));
}

renderizar(prompts);

</script>

</body>
</html>
