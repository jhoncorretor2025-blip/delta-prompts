<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Thumbnail | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/melhoriaspaginas.css">

</head>
<body>

<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js"></script>

<main>

<h1>🖼 Prompts para Thumbnail</h1>
<p>Prompts estratégicos para criar thumbnails magnéticas, altamente clicáveis e otimizadas para mobile.</p>

<section class="card">
<h3>🎯 Objetivo</h3>
<p>Gerar thumbnails que aumentam CTR, dominam no mobile e criam impacto visual imediato.</p>
</section>

<input type="text" id="busca" placeholder="🔎 Buscar prompt...">

<div class="filtro-nivel">
<button class="ativo" onclick="filtrarNivel('todos')">Todos</button>
<button onclick="filtrarNivel('basico')">Básico</button>
<button onclick="filtrarNivel('intermediario')">Intermediário</button>
<button onclick="filtrarNivel('avancado')">Avançado</button>
</div>

<div id="lista-prompts"></div>

<script>

/* ============================= */
/* ORDEM DE CATEGORIAS */
/* ============================= */

const ordemCategorias = [
  "Thumbnail"
];

/* ============================= */
/* ARRAY DE PROMPTS */
/* ============================= */

const prompts = [

{
  categoria: "Thumbnail",
  nivel: "basico",
  titulo: "Thumbnail Magnética Simples",
  quando: "Para vídeos gerais que precisam chamar atenção rápida",
  prompt: `Crie uma thumbnail magnética para YouTube.

Tema: [TEMA]

Use:
- Texto grande (máx 3 palavras)
- Fundo com alto contraste
- Expressão facial forte
- Elemento visual central destacado

Objetivo: parar o scroll imediatamente.`
},

{
  categoria: "Thumbnail",
  nivel: "intermediario",
  titulo: "Thumbnail para Aumentar CTR",
  quando: "Quando o vídeo precisa melhorar taxa de clique",
  prompt: `Crie uma thumbnail altamente clicável.

Tema: [TEMA]

Use:
- Curiosidade aberta
- Texto provocativo
- Expressão emocional intensa
- Elemento visual que gere pergunta mental

Foco total em aumentar CTR.`
},

{
  categoria: "Thumbnail",
  nivel: "avancado",
  titulo: "Thumbnail Magnética Psicológica",
  quando: "Para vídeos competitivos disputando atenção",
  prompt: `Você é especialista em psicologia visual aplicada ao YouTube.

Crie uma thumbnail estratégica baseada em:

Tema: [TEMA]
Público: [PÚBLICO]

Aplique:
- Contraste emocional
- Cores de alerta
- Quebra de padrão visual
- Máximo 3 palavras impactantes

Explique a lógica estratégica utilizada.`
},

{
  categoria: "Thumbnail",
  nivel: "basico",
  titulo: "Thumbnail Otimizada para Celular",
  quando: "Quando a maioria da audiência vem do mobile",
  prompt: `Crie uma thumbnail otimizada para celular.

Tema: [TEMA]

Regras:
- Texto extremamente grande
- Máximo 3 palavras
- Elemento principal centralizado
- Evitar detalhes pequenos
- Alto contraste

Foco total em legibilidade mobile.`
},

{
  categoria: "Thumbnail",
  nivel: "intermediario",
  titulo: "Thumbnail com Loop de Curiosidade",
  quando: "Para vídeos que dependem de curiosidade forte",
  prompt: `Crie uma thumbnail que gere loop mental.

Tema: [TEMA]

A thumbnail deve:
- Criar tensão visual
- Gerar pergunta não respondida
- Usar contraste forte
- Texto curto e provocativo

Objetivo: forçar o clique por curiosidade.`
},

{
  categoria: "Thumbnail",
  nivel: "avancado",
  titulo: "Thumbnail Mobile Dominante",
  quando: "Para canais com audiência majoritariamente mobile",
  prompt: `Você é especialista em design para YouTube mobile.

Crie uma thumbnail dominante para telas pequenas.

Tema: [TEMA]

Aplique:
- Hierarquia visual forte
- Elemento principal exagerado
- Redução total de ruído visual
- Zona de leitura central

Explique por que funcionará melhor no celular.`
}

];

/* ============================= */
/* RENDERIZAÇÃO */
/* ============================= */

function renderizar(lista = prompts){

const container = document.getElementById("lista-prompts");
container.innerHTML = "";

ordemCategorias.forEach(cat => {

  const grupo = lista.filter(p => p.categoria === cat);
  if(grupo.length === 0) return;

  grupo.forEach(p => {

    const card = document.createElement("div");

    card.classList.add("card");
    card.setAttribute("data-nivel", p.nivel);

    card.innerHTML = `
<div class="nivel nivel-${p.nivel}">
${p.nivel.toUpperCase()}
</div>

<h3>${p.titulo}</h3>
<p><strong>Quando usar:</strong> ${p.quando}</p>

<pre class="prompt-text">${p.prompt}</pre>

<div class="acoes">
<button onclick="copiar(this)" class="btn-copy">📋 Copiar</button>
<button onclick="chat(this)" class="btn-chat">💬 ChatGPT</button>
<button onclick="gemini(this)" class="btn-gemini">✨ Gemini</button>
<button onclick="favoritar(this)" class="btn-favorito">☆ Favoritar</button>
</div>
`;

    container.appendChild(card);

  });

});

}

/* ============================= */
/* FILTRO POR NÍVEL */
/* ============================= */

function filtrarNivel(nivel){

const botoes = document.querySelectorAll(".filtro-nivel button");
botoes.forEach(b => b.classList.remove("ativo"));
event.target.classList.add("ativo");

const cards = document.querySelectorAll("#lista-prompts .card");

cards.forEach(card => {

  if(nivel === "todos"){
    card.style.display = "block";
  } else {
    card.style.display =
      card.getAttribute("data-nivel") === nivel
      ? "block"
      : "none";
  }

});

}

/* ============================= */
/* BUSCA */
/* ============================= */

document.getElementById("busca").addEventListener("keyup", function(){
const termo = this.value.toLowerCase();
const cards = document.querySelectorAll("#lista-prompts .card");

cards.forEach(card => {
  const texto = card.innerText.toLowerCase();
  card.style.display = texto.includes(termo) ? "block" : "none";
});
});

/* ============================= */
/* INICIAR */
/* ============================= */

renderizar();

</script>

<script src="/delta-prompts/funcoes.js"></script>

</main>
</body>
</html>
