<body>

<main>

  <!-- 2. INTRODUÇÃO -->
  <p>
    Prompts profissionais para criar descrições otimizadas para SEO, retenção e conversão no YouTube.

  <!-- 3. OBJETIVO -->
  <section class="card">

</main>

<script>

const promptsDescricao = [

{
categoria: "🔥 SEO",

Crie uma descrição otimizada para o vídeo sobre: [INSIRA TEMA]

Inclua:

{

Inclua:

Foque em aumentar inscritos e retenção.`
},

{
categoria: "🎯 Autoridade",
titulo: "Descrição para Construir Autoridade",

prompt: `Atue como especialista em posicionamento digital.

Crie uma descrição estratégica para o vídeo: [INSIRA TEMA]

Organize de forma profissional.`
},

{
categoria: "⚡ Shorts",
titulo: "Descrição para YouTube Shorts",
quando: "Para vídeos curtos que precisam ser diretos.",
prompt: `Você é especialista em Shorts.

Crie uma descrição curta e estratégica para o vídeo: [INSIRA TEMA]

Inclua:
- Resumo direto
- 3 hashtags relevantes
- Convite para seguir o canal

Seja breve e otimizado.`
},

{
categoria: "🔥 Estrutura Completa",
titulo: "Modelo Completo de Descrição Estratégica",
quando: "Quando quiser uma descrição estruturada do início ao fim.",
prompt: `Você é especialista em estratégia de conteúdo para YouTube.

Crie uma descrição completa para o vídeo: [INSIRA TEMA]

Estrutura obrigatória:

1. Parágrafo inicial forte (SEO)
2. Explicação do que o espectador aprenderá
3. Lista de tópicos abordados
4. Chamada para ação
5. Links organizados
6. Hashtags finais

Organize em blocos claros e profissionais.`
}

];

const lista = document.getElementById("lista-prompts");
const contador = document.getElementById("contador");
const busca = document.getElementById("busca");

function renderizar(arr) {
  lista.innerHTML = "";
  contador.innerText = `Total: ${arr.length} modelo${arr.length !== 1 ? "s" : ""}`;

  arr.forEach(p => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="meta">${p.categoria}</div>
      <h3>${p.titulo}</h3>
      <p><strong>📌 Quando usar:</strong> ${p.quando}</p>
      <pre>${p.prompt}</pre>

      <div class="acoes">
        <button onclick="copiarPrompt(\`${p.prompt}\`)">📋 Copiar & Colar</button>
        <button onclick="favoritarPrompt('${p.titulo}', \`${p.prompt}\`)">⭐ Favoritar</button>
        <button onclick="abrirChatGPT(\`${p.prompt}\`)">💬 ChatGPT</button>
        <button onclick="abrirGemini(\`${p.prompt}\`)">🔷 Gemini</button>
      </div>
    `;

    lista.appendChild(card);
  });
}

function filtrarPrompts() {
  const termo = busca.value.toLowerCase();
  const filtrados = promptsDescricao.filter(p =>
    p.titulo.toLowerCase().includes(termo) ||
    p.prompt.toLowerCase().includes(termo) ||
    p.categoria.toLowerCase().includes(termo)
  );
  renderizar(filtrados);
}

function copiarPrompt(texto) {
  navigator.clipboard.writeText(texto);
  alert("📋 Prompt copiado!");
}
