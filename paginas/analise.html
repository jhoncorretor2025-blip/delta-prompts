<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Análise Estratégica | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css">

</head>

<body>

<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js?v=20260805"></script>

<main>

<h1>📊 Análise Estratégica com IA</h1>

<p>
Prompts profissionais para analisar cenários, dados, decisões e estratégias
com visão crítica e estruturada.
</p>

<section class="card">
<h3>🎯 Objetivo</h3>
<p>
Ajudar na tomada de decisão através de análises estruturadas,
identificação de riscos e geração de insights estratégicos.
</p>
</section>

<div class="top-bar">
<input
type="text"
id="busca"
placeholder="🔎 Buscar modelo de análise..."
oninput="filtrarPrompts()"
>
<div class="contador" id="contador"></div>
</div>

<div class="filtro-nivel" style="margin-bottom:20px;">
<button onclick="filtrarNivel(event, 'todos')" class="ativo">Todos</button>
<button onclick="filtrarNivel(event, 'basico')">🟢 Básico</button>
<button onclick="filtrarNivel(event, 'intermediario')">🟡 Intermediário</button>
<button onclick="filtrarNivel(event, 'avancado')">🔴 Avançado</button>
</div>

<div id="lista-prompts"></div>

</main>

<script>

const ordemCategorias = [
"📊 Análise de Cenário",
"⚖️ Tomada de Decisão",
"📈 Estratégia Competitiva",
"🔍 Diagnóstico Profundo"
];

const promptsAnalise = [

{
categoria: "📊 Análise de Cenário",
nivel: "basico",
titulo: "📊 Análise Simples de Situação",
quando: "Quando precisar entender rapidamente um cenário antes de decidir.",
prompt: `Analise a seguinte situação:

[DESCREVA O CENÁRIO]

Organize a resposta em:
- Contexto geral
- Principais fatores envolvidos
- Pontos positivos
- Pontos de risco
- Conclusão objetiva`
},

{
categoria: "⚖️ Tomada de Decisão",
nivel: "intermediario",
titulo: "⚖️ Matriz de Decisão Estratégica",
quando: "Quando precisar escolher entre duas ou mais opções.",
prompt: `Analise as seguintes opções:

[OPÇÃO 1]
[OPÇÃO 2]
[OPÇÃO 3]

Crie uma matriz comparativa considerando:
- Riscos
- Benefícios
- Custo
- Impacto de longo prazo
- Probabilidade de sucesso

Finalize com recomendação estratégica justificada.`
},

{
categoria: "📈 Estratégia Competitiva",
nivel: "intermediario",
titulo: "📈 Análise SWOT Estratégica",
quando: "Para avaliar negócio, projeto ou carreira.",
prompt: `Realize uma análise SWOT sobre:

[TEMA OU NEGÓCIO]

Estruture em:
- Forças
- Fraquezas
- Oportunidades
- Ameaças

Inclua interpretação estratégica dos pontos identificados.`
},

{
categoria: "🔍 Diagnóstico Profundo",
nivel: "avancado",
titulo: "🔍 Diagnóstico Estratégico Completo",
quando: "Quando precisar de análise aprofundada antes de decisão importante.",
prompt: `Atue como analista estratégico sênior.

Analise profundamente o seguinte cenário:

[DESCREVA DETALHADAMENTE]

Estruture sua resposta em:

1. Contexto e enquadramento
2. Variáveis críticas
3. Riscos de curto, médio e longo prazo
4. Oportunidades ocultas
5. Cenários possíveis (otimista, realista, pessimista)
6. Recomendação estratégica detalhada

Seja objetivo, crítico e estratégico.`
}

];

const lista = document.getElementById("lista-prompts");
const contador = document.getElementById("contador");
const busca = document.getElementById("busca");

function renderizar(arr){

lista.innerHTML = "";
contador.innerText = `Total: ${arr.length} modelo${arr.length !== 1 ? "s" : ""}`;

ordemCategorias.forEach(cat => {

const grupo = arr.filter(p => p.categoria === cat);
if(grupo.length === 0) return;

const tituloSecao = document.createElement("h2");
tituloSecao.className = "secao-titulo";
tituloSecao.innerText = cat;
lista.appendChild(tituloSecao);

grupo.forEach(p => {

const card = document.createElement("div");
card.className = "card";
card.setAttribute("data-nivel", p.nivel);

card.innerHTML = `
<div class="nivel nivel-${p.nivel}">
${p.nivel === 'avancado' ? '🔴 Avançado' :
p.nivel === 'intermediario' ? '🟡 Intermediário' :
'🟢 Básico'}
</div>

<h3>${p.titulo}</h3>
<p><strong>📌 Quando usar:</strong> ${p.quando}</p>
<pre>${p.prompt}</pre>

<div class="acoes">
<button onclick="copiarPrompt(\`${p.prompt}\`)">📋 Copiar</button>
<button onclick="favoritarPrompt('${p.titulo}', \`${p.prompt}\`)">⭐ Favoritar</button>
<button onclick="abrirChatGPT(\`${p.prompt}\`)">💬 ChatGPT</button>
<button onclick="abrirGemini(\`${p.prompt}\`)">🔷 Gemini</button>
</div>
`;

lista.appendChild(card);

});

});

}

function filtrarPrompts(){
const termo = busca.value.toLowerCase();
const filtrados = promptsAnalise.filter(p =>
p.titulo.toLowerCase().includes(termo) ||
p.prompt.toLowerCase().includes(termo) ||
p.categoria.toLowerCase().includes(termo)
);
renderizar(filtrados);
}

function filtrarNivel(event, nivel){
const botoes = document.querySelectorAll(".filtro-nivel button");
botoes.forEach(btn => btn.classList.remove("ativo"));
event.target.classList.add("ativo");

const cards = document.querySelectorAll("#lista-prompts .card");

cards.forEach(card=>{
if(nivel === "todos"){
card.style.display = "block";
}else{
card.style.display =
card.dataset.nivel === nivel ? "block" : "none";
}
});
}

function copiarPrompt(texto){
navigator.clipboard.writeText(texto);
alert("📋 Prompt copiado!");
}

function favoritarPrompt(titulo, conteudo){
const prompts = JSON.parse(localStorage.getItem("deltaPrompts")) || [];
prompts.push({
id: Date.now(),
titulo,
categoria: "Análise",
conteudo,
favorito: true
});
localStorage.setItem("deltaPrompts", JSON.stringify(prompts));
alert("⭐ Adicionado aos favoritos!");
}

function abrirChatGPT(texto){
window.open("https://chat.openai.com/?prompt=" + encodeURIComponent(texto));
}

function abrirGemini(texto){
window.open("https://gemini.google.com/app?prompt=" + encodeURIComponent(texto));
}

renderizar(promptsAnalise);

</script>

</body>
</html>
