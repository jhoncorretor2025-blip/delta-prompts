<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="delta-version" content="V1.16"><title>📁 Meus Projetos | Delta Prompts</title><link rel="stylesheet" href="../style.css"><style>
body{margin:0;background:#f5f6fb;color:#202236;font-family:Inter,Arial}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.hero{padding:42px 0 25px;background:linear-gradient(135deg,#eef2ff,#fff)}h1{font-size:42px;margin:12px 0 5px}.muted{color:#666b7a}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{padding:10px 13px;border-radius:11px;background:#fff;border:1px solid #e5e7ef;text-decoration:none;color:inherit;font-weight:800}.box{margin:22px 0;padding:18px;background:#fff;border:1px solid #e5e7ef;border-radius:18px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.form input{padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.btn.primary{background:#5b5ce2;color:#fff;border:0;cursor:pointer}.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.project{padding:17px;border:1px solid #e5e7ef;border-radius:16px;background:#fff}.project h3{margin:0 0 5px}.project small{color:#666b7a}@media(max-width:650px){.form,.projects{grid-template-columns:1fr}}
</style></head><body><div id="deltaMenuBackdrop"></div><div id="menu"><div style="width:240px;min-height:100vh"></div></div><script src="../menu-loader.js?v=20261005" defer></script><main><section class="hero"><div class="wrap"><b>📁 MEU ESPAÇO • V1.16</b><h1>Meus projetos</h1><p class="muted">Organize os projetos que você mais trabalha e volte para eles sem procurar tudo de novo.</p><div class="nav"><a href="../index.html">🏠 Início</a><a href="melhorar.html">⚡ Começar uma melhoria</a><a href="progresso.html">🏆 Progresso</a></div></div></section><div class="wrap"><div class="box"><h2>➕ Adicionar projeto</h2><div class="form"><input id="nome" placeholder="Ex.: Minha Saúde IA"><input id="desc" placeholder="Ex.: site de saúde e organização"><button class="btn primary" id="add">Adicionar</button></div></div><div class="projects" id="list"></div></div></main><script>
const defaults=[['Minha Saúde IA','Sistema de saúde pessoal'],['Delta Prompts','Biblioteca e ferramentas de IA'],['Meu Jogo','Projetos e melhorias de jogos'],['Delta Imóveis','Ferramentas para trabalho imobiliário']];let data=JSON.parse(localStorage.deltaProjects||'null')||defaults.map(x=>({n:x[0],d:x[1]}));function save(){localStorage.deltaProjects=JSON.stringify(data)}function render(){document.getElementById('list').innerHTML=data.map((p,i)=>'<article class="project"><h3>📌 '+p.n+'</h3><small>'+p.d+'</small><p><a href="melhorar.html" class="btn">⚡ Começar uma melhoria</a> <button class="btn" onclick="removeProject('+i+')">Excluir</button></p><div style="margin-top:10px;padding-top:10px;border-top:1px solid #eee;font-size:12px;color:#666b7a">🎯 Próximo passo: escolher uma melhoria e registrar o que foi concluído.</div></article>').join('')}function removeProject(i){data.splice(i,1);save();render()}document.getElementById('add').onclick=()=>{const n=document.getElementById('nome').value.trim();if(!n)return;data.push({n,d:document.getElementById('desc').value.trim()||'Projeto pessoal'});save();document.getElementById('nome').value='';document.getElementById('desc').value='';render()};render();
</script></body></html>
