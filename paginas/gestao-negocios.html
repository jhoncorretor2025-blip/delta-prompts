<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de Negócios | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js?v=20260807"></script><main><h1>🏢 Gestão de Negócios</h1><p>Prompts para organizar a empresa, acompanhar resultados e tomar decisões melhores.</p><section class="card"><h2>🎯 Objetivo</h2><p>Transformar problemas de gestão em análises e planos de ação claros, sempre usando dados reais quando disponíveis.</p></section><div id="lista-prompts"></div></main><script>const prompts=[['📊 Diagnóstico de gestão','Analise a gestão deste negócio: [DESCRIÇÃO]. Equipe: [EQUIPE]. Processos: [PROCESSOS]. Resultados disponíveis: [DADOS]. Identifique gargalos, riscos e prioridades nas áreas comercial, operacional, financeira e pessoas.'],['🎯 Definir metas do negócio','Transforme este objetivo [OBJETIVO] em metas mensuráveis para [PERÍODO]. Defina indicador, meta, responsável, frequência de acompanhamento e ações principais.'],['📈 Criar painel de indicadores','Para o negócio [NEGÓCIO], proponha um painel enxuto de indicadores. Explique o que cada KPI mede, fórmula, frequência e qual decisão ele ajuda a tomar.'],['💰 Analisar custos e lucro','Analise estes dados de custos, receitas e margens: [DADOS]. Identifique desperdícios, riscos e oportunidades. Não invente números e destaque dados que faltam.'],['👥 Organizar responsabilidades','Equipe atual: [PESSOAS E FUNÇÕES]. Organize responsabilidades, decisões e entregas para reduzir sobreposição e tarefas sem dono.'],['📅 Reunião de gestão eficiente','Crie uma pauta de reunião de gestão de [TEMPO] minutos para acompanhar metas, problemas, decisões e responsáveis, evitando reuniões longas sem ação.'],['⚖️ Comparar decisões estratégicas','Compare estas opções para meu negócio: [OPÇÕES]. Critérios: [CRITÉRIOS]. Avalie impacto, custo, risco, prazo e reversibilidade. Recomende como testar antes de uma decisão grande.'],['🚨 Plano para negócio em dificuldade','Meu negócio enfrenta [PROBLEMAS]. Dados: [DADOS]. Crie um plano de estabilização priorizando caixa, clientes, operação e riscos, separando ações imediatas, 30 dias e 90 dias.'],['📋 Plano de ação 5W2H','Transforme este problema ou objetivo [TEMA] em um plano 5W2H prático, com responsáveis, prazos e critérios de conclusão.'],['🔄 Revisão mensal do negócio','Crie um roteiro de revisão mensal para meu negócio [DESCRIÇÃO], cobrindo resultados, metas, caixa, vendas, clientes, equipe, processos, aprendizados e prioridades do próximo mês.']];document.getElementById('lista-prompts').innerHTML=prompts.map((p,i)=>`<article class="card"><h2>${p[0]}</h2><pre class="prompt-text">${p[1]}</pre><button onclick="navigator.clipboard.writeText(prompts[${i}][1])">📋 Copiar</button></article>`).join('');</script></body></html>
