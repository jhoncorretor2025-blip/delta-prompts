const dadosBrutos=[
{categoria:'🌟 Manifestação',nivel:'basico',titulo:'🌟 Criar Afirmações de Lei da Atração',quando:'Para criar afirmações positivas e específicas para repetir diariamente.',prompt:`Crie afirmações de Lei da Atração para o que eu quero manifestar: [O QUE VOCÊ QUER MANIFESTAR]

How I want to feel: [DESIRED FEELING]

{categoria:'🌟 Manifestação',nivel:'intermediario',titulo:'🧲 Plano de Manifestação de um Objetivo',quando:'Para combinar visualização, afirmações e ações práticas rumo a um objetivo.',prompt:`Me ajude a criar um plano de manifestação para este objetivo: [OBJETIVO]

Timeframe I have in mind: [TIMEFRAME]

Put together a plan combining daily visualization, affirmations, and practical actions that support the manifestation (Law of Attraction works best paired with real action). Organize it by week.`},
{categoria:'🎯 Clareza',nivel:'basico',titulo:'🎯 Definir com Clareza o que Eu Quero Manifestar',quando:'Para quem sente que "quer tudo" mas não consegue focar em nada específico pra manifestar.',prompt:`Quero definir com mais clareza o que eu realmente quero manifestar na minha vida agora.

Áreas da vida que eu penso em melhorar: [ÁREAS, EX: AMOR, DINHEIRO, CARREIRA, SAÚDE]

Areas of life I've been thinking about improving: [AREAS, EG: LOVE, MONEY, CAREER, HEALTH]

{categoria:'🧘 Visualização',nivel:'basico',titulo:'🧘 Visualização Guiada para Manifestação',quando:'Para praticar a visualização de forma guiada, com um roteiro pronto pra seguir.',prompt:`Crie um roteiro de visualização guiada para manifestação.

O que eu quero visualizar: [OBJETIVO/DESEJO]
Tempo disponível: [TEMPO, EX: 10 MINUTOS]

Escreva um roteiro completo, com indução de relaxamento, e depois guie a visualização de forma vívida (usando os sentidos: o que eu veria, ouviria, sentiria se isso já tivesse se realizado), terminando com um fechamento de gratidão.`,en:`Create a guided visualization script for manifestation.

What I want to visualize: [GOAL/DESIRE]
Time available: [TIME, EG: 10 MINUTES]

Write a complete script, with a relaxation induction, then guide the visualization vividly (using the senses: what I would see, hear, feel if this had already happened), ending with a gratitude closing.`},
{categoria:'🌈 Ferramentas',nivel:'intermediario',titulo:'🌈 Criar um Vision Board em Texto',quando:'Para quem quer um quadro dos sonhos, mas de forma escrita e organizada.',prompt:`Quero criar um vision board (quadro de visualização), mas em formato de texto organizado.

Organize isso em um vision board textual, separado por área da vida, com uma frase de afirmação curta pra cada meta e uma imagem mental descrita (pra eu conseguir visualizar), pronto pra eu revisar sempre que precisar de motivação.`,en:`I want to create a vision board, but in organized text format.

My main goals and desires: [LIST YOUR GOALS AND DESIRES]
General timeframe I have in mind: [TIMEFRAME]

Organize this into a text-based vision board, separated by life area, with a short affirmation phrase for each goal and a described mental image (so I can visualize it), ready for me to review whenever I need motivation.`},
{categoria:'💭 Crenças',nivel:'intermediario',titulo:'💭 Identificar Crenças Limitantes que Bloqueiam a Manifestação',quando:'Para descobrir pensamentos que podem estar sabotando o que você quer atrair.',prompt:`Sinto que tenho crenças limitantes bloqueando o que eu quero manifestar.

O que eu quero manifestar: [OBJETIVO/DESEJO]
Pensamentos que passam pela minha cabeça sobre isso (mesmo os negativos): [PENSAMENTOS, SEJA HONESTO(A)]

Ajude a identificar possíveis crenças limitantes por trás desses pensamentos, explique de onde esse tipo de crença costuma vir, e sugira uma afirmação substituta mais empoderadora para cada crença limitante identificada.`,en:`I feel like I have limiting beliefs blocking what I want to manifest.

What I want to manifest: [GOAL/DESIRE]
Thoughts that go through my head about this (even the negative ones): [THOUGHTS, BE HONEST]

Help identify possible limiting beliefs behind these thoughts, explain where this type of belief usually comes from, and suggest a more empowering replacement affirmation for each limiting belief identified.`},
{categoria:'📿 Rotina',nivel:'basico',titulo:'📿 Ritual Semanal de Gratidão e Manifestação',quando:'Para criar o hábito de revisar gratidão e manifestação toda semana.',prompt:`Quero criar um ritual semanal combinando gratidão e manifestação.

Melhor dia da semana pra eu fazer isso: [DIA]
Tempo disponível: [TEMPO]

Crie um roteiro semanal simples com 3 partes: revisão do que já se manifestou ou melhorou na semana, prática de gratidão por isso, e renovação do foco pro que eu ainda quero manifestar na próxima semana.`,en:`I want to create a weekly ritual combining gratitude and manifestation.

Best day of the week for me to do this: [DAY]
Time available: [TIME]

Create a simple weekly script with 3 parts: reviewing what has already manifested or improved during the week, a gratitude practice for it, and renewing focus on what I still want to manifest next week.`},
{categoria:'🔄 Mentalidade',nivel:'avancado',titulo:'🔄 Reformular um Pensamento Negativo Recorrente',quando:'Para transformar um pensamento negativo específico numa versão mais alinhada com o que você quer atrair.',prompt:`Tenho um pensamento negativo recorrente que sinto que atrapalha minha manifestação.

O pensamento negativo (escreva exatamente como ele passa pela sua cabeça): [PENSAMENTO NEGATIVO]
Situação em que ele mais aparece: [SITUAÇÃO]

Ajude a reformular esse pensamento em uma versão mais realista e alinhada com o que eu quero atrair, sem soar falso ou forçado. Dê 3 versões diferentes de reformulação, do mais suave ao mais afirmativo, pra eu escolher a que soa mais verdadeira pra mim.`,en:`I have a recurring negative thought that I feel is getting in the way of my manifestation.

The negative thought (write it exactly as it goes through your head): [NEGATIVE THOUGHT]
Situation where it shows up most: [SITUATION]

Help reframe this thought into a more realistic version aligned with what I want to attract, without sounding fake or forced. Give 3 different reframed versions, from softer to more affirmative, so I can choose the one that feels most true to me.`},
{categoria:'🔓 Cura Emocional',nivel:'intermediario',titulo:'🔓 Quebra de Laço Energético',quando:'Para se sentir mais leve depois de encerrar um relacionamento, amizade ou situação que ainda pesa emocionalmente.',prompt:`Quero fazer um ritual simbólico de quebra de laço energético com uma pessoa ou situação.

Com quem ou o que é esse laço: [PESSOA OU SITUAÇÃO]
O que ainda me prende a isso: [O QUE VOCÊ SENTE QUE AINDA TE LIGA A ISSO]

Me guie por um ritual simbólico em texto, com uma visualização de corte desse laço, seguida de uma afirmação de libertação e um pequeno passo prático pra reforçar esse encerramento no dia a dia.`,en:`I want to do a symbolic energetic cord-cutting ritual with a person or situation.

Who or what is this bond with: [PERSON OR SITUATION]
What still ties me to it: [WHAT YOU FEEL STILL CONNECTS YOU TO IT]

Guide me through a symbolic ritual in text form, with a visualization of cutting that cord, followed by a liberation affirmation and a small practical step to reinforce that closure in daily life.`},
{categoria:'💌 Cartas Emocionais',nivel:'basico',titulo:'💌 Carta do Amor',quando:'Para expressar tudo o que sente por alguém (ou por você mesmo) de forma livre, sem precisar enviar.',prompt:`Quero escrever uma carta do amor, só pra colocar pra fora o que sinto — não vou enviar, é só pra mim.

Para quem é essa carta (pode ser outra pessoa ou eu mesmo): [DESTINATÁRIO]
O que eu sinto e quero expressar: [SENTIMENTOS PRINCIPAIS]

Escreva a carta em primeira pessoa, num tom sincero e carinhoso, me ajudando a colocar em palavras sentimentos que às vezes é difícil expressar sozinho.`,en:`I want to write a love letter, just to get out what I feel — I'm not going to send it, it's just for me.

Who is this letter for (can be another person or myself): [RECIPIENT]
What I feel and want to express: [MAIN FEELINGS]

Write the letter in first person, in a sincere and caring tone, helping me put into words feelings that are sometimes hard to express alone.`},
{categoria:'💌 Cartas Emocionais',nivel:'intermediario',titulo:'💢 Carta do Ódio',quando:'Para colocar pra fora raiva ou mágoa de forma segura e privada, sem julgamento — não é pra enviar a ninguém, é só um desabafo terapêutico.',prompt:`Quero escrever uma carta do ódio, só pra desabafar tudo que sinto — não vou enviar, é só um exercício privado pra colocar pra fora.

Para quem ou o que é essa raiva/mágoa: [PESSOA OU SITUAÇÃO]
O que aconteceu e o que eu não consegui dizer: [O QUE VOCÊ QUER COLOCAR PRA FORA]

Escreva a carta em primeira pessoa, sem filtro, deixando eu extravasar tudo que sinto sem julgamento. No final, adicione um parágrafo curto de fechamento simbólico, marcando que, ao escrever isso, estou soltando esse peso.`,en:`I want to write a hate letter, just to vent everything I feel — I'm not going to send it, it's just a private exercise to release it.

Who or what is this anger/hurt about: [PERSON OR SITUATION]
What happened and what I couldn't say: [WHAT YOU WANT TO GET OUT]

Write the letter in first person, unfiltered, letting me vent everything I feel without judgment. At the end, add a short closing paragraph marking that, by writing this, I am releasing this weight.`},
{categoria:'🙏 Práticas Havaianas',nivel:'intermediario',titulo:'🙏 Ho\'oponopono',quando:'Para praticar a técnica havaiana de perdão e reconciliação com uma situação, pessoa ou parte de você mesmo.',prompt:`Quero fazer uma prática de Ho'oponopono (a técnica havaiana das 4 frases: Sinto muito, Me perdoe, Te amo, Sou grato) sobre uma situação específica.

O que estou tentando curar ou liberar: [O QUE VOCÊ QUER CURAR]

Me guie por uma prática de Ho'oponopono nessa situação, explicando o significado de cada uma das 4 frases nesse contexto específico, e termine com uma versão curta que eu possa repetir como mantra diário.`,en:`I want to do a Ho'oponopono practice (the Hawaiian technique of 4 phrases: I'm sorry, Please forgive me, Thank you, I love you) about a specific situation.

Situation or person involved: [SITUATION OR PERSON]
What I'm trying to heal or release: [WHAT YOU WANT TO HEAL]

Guide me through a Ho'oponopono practice for this situation, explaining the meaning of each of the 4 phrases in this specific context, and end with a short version I can repeat as a daily mantra.`},
{categoria:'✨ Prompt Master',nivel:'avancado',titulo:'✨ Ritual Completo de Cura Emocional (Gratidão + Laço + Cartas + Ho\'oponopono)',quando:'Prompt Master: junta gratidão, quebra de laço energético, carta do amor, carta do ódio e Ho\'oponopono num único ritual guiado completo, para quando você quer fazer um processo de cura mais profundo de uma vez.',prompt:`Quero um ritual completo de cura emocional, combinando várias práticas numa sequência só.

Situação ou pessoa central desse processo: [SITUAÇÃO OU PESSOA]
O que eu quero curar, soltar ou transformar: [OBJETIVO DO RITUAL]

Me guie por um ritual completo, na seguinte ordem:
1) Gratidão: comece me ajudando a encontrar 3 coisas boas que essa situação/pessoa me trouxe, mesmo que hoje doa.
2) Carta do Ódio: em seguida, escreva uma carta desabafando tudo que ficou mal resolvido (não vou enviar, é só pra soltar).
3) Carta do Amor: depois, escreva uma carta reconhecendo o lado bom, o carinho ou o aprendizado que restou.

Apresente cada etapa separada e numerada, com uma transição curta entre elas, como se fosse um processo guiado do início ao fim.`,en:`I want a complete emotional healing ritual, combining several practices in a single sequence.

Situation or central person in this process: [SITUATION OR PERSON]
What I want to heal, release or transform: [RITUAL GOAL]

Guide me through a complete ritual, in the following order:
1) Gratitude: start by helping me find 3 good things this situation/person brought me, even if it hurts today.
2) Hate Letter: then, write a letter venting everything that was left unresolved (I won't send it, it's just to release it).
3) Love Letter: then, write a letter acknowledging the good side, the affection or the lesson that remained.
4) Energetic Cord Cutting: guide a symbolic visualization of cutting the cord that still ties me to this.
5) Ho'oponopono: finish with the practice of the 4 phrases (I'm sorry, please forgive me, I love you, thank you) closing the ritual.

Present each stage separately and numbered, with a short transition between them, as if it were a guided process from start to finish.`}
];

const prompts=dadosBrutos.map((x,i)=>{
  const obj={id:'decor-'+i,categoria:x.categoria,nivel:x.nivel,titulo:x.titulo,quando:x.quando,prompt:x.prompt,promptEn:x.en,novo:true};
  obj.placeholders=[...new Set((obj.prompt.match(/\[([^\]]+)\]/g)||[]).map(s=>s.slice(1,-1)))];
  return obj;
});

const idiomaAtivo={};
let categoriaAtual='todos';

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function nivelLabel(n){return n==='avancado'?'🔴 Avançado':n==='intermediario'?'🟡 Intermediário':'🟢 Básico'}
function mostrarToast(texto){const t=document.getElementById('toast');if(!t)return;t.textContent=texto;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}

function _loadFav(){try{return JSON.parse(localStorage.getItem('deltaFavoritos'))||[]}catch(e){return[]}}
function _saveFav(l){try{localStorage.setItem('deltaFavoritos',JSON.stringify(l))}catch(e){}}
function isFav(id){return _loadFav().some(f=>f.id===id)}
function textoBase(id){const p=getItem(id);if(!p)return'';return idiomaAtivo[id]==='en'?(p.promptEn||p.prompt):p.prompt}
function textoFinal(id){const p=getItem(id);if(!p)return'';let t=textoBase(id);(p.placeholders||[]).forEach((ph,idx)=>{const el=document.getElementById('campo-'+id+'-'+idx);const val=el?el.value.trim():'';if(val){const re=new RegExp('\\['+ph.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]','g');t=t.replace(re,val)}});return t}
function getItem(id){return prompts.find(p=>p.id===id)}
function atualizarBtnFav(id,btn){if(!btn)return;if(isFav(id)){btn.textContent='❤️ Favoritado';btn.classList.add('is-fav')}else{btn.textContent='🤍 Favoritar';btn.classList.remove('is-fav')}}
function favoritar(id,btn){const p=getItem(id);if(!p)return;let l=_loadFav();const idx=l.findIndex(f=>f.id===id);if(idx===-1){l.unshift({id,titulo:p.titulo,texto:textoFinal(id),categoria:'Lei da Atração',createdAt:Date.now()});_saveFav(l);mostrarToast('💖 Adicionado aos favoritos!')}else{l.splice(idx,1);_saveFav(l);mostrarToast('🤍 Removido dos favoritos')}atualizarBtnFav(id,btn);window.dispatchEvent(new CustomEvent('delta:favoritos-updated'))}

function _loadUsos(){try{return JSON.parse(localStorage.getItem('deltaLeiAtracaoUsos'))||{}}catch(e){return{}}}
function _saveUsos(o){try{localStorage.setItem('deltaLeiAtracaoUsos',JSON.stringify(o))}catch(e){}}
function registrarUso(id){const usos=_loadUsos();usos[id]=(usos[id]||0)+1;_saveUsos(usos)}

function _loadFeedback(){try{return JSON.parse(localStorage.getItem('deltaLeiAtracaoFeedback'))||{}}catch(e){return{}}}
function _saveFeedback(o){try{localStorage.setItem('deltaLeiAtracaoFeedback',JSON.stringify(o))}catch(e){}}
function darFeedback(id,tipo){
  const fb=_loadFeedback();const atual=fb[id]&&fb[id].voto;if(!fb[id])fb[id]={voto:null};
  const g=window.deltaAuth;
  if(atual===tipo){fb[id].voto=null;if(g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,tipo,-1)}
  else{if(atual&&g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,atual,-1);fb[id].voto=tipo;if(g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,tipo,1)}
  _saveFeedback(fb);atualizarFeedbackUI(id);
  mostrarToast(tipo==='up'?'👍 Obrigado pelo feedback!':'👎 Obrigado, vamos melhorar esse!');
}
function atualizarFeedbackUI(id){
  const fb=_loadFeedback()[id]||{voto:null};
  const up=document.getElementById('fbup-'+id),down=document.getElementById('fbdown-'+id);
  if(up)up.classList.toggle('marcado',fb.voto==='up');
  if(down)down.classList.toggle('marcado',fb.voto==='down');
  const g=window.deltaAuth;
  if(g&&g.obterFeedbackGlobal){g.obterFeedbackGlobal(id).then(r=>{if(up)up.textContent='👍 '+(r.up||0);if(down)down.textContent='👎 '+(r.down||0)})}
}

function alternarIdioma(id){
  idiomaAtivo[id]=idiomaAtivo[id]==='en'?'pt':'en';
  const pre=document.getElementById('prompt-'+id),btn=document.getElementById('idioma-'+id);
  if(pre)pre.textContent=textoFinal(id);
  if(btn){btn.textContent=idiomaAtivo[id]==='en'?'🇧🇷 Ver em Português':'🌐 View in English';btn.classList.toggle('ativo-en',idiomaAtivo[id]==='en')}
}
async function copiarPorId(id){registrarUso(id);try{await navigator.clipboard.writeText(textoFinal(id));mostrarToast('📋 Copiado!')}catch(e){mostrarToast('Não foi possível copiar')}}
async function abrirChat(id){registrarUso(id);try{await navigator.clipboard.writeText(textoFinal(id))}catch(e){}mostrarToast('✓ Copiado! Abrindo...');setTimeout(()=>window.open('https://chatgpt.com/','_blank'),300)}
async function abrirGemini(id){registrarUso(id);try{await navigator.clipboard.writeText(textoFinal(id))}catch(e){}mostrarToast('✓ Copiado! Abrindo...');setTimeout(()=>window.open('https://gemini.google.com/app','_blank'),300)}
function compartilhar(id){
  const p=getItem(id);if(!p)return;
  const texto='🛋️ '+p.titulo+'\n\n'+textoFinal(id)+'\n\n— via Delta Prompts';
  if(navigator.share){navigator.share({title:p.titulo,text:texto}).catch(()=>{})}
  else{navigator.clipboard.writeText(texto).then(()=>mostrarToast('🔗 Copiado! Cole onde quiser compartilhar.'))}
}
function exportarTodos(){
  const linhas=prompts.map(p=>p.titulo+' ('+p.categoria+')\n'+p.prompt);
  const blob=new Blob(['🛋️ ESPIRITUALIDADE — DELTA PROMPTS\n\n'+linhas.join('\n\n'+'─'.repeat(40)+'\n\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='deltaespiritualidade.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  mostrarToast('📥 Arquivo baixado!');
}
function toggleSugerir(){const box=document.getElementById('sugerirBox');box.style.display=(box.style.display==='none'||!box.style.display)?'block':'none'}
function copiarSugestao(){const texto=document.getElementById('sugestaoTexto').value.trim();if(!texto){mostrarToast('Escreva sua ideia antes de copiar 🙂');return}navigator.clipboard.writeText('💡 Sugestão para o Delta Prompts (Lei da Atração):\n\n'+texto).then(()=>mostrarToast('📋 Sugestão copiada! Envie pra gente 💌'))}
function atualizarStats(){const favs=_loadFav().filter(f=>f.categoria==='Lei da Atração').length;document.getElementById('statsBar').innerHTML='⭐ Você já favoritou <strong>'+favs+'</strong> modelo'+(favs===1?'':'s')+' · 🛋️ <strong>'+prompts.length+'</strong> modelos disponíveis'}
function aplicarTema(t){document.documentElement.setAttribute('data-theme',t);const btn=document.getElementById('themeToggle');if(btn)btn.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('deltaTheme',t)}catch(e){}}

function montarFiltroCategoria(){
  const cont=document.getElementById('filtrosCategoria');
  const categorias=[...new Set(prompts.map(p=>p.categoria))];
  cont.innerHTML='<button class="'+(categoriaAtual==='todos'?'ativo':'')+'" data-categoria="todos">Todos <span class="count-badge">'+prompts.length+'</span></button>'+
    categorias.map(c=>{const n=prompts.filter(p=>p.categoria===c).length;return `<button class="${categoriaAtual===c?'ativo':''}" data-categoria="${c}">${c} <span class="count-badge">${n}</span></button>`}).join('');
  cont.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{categoriaAtual=b.dataset.categoria;montarFiltroCategoria();render()}));
}

function render(){
  const termo=norm(document.getElementById('busca').value);
  const filtrados=prompts.filter(p=>{
    const texto=norm([p.titulo,p.quando,p.categoria,p.prompt].join(' '));
    return(!termo||texto.includes(termo))&&(categoriaAtual==='todos'||p.categoria===categoriaAtual);
  });
  document.getElementById('contador').textContent=filtrados.length+' de '+prompts.length+' modelos';
  const lista=document.getElementById('lista');
  lista.innerHTML=filtrados.length?filtrados.map(p=>`
    <section class="card" id="card-${p.id}">
      <span class="tag">${p.categoria}</span><span class="nivel nivel-${p.nivel}">${nivelLabel(p.nivel)}</span>
      <h3>${p.titulo}</h3>
      <p style="color:#667085;font-size:13.5px;margin:4px 0 10px">${p.quando}</p>
      ${p.placeholders.length?`<div class="campos-preenchimento">${p.placeholders.map((ph,idx)=>`<label class="campo-label">✏️ ${ph}<input type="text" id="campo-${p.id}-${idx}" placeholder="Preencha antes de copiar (opcional)"></label>`).join('')}</div>`:''}
      <div class="prompt-text" id="prompt-${p.id}">${p.prompt}</div>
      <div class="acoes">
        <button class="copiar" data-acao="copiar" data-id="${p.id}">📋 Copiar</button>
        <button class="favoritar" data-acao="favoritar" data-id="${p.id}">🤍 Favoritar</button>
        <button data-acao="chat" data-id="${p.id}">🤖 ChatGPT</button>
        <button data-acao="gemini" data-id="${p.id}">✨ Gemini</button>
        <button class="compartilhar" data-acao="compartilhar" data-id="${p.id}">🔗 Compartilhar</button>
        <button class="idioma" id="idioma-${p.id}" data-acao="idioma" data-id="${p.id}">🌐 View in English</button>
      </div>
      <div class="feedback-row"><span style="font-size:12px;color:#8a92a6">Esse modelo te ajudou?</span><button id="fbup-${p.id}" data-acao="fbup" data-id="${p.id}">👍 0</button><button id="fbdown-${p.id}" data-acao="fbdown" data-id="${p.id}">👎 0</button></div>
    </section>`).join('') : '<div style="text-align:center;padding:30px;opacity:.7">🔎 Nenhum modelo encontrado.</div>';

  filtrados.forEach(p=>{atualizarBtnFav(p.id,document.querySelector('#card-'+p.id+' .favoritar'));atualizarFeedbackUI(p.id)});
}

document.getElementById('lista').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-acao]');
  if(!btn)return;
  const acao=btn.dataset.acao,id=btn.dataset.id;
  if(acao==='copiar')copiarPorId(id);
  else if(acao==='chat')abrirChat(id);
  else if(acao==='gemini')abrirGemini(id);
  else if(acao==='idioma')alternarIdioma(id);
  else if(acao==='favoritar')favoritar(id,btn);
  else if(acao==='compartilhar')compartilhar(id);
  else if(acao==='fbup')darFeedback(id,'up');
  else if(acao==='fbdown')darFeedback(id,'down');
});

document.getElementById('busca').addEventListener('input',render);
document.getElementById('btnExportar').addEventListener('click',exportarTodos);
document.getElementById('btnSugerir').addEventListener('click',toggleSugerir);
document.getElementById('btnCopiarSugestao').addEventListener('click',copiarSugestao);
document.getElementById('themeToggle').addEventListener('click',()=>{const atual=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';aplicarTema(atual)});

aplicarTema((function(){try{return localStorage.getItem('deltaTheme')||'light'}catch(e){return'light'}})());
montarFiltroCategoria();
atualizarStats();
render();
window.addEventListener('delta:favoritos-updated',atualizarStats);
</script></body></html>
