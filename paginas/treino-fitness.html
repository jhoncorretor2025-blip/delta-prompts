<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treino & Fitness | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js?v=20260804"></script><main><h1>🏋️ Treino & Fitness</h1><p>Prompts para organizar treinos, acompanhar evolução e entender melhor sua rotina de exercícios.</p><section class="card"><h2>⚠️ Como usar</h2><p>Use para planejamento geral e organização. Dor, lesão, sintomas ou condições de saúde exigem avaliação de profissional qualificado.</p></section><div id="lista-prompts"></div></main><script>const prompts=[['📅 Organizar rotina de treino','Organize uma rotina semanal de exercícios considerando: objetivo [OBJETIVO], experiência [NÍVEL], dias disponíveis [DIAS], tempo por sessão [TEMPO], equipamentos [EQUIPAMENTOS] e limitações informadas [LIMITAÇÕES]. Priorize progressão gradual e recuperação.'],['🎯 Definir objetivo de treino','Meu objetivo é [OBJETIVO]. Minha rotina atual é [ROTINA]. Ajude a transformar isso em metas realistas e mensuráveis de processo e desempenho, sem prometer resultados físicos específicos.'],['📊 Acompanhar evolução','Crie uma forma simples de acompanhar minha evolução em [OBJETIVO], usando indicadores de treino, consistência, recuperação e desempenho.'],['🔄 Revisar divisão de treino','Analise esta divisão semanal: [DIVISÃO]. Objetivo: [OBJETIVO]. Verifique equilíbrio entre grupos musculares, frequência, recuperação e duração. Aponte informações que faltam.'],['⏱️ Treino para pouco tempo','Tenho [TEMPO] minutos e acesso a [EQUIPAMENTOS]. Sugira uma estrutura eficiente de sessão para [OBJETIVO], com aquecimento, parte principal e volta à calma.'],['🏠 Adaptar treino para casa','Adapte esta rotina [ROTINA] para treinar em casa usando [EQUIPAMENTOS DISPONÍVEIS], mantendo padrões de movimento semelhantes quando possível.'],['📈 Criar progressão','Para estes exercícios [LISTA], explique formas gerais de progressão por repetições, carga, séries, técnica ou dificuldade, com critérios conservadores para avançar.'],['😴 Melhorar recuperação','Analise minha rotina de recuperação: sono [SONO], frequência de treino [FREQUÊNCIA], descanso [DESCANSO] e percepção de fadiga [FADIGA]. Sugira hábitos gerais e sinais de que devo reduzir intensidade ou procurar avaliação.'],['📝 Diário de treino','Crie um modelo simples de diário de treino para registrar exercício, séries, repetições, carga, esforço percebido, observações e evolução semanal.'],['🧳 Manter rotina em viagem','Vou viajar por [PERÍODO] e terei acesso a [RECURSOS]. Ajude a adaptar minha rotina para manter consistência com sessões simples e flexíveis.']];document.getElementById('lista-prompts').innerHTML=prompts.map((p,i)=>`<article class="card"><h2>${p[0]}</h2><pre class="prompt-text">${p[1]}</pre><button onclick="navigator.clipboard.writeText(prompts[${i}][1])">📋 Copiar</button></article>`).join('');</script></body></html>
