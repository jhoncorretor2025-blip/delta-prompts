<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skills | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"><style>.intro{padding:22px;background:linear-gradient(135deg,#eef2ff,#fff);border-radius:18px;margin-bottom:24px}.prompt-text{white-space:pre-wrap;background:#f8fafc;padding:15px;border-radius:12px}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag{font-size:12px;font-weight:800;background:#eef2ff;padding:5px 9px;border-radius:999px}.top{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.top input{flex:1;min-width:220px;padding:13px;border-radius:12px;border:1px solid #ddd}</style></head><body class="category-page"><div id="menu"></div><script src="/delta-prompts/menu-loader.js"></script><main><h1>🧠 Skills de IA</h1><div class="intro"><h3>O que é uma Skill?</h3><p>Uma instrução reutilizável para executar uma tarefa específica sempre do mesmo jeito. Escolha, copie e use no seu chat ou GPT personalizado.</p></div><div class="top"><input id="busca" placeholder="🔎 Buscar skill..."><strong id="contador"></strong></div><div id="lista"></div></main><script>
const dados=[
['✍️ Corretor de Português','Texto','Corrigir mensagens mantendo seu jeito natural','/corrigir','Sempre que eu enviar um texto após /corrigir, corrija ortografia, pontuação, concordância e erros de digitação. Preserve meu jeito natural de falar, não deixe excessivamente formal, não altere o significado e entregue somente o texto corrigido, salvo se eu pedir explicações.'],
['✨ Melhorador de Texto','Texto','Deixar qualquer texto mais claro e bem escrito','/melhorar','Quando eu usar /melhorar, preserve minha intenção, corrija o português, organize ideias confusas e torne o texto mais claro, natural e adequado ao contexto. Não invente informações. Entregue a versão melhorada pronta para uso.'],
['📋 Resumidor Inteligente','Estudo','Transformar conteúdo longo em algo fácil de entender','/resumir','Quando eu usar /resumir, transforme o conteúdo em: 1) resumo principal, 2) pontos mais importantes e 3) o que merece atenção. Elimine repetições e priorize o que é realmente útil.'],
['🧠 Organizador de Ideias','Pessoal','Organizar pensamentos enviados de forma solta','/organizar','Quando eu usar /organizar, identifique o que estou tentando comunicar e organize em situação, objetivo, problemas, ideias e próximos passos quando essas divisões fizerem sentido. Preserve minha intenção original.'],
['🎓 Professor Simples','Estudo','Explicar qualquer assunto para iniciantes','/explicar','Quando eu usar /explicar, ensine em cinco partes: explicação simples, analogia cotidiana, exemplo prático, aplicação na vida real e resumo em uma frase. Comece simples e aprofunde apenas quando necessário.'],
['❓ Questionador 5X','Raciocínio','Descobrir pontos que faltam em uma ideia','/questionador','Analise o conteúdo enviado e faça exatamente 5 perguntas específicas e relevantes para descobrir informações ausentes, riscos, objetivos e pontos não considerados. Não responda às perguntas por mim.'],
['⚖️ Assistente de Decisão','Pessoal','Organizar decisões sem decidir cegamente por você','/decidir','Analise situação, fatos, sentimentos, opções, vantagens, desvantagens, riscos e consequências. Mostre o que ainda falta saber e indique qual opção parece mais coerente com as informações disponíveis, explicando o motivo.'],
['🔍 Crítico Construtivo','Raciocínio','Testar uma ideia antes de executar','/criticar','Analise minha ideia sem concordar automaticamente. Mostre pontos fortes, pontos fracos, riscos, contradições, informações ausentes e melhorias possíveis. Seja claro e construtivo.'],
['💡 Gerador de Ideias','Criatividade','Criar possibilidades novas e práticas','/ideias','Gere ideias a partir do tema enviado. Organize das mais simples e práticas para as mais criativas e diferentes. Evite sugestões repetitivas ou genéricas.'],
['📱 WhatsApp Natural','Comunicação','Transformar texto em mensagem pronta para WhatsApp','/whatsapp','Transforme o conteúdo em uma mensagem de WhatsApp clara, humana e direta, sem parecer escrita por IA. Preserve meu jeito de falar e adapte automaticamente entre contexto pessoal e profissional.']
].map((x,i)=>({id:i,titulo:x[0],categoria:x[1],quando:x[2],comando:x[3],prompt:x[4]}));
function copiar(t){navigator.clipboard.writeText(t);alert('Skill copiada!')}function render(){const q=document.getElementById('busca').value.toLowerCase();const f=dados.filter(x=>(x.titulo+x.categoria+x.quando+x.comando).toLowerCase().includes(q));document.getElementById('contador').textContent=f.length+' skills';document.getElementById('lista').innerHTML=f.map(x=>`<section class="card"><span class="tag">${x.categoria}</span><h3>${x.titulo}</h3><p><strong>Comando:</strong> ${x.comando}</p><p><strong>💡 Quando usar:</strong> ${x.quando}</p><div class="prompt-text">${x.prompt}</div><div class="acoes"><button onclick='copiar(${JSON.stringify(x.prompt)})'>📋 Copiar Skill</button><button onclick='navigator.clipboard.writeText(${JSON.stringify(x.prompt)});window.open("https://chatgpt.com/","_blank")'>🤖 ChatGPT</button></div></section>`).join('')}document.getElementById('busca').oninput=render;render();</script></body></html>
