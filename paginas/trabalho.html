<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Trabalho Estratégico | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css">

</head>

<body>

<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js"></script>

<main>

<h1>💼 Trabalho Estratégico com IA</h1>

<p>
Prompts profissionais para melhorar performance, organização,
posicionamento e tomada de decisão no ambiente de trabalho.
</p>

<section class="card">
<h3>🎯 Objetivo</h3>
<p>
Ajudar profissionais a estruturar tarefas, resolver problemas,
organizar projetos e crescer estrategicamente na carreira.
</p>
</section>

<div class="top-bar">
<input
type="text"
id="busca"
placeholder="🔎 Buscar modelo profissional..."
oninput="filtrarPrompts()"
>
<div class="contador" id="contador"></div>
</div>

<div class="filtro-nivel" style="margin-bottom:20px;">
<button onclick="filtrarNivel(event, 'todos')" class="ativo">Todos</button>
<button onclick="filtrarNivel(event, 'basico')">🟢 Básico</button>
<button onclick="filtrarNivel(event, 'intermediario')">🟡 Intermediário</button>
<button onclick="filtrarNivel(event, 'avancado')">🔴 Avançado</button>
</div>

<div id="lista-prompts"></div>

</main>

<script>

const ordemCategorias = [
"📋 Organização",
"📈 Produtividade",
"🎯 Estratégia",
"🚀 Crescimento Profissional"
];

const promptsTrabalho = [

{
categoria: "📋 Organização",
nivel: "basico",
titulo: "📋 Organização de Tarefas",
quando: "Quando estiver sobrecarregado e precisar organizar prioridades.",
prompt: `Você é especialista em produtividade.

Organize minhas tarefas abaixo em ordem de prioridade:

[LISTA DE TAREFAS]

Classifique por:
- Urgência
- Importância
- Impacto
- Tempo estimado

Sugira plano de execução para hoje.`
},

{
categoria: "📈 Produtividade",
nivel: "intermediario",
titulo: "📈 Plano de Alta Performance",
quando: "Para melhorar produtividade semanal.",
prompt: `Você é consultor de alta performance profissional.

Monte um plano de produtividade considerando:

- Minha função: [CARGO]
- Minha rotina atual: [DESCREVER]
- Objetivo profissional: [OBJETIVO]

Inclua:
- Rotina ideal
- Blocos de foco
- Métricas de acompanhamento
- Ajustes estratégicos`
},

{
categoria: "🎯 Estratégia",
nivel: "avancado",
titulo: "🎯 Planejamento Estratégico Profissional",
quando: "Para estruturar metas e decisões importantes.",
prompt: `Atue como estrategista corporativo.

Monte um planejamento estratégico para:

[OBJETIVO PROFISSIONAL]

Inclua:
- Análise de cenário
- Riscos
- Oportunidades
- Plano de ação
- Indicadores de sucesso
- Cronograma`
},

  {
categoria: "📈 Produtividade",
nivel: "intermediario",
titulo: "🧠 Organização Estratégica da Rotina Profissional",
quando: "Quando quiser organizar sua rotina semanal de forma mais produtiva e estratégica.",
prompt: `Você é um consultor de produtividade executiva.

OBJETIVO:
Organizar minha rotina profissional de forma estratégica.

INSTRUÇÕES:
1. Estruture minha semana em blocos produtivos.
2. Separe tarefas por prioridade (alta, média e baixa).
3. Identifique tarefas que podem ser delegadas.
4. Sugira um método simples de acompanhamento diário.
5. Inclua um modelo prático de planejamento semanal.

Seja claro, direto e aplicável à rotina profissional.`
},

{
categoria: "🚀 Crescimento Profissional",
nivel: "avancado",
titulo: "🚀 Otimização Estratégica de Currículo e LinkedIn",
quando: "Quando quiser melhorar posicionamento profissional e aumentar oportunidades.",
prompt: `Você é um especialista em posicionamento profissional e marca pessoal.

Crie um plano estratégico para otimizar meu currículo e perfil do LinkedIn.

Inclua:

- Estrutura ideal do currículo
- Palavras-chave estratégicas para minha área
- Como destacar resultados e métricas
- Erros comuns a evitar
- Modelo resumido de apresentação profissional

Seja estratégico, competitivo e alinhado ao mercado atual.`
},

{
categoria: "🚀 Crescimento Profissional",
nivel: "avancado",
titulo: "🚀 Plano de Crescimento de Carreira",
quando: "Quando quiser evoluir profissionalmente.",
prompt: `Você é especialista em desenvolvimento de carreira.

Crie um plano de crescimento profissional considerando:

- Minha área: [ÁREA]
- Meu nível atual: [NÍVEL]
- Objetivo futuro: [OBJETIVO]

Inclua:
- Competências a desenvolver
- Estratégia de networking
- Posicionamento profissional
- Plano de 6 meses`
}

];

const lista = document.getElementById("lista-prompts");
const contador = document.getElementById("contador");
const busca = document.getElementById("busca");

function renderizar(arr){

lista.innerHTML = "";
contador.innerText = `Total: ${arr.length} modelo${arr.length !== 1 ? "s" : ""}`;

ordemCategorias.forEach(cat => {

const grupo = arr.filter(p => p.categoria === cat);
if(grupo.length === 0) return;

const tituloSecao = document.createElement("h2");
tituloSecao.className = "secao-titulo";
tituloSecao.innerText = cat;
lista.appendChild(tituloSecao);

grupo.forEach(p => {

const card = document.createElement("div");
card.className = "card";
card.setAttribute("data-nivel", p.nivel);

card.innerHTML = `
<div class="nivel nivel-${p.nivel}">
${p.nivel === 'avancado' ? '🔴 Avançado' :
p.nivel === 'intermediario' ? '🟡 Intermediário' :
'🟢 Básico'}
</div>

<h3>${p.titulo}</h3>
<p><strong>📌 Quando usar:</strong> ${p.quando}</p>
<pre>${p.prompt}</pre>

<div class="acoes">
<button onclick="copiarPrompt(\`${p.prompt}\`)">📋 Copiar</button>
<button onclick="favoritarPrompt('${p.titulo}', \`${p.prompt}\`)">⭐ Favoritar</button>
<button onclick="abrirChatGPT(\`${p.prompt}\`)">💬 ChatGPT</button>
<button onclick="abrirGemini(\`${p.prompt}\`)">🔷 Gemini</button>
</div>
`;

lista.appendChild(card);

});

});

}

function filtrarPrompts(){
const termo = busca.value.toLowerCase();
const filtrados = promptsTrabalho.filter(p =>
p.titulo.toLowerCase().includes(termo) ||
p.prompt.toLowerCase().includes(termo) ||
p.categoria.toLowerCase().includes(termo)
);
renderizar(filtrados);
}

function filtrarNivel(event, nivel){
const botoes = document.querySelectorAll(".filtro-nivel button");
botoes.forEach(btn => btn.classList.remove("ativo"));
event.target.classList.add("ativo");

const cards = document.querySelectorAll("#lista-prompts .card");

cards.forEach(card=>{
if(nivel === "todos"){
card.style.display = "block";
}else{
card.style.display =
card.dataset.nivel === nivel ? "block" : "none";
}
});
}

function copiarPrompt(texto){
navigator.clipboard.writeText(texto);
alert("📋 Prompt copiado!");
}

function favoritarPrompt(titulo, conteudo){
const prompts = JSON.parse(localStorage.getItem("deltaPrompts")) || [];
prompts.push({
id: Date.now(),
titulo,
categoria: "Trabalho",
conteudo,
favorito: true
});
localStorage.setItem("deltaPrompts", JSON.stringify(prompts));
alert("⭐ Adicionado aos favoritos!");
}

function abrirChatGPT(texto){
window.open("https://chat.openai.com/?prompt=" + encodeURIComponent(texto));
}

function abrirGemini(texto){
window.open("https://gemini.google.com/app?prompt=" + encodeURIComponent(texto));
}

renderizar(promptsTrabalho);

</script>

</body>
</html>
