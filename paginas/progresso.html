<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="delta-version" content="V1.18"><title>Meu Progresso | Delta Prompts V1.18</title><link rel="stylesheet" href="../style.css"><style>
body{margin:0;background:#f5f6fb;color:#202236;font-family:Inter,Arial}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.hero{padding:42px 0 25px;background:linear-gradient(135deg,#fff7ed,#eef2ff)}h1{font-size:42px;margin:12px 0 5px}.muted{color:#666b7a}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:10px 13px;border-radius:11px;background:#fff;border:1px solid #e5e7ef;text-decoration:none;color:inherit;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{background:#fff;border:1px solid #e5e7ef;border-radius:17px;padding:20px}.stat b{display:block;font-size:30px;color:#5b5ce2}.level{background:#fff;border:1px solid #e5e7ef;border-radius:18px;padding:20px}.bar{height:12px;background:#eceef5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#5b5ce2;width:0}.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.item{padding:15px;background:#fff;border:1px solid #e5e7ef;border-radius:15px}.item.lock{opacity:.45}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.ach{grid-template-columns:1fr}}
</style></head><body><div id="deltaMenuBackdrop"></div><div id="menu"><div style="width:240px;min-height:100vh"></div></div><script src="../menu-loader.js?v=20261005" defer></script><script src="../js/delta-core.js"></script><main><section class="hero"><div class="wrap"><b>🏆 MEU PROGRESSO • V1.18</b><h1>Seu progresso no Delta</h1><p class="muted">Cada uso útil transforma o Delta em uma ferramenta de trabalho recorrente.</p><div class="nav"><a href="../index.html">🏠 Início</a><a href="melhorar.html">⚡ Começar uma melhoria</a><a href="meu-espaco.html">📁 Meus projetos</a></div></div></section><div class="wrap"><div class="stats"><div class="stat">⚡ XP<b id="xp">0</b></div><div class="stat">🎯 Nível<b id="level">Novato</b></div><div class="stat">🔥 Sequência<b id="streak">0 dias</b></div></div><div class="stats" id="results"></div><div class="level"><h2>Próximo nível</h2><p id="next" class="muted"></p><div class="bar"><i id="bar"></i></div></div><h2 style="margin-top:26px">📜 Histórico recente</h2><div id="history" class="ach"></div><h2 style="margin-top:26px">🏅 Conquistas</h2><div class="ach" id="ach"></div></div></main><script>
const levels=[['Novato',0],['Explorador',25],['Praticante',75],['Pro',150],['Especialista',300],['Mestre Delta',600]];
const st=Delta.stats(),xp=st.xp;let idx=0;for(let i=0;i<levels.length;i++)if(xp>=levels[i][1])idx=i;
const next=levels[Math.min(idx+1,levels.length-1)];
document.getElementById('xp').textContent=xp;document.getElementById('level').textContent=levels[idx][0];
if(next&&next[1]>xp){const base=levels[idx][1],pct=Math.min(100,Math.round((xp-base)/(next[1]-base)*100));document.getElementById('next').textContent=(next[1]-xp)+' XP para '+next[0];document.getElementById('bar').style.width=pct+'%'}else{document.getElementById('next').textContent='🏆 Você chegou ao nível máximo atual!';document.getElementById('bar').style.width='100%'}
const hoje=new Date();hoje.setHours(0,0,0,0);const datas=Delta.read(Delta.KEY.usage,[]).map(d=>new Date(d+'T00:00:00').getTime()).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>b-a);let streak=0,cursor=hoje.getTime();for(const d of datas){if(d===cursor){streak++;cursor-=86400000}else if(d<cursor)break}document.getElementById('streak').textContent=streak+' dia'+(streak===1?'':'s');
document.getElementById('results').innerHTML='<div class="stat">📁 Projetos<b>'+st.projects+'</b></div><div class="stat">🧪 Resultados<b>'+st.results+'</b></div><div class="stat">✅ Concluídas<b>'+st.completed+'</b></div>';
const ach=[['🔎','Primeira busca',xp>=2],['📋','Primeiro prompt copiado',xp>=5],['⭐','Primeiro favorito',xp>=8],['⚡','10 XP acumulados',xp>=10],['🚀','50 XP acumulados',xp>=50],['🏆','100 XP acumulados',xp>=100],['💎','300 XP acumulados',xp>=300],['👑','Mestre Delta',xp>=600],['🧪','Primeiro resultado registrado',st.results>=1],['✅','Primeira melhoria concluída',st.completed>=1]];
const acts=Delta.read(Delta.KEY.activities,[]).slice(0,8);document.getElementById('history').innerHTML=acts.length?acts.map(a=>'<div class="item"><strong>'+String(a.title||'Atividade Delta').replace(/[<>&]/g,'')+'</strong><br><small>'+String(a.date||'')+' • '+(a.type||'atividade')+(a.status?' • '+a.status:'')+'</small></div>').join(''):'<div class="item"><strong>Ainda não há histórico</strong><br><small>Use uma melhoria e registre o resultado para começar.</small></div>';document.getElementById('ach').innerHTML=ach.map(a=>'<div class="item '+(a[2]?'':'lock')+'">'+a[0]+' <strong>'+a[1]+'</strong><br><small>'+(a[2]?'Conquistada':'Bloqueada')+'</small></div>').join('');
</script><script>(function(){try{var s=Delta.stats(),e=document.getElementById('metricasDelta');if(e)e.innerHTML='📊 '+s.results+' resultados • '+s.resolutionRate+'% resolvidos • '+s.completed+' concluídos • '+s.projects+' projetos';}catch(e){}})();</script></body></html>
