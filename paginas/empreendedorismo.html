<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empreendedorismo | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js?v=20260814"></script><main><h1>🚀 Empreendedorismo</h1><p>Prompts para transformar ideias em negócios, validar oportunidades e crescer com mais estratégia.</p><section class="card"><h2>💡 Como usar</h2><p>Escolha o desafio atual do negócio, copie o prompt e substitua os campos entre colchetes pelas suas informações reais.</p></section><div id="lista-prompts"></div></main><script>const prompts=[['💡 Validar uma ideia de negócio','Analise esta ideia de negócio: [IDEIA]. Público: [PÚBLICO]. Região ou mercado: [MERCADO]. Avalie problema resolvido, demanda provável, concorrência, diferenciais, riscos, formas baratas de validação e próximos 5 passos. Separe fatos de hipóteses.'],['🎯 Encontrar público-alvo','Meu negócio é [NEGÓCIO]. Ajude a definir os públicos com maior potencial. Para cada perfil, mostre necessidades, dores, desejos, objeções, onde encontrá-lo e mensagem mais adequada.'],['🧪 Criar teste de mercado','Crie um teste simples e barato para validar [PRODUTO/SERVIÇO] antes de investir muito. Defina hipótese, oferta mínima, canal, público, prazo, métricas e critérios para continuar, ajustar ou abandonar.'],['💎 Criar proposta de valor','Crie uma proposta de valor clara para [NEGÓCIO]. Público: [PÚBLICO]. Problema: [PROBLEMA]. Diferenciais reais: [DIFERENCIAIS]. Gere uma versão curta e uma completa sem inventar promessas.'],['🗺️ Plano de negócio enxuto','Monte um plano de negócio enxuto para [IDEIA]. Inclua cliente, problema, solução, canais, receitas, custos, recursos, parceiros, riscos, validação e plano de 30 dias.'],['🔍 Analisar concorrentes','Analise os concorrentes de [NEGÓCIO/MERCADO] com base nestas informações: [DADOS]. Compare posicionamento, oferta, preço, comunicação, pontos fortes e oportunidades de diferenciação. Não invente dados ausentes.'],['📈 Plano de crescimento','Meu negócio está nesta fase: [FASE]. Faturamento ou volume atual: [DADOS]. Objetivo: [OBJETIVO]. Crie um plano de crescimento de 90 dias com prioridades, ações, métricas e riscos.'],['🧠 Diagnóstico do negócio','Faça um diagnóstico estratégico do meu negócio: [DESCRIÇÃO]. Analise produto, público, vendas, marketing, atendimento, operação e finanças. Mostre o que manter, corrigir e priorizar.'],['🤝 Criar parcerias estratégicas','Meu negócio é [NEGÓCIO]. Sugira tipos de parceiros que possam gerar valor mútuo. Para cada parceria, explique benefício para ambos, abordagem inicial e formato de colaboração.'],['⚠️ Pré-mortem do negócio','Imagine que meu projeto [PROJETO] fracassou daqui a 12 meses. Liste as causas mais prováveis, sinais de alerta e ações preventivas que posso tomar agora.']];const lista=document.getElementById('lista-prompts');lista.innerHTML=prompts.map((p,i)=>`<article class="card"><h2>${p[0]}</h2><pre class="prompt-text">${p[1]}</pre><button onclick="navigator.clipboard.writeText(prompts[${i}][1]);this.textContent='✓ Copiado';setTimeout(()=>this.textContent='📋 Copiar',1200)">📋 Copiar</button></article>`).join('');</script></body></html>
