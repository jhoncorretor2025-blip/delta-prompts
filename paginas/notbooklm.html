<!DOCTYPE html><html lang='pt-br'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>NotebookLM | Delta Prompts</title><link rel='stylesheet' href='/delta-prompts/style.css'><link rel='stylesheet' href='/delta-prompts/css/melhoriaspaginas.css'><style>.top-bar{margin:20px 0}.top-bar input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd}.filtro-nivel{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}.filtro-nivel button{padding:10px 16px;border:none;border-radius:20px;background:#fff;border:1px solid #ddd;cursor:pointer}.grid-prompts{display:flex;flex-direction:column;gap:20px}pre{white-space:pre-wrap;background:#f7f7f7;padding:15px;border-radius:10px;border:1px solid #eee}.header-box{margin-bottom:25px}</style></head><body><div id='menu'></div><script src='/delta-prompts/menu-loader.js'></script><main><div class='header-box'><h1>📊 Prompts para NotebookLM</h1><p>Colete insights, organize conhecimento e transforme notebooks em ações práticas.</p></div><section class='card'><h3>🎯 Objetivo</h3><p>Prompts para estudar, revisar, organizar e transformar conteúdos extensos em conhecimento útil.</p></section><div class='top-bar'><input id='busca' placeholder='🔎 Buscar prompt...' onkeyup='renderizar()'></div><div class='filtro-nivel'><button onclick="filtrarNivel('todos')">Todos</button><button onclick="filtrarNivel('basico')">🟢 Básico</button><button onclick="filtrarNivel('intermediario')">🟡 Intermediário</button><button onclick="filtrarNivel('avancado')">🔴 Avançado</button></div><div id='lista-prompts' class='grid-prompts'></div></main><script>const prompts=[{nivel:'basico',titulo:'Extração de Ideias Principais',quando:'Quando precisar resumir notebooks grandes',prompt:'Liste as 10 ideias mais importantes deste notebook e explique cada uma de forma simples.'},{nivel:'intermediario',titulo:'Encontrar Contradições',quando:'Quando revisar conteúdos extensos',prompt:'Analise todo o conteúdo e identifique informações contraditórias, inconsistências ou pontos que precisam ser revisados.'},{nivel:'basico',titulo:'Professor Particular',quando:'Quando precisar aprender rapidamente',prompt:'Explique este conteúdo como se eu fosse iniciante, usando exemplos práticos e linguagem simples.'},{nivel:'intermediario',titulo:'Plano de Ação',quando:'Quando quiser executar conhecimento',prompt:'Transforme este conteúdo em um plano de ação prático, organizado por etapas e prioridades.'},{nivel:'basico',titulo:'Organização Inteligente',quando:'Quando organizar materiais',prompt:'Organize todo o material em categorias, subtítulos e tópicos para facilitar o estudo e consulta futura.'},{nivel:'intermediario',titulo:'Criar Perguntas',quando:'Quando estudar ou revisar',prompt:'Gere 20 perguntas e respostas baseadas neste notebook para testar meu conhecimento.'},{nivel:'avancado',titulo:'Aplicação Prática',quando:'Quando transformar teoria em prática',prompt:'Analise este conteúdo e me mostre 5 formas práticas de aplicar isso na vida real ou no trabalho.'}];let nivelAtual='todos';function filtrarNivel(n){nivelAtual=n;renderizar()}function renderizar(){const lista=document.getElementById('lista-prompts');lista.innerHTML='';const busca=document.getElementById('busca').value.toLowerCase();prompts.forEach(p=>{const texto=(p.titulo+p.prompt+p.quando).toLowerCase();if(busca&&!texto.includes(busca))return;if(nivelAtual!='todos'&&p.nivel!=nivelAtual)return;const card=document.createElement('section');card.className='card';card.innerHTML=`<div class='nivel nivel-${p.nivel}'>${p.nivel}</div><h3>${p.titulo}</h3><p><strong>📌 Quando usar:</strong> ${p.quando}</p><pre>${p.prompt}</pre><div class='acoes'><button onclick='copiar(this)'>📋 Copiar</button></div>`;lista.appendChild(card)})}function copiar(btn){navigator.clipboard.writeText(btn.closest('.card').querySelector('pre').innerText);alert('Prompt copiado!')}renderizar();</script></body></html>
