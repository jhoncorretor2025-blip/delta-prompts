<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Vendas & Conversão | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/melhoriaspaginas.css">

<style>

pre{
white-space: pre-wrap;
font-size:14px;
background:#f9fafb;
padding:15px;
border-radius:10px;
border:1px solid #e5e7eb;
margin-bottom:15px;
}

#busca{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ddd;
margin-bottom:20px;
}

select{
padding:12px;
border-radius:10px;
border:1px solid #ddd;
margin-bottom:25px;
}

</style>

</head>

<body>

<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js"></script>

<main>

<h1>💰 Vendas & Conversão</h1>

<p>
Prompts focados em aumentar conversões, melhorar argumentos comerciais
e acelerar resultados em vendas.
</p>

<section class="card">
<h3>Objetivo</h3>
<p>
Use estes prompts para criar scripts, quebrar objeções,
melhorar propostas e aumentar taxas de fechamento.
</p>
</section>

<input
id="busca"
placeholder="Buscar prompt..."
onkeyup="renderizar()"
>

<select id="filtroNivel" onchange="renderizar()">

<option value="todos">Todos níveis</option>
<option value="basico">Básico</option>
<option value="intermediario">Intermediário</option>
<option value="avancado">Avançado</option>

</select>

<div id="lista-prompts"></div>

<script src="/delta-prompts/funcoes.js"></script>

<script>

const ordemCategorias = [
"Vendas",
"Conversão",
"Copy",
"Objeções"
];

const prompts = [

{
categoria:"Vendas",
nivel:"basico",
titulo:"Script simples de vendas",
quando:"Primeiro contato",
prompt:`Crie um script de vendas curto para apresentar [produto/serviço], gerar interesse e incentivar o próximo passo.`
},

{
categoria:"Conversão",
nivel:"basico",
titulo:"Melhorar CTA",
quando:"Landing pages",
prompt:`Reescreva esta chamada para ação deixando mais persuasiva e orientada para conversão: [colar CTA].`
},

{
categoria:"Objeções",
nivel:"intermediario",
titulo:"Quebra de objeções",
quando:"Cliente hesitando",
prompt:`Liste as principais objeções para [produto] e crie respostas estratégicas para reduzir resistência.`
},

{
categoria:"Copy",
nivel:"intermediario",
titulo:"Copy persuasiva",
quando:"Campanhas",
prompt:`Crie uma copy focada em dores, desejos e urgência para vender [produto].`
},

{
categoria:"Vendas",
nivel:"intermediario",
titulo:"Diagnóstico comercial",
quando:"Baixa conversão",
prompt:`Analise meu processo comercial e identifique gargalos que reduzem fechamento.`
},

{
categoria:"Conversão",
nivel:"avancado",
titulo:"Otimização de funil",
quando:"Escalar vendas",
prompt:`Monte um funil completo para aumentar conversão em cada etapa usando gatilhos estratégicos.`
},

{
categoria:"Objeções",
nivel:"avancado",
titulo:"Negociação avançada",
quando:"Fechamento difícil",
prompt:`Simule objeções difíceis e gere respostas consultivas para maximizar fechamento.`
},

{
categoria:"Copy",
nivel:"avancado",
titulo:"Oferta irresistível",
quando:"Lançamentos",
prompt:`Crie uma oferta com percepção alta de valor, bônus, urgência e escassez para [produto].`
},

{
categoria:"Conversão",
nivel:"intermediario",
titulo:"Melhorar página de vendas",
quando:"Baixa taxa",
prompt:`Analise uma página de vendas e proponha melhorias focadas em conversão.`
},

{
categoria:"Vendas",
nivel:"basico",
titulo:"Follow-up inteligente",
quando:"Leads frios",
prompt:`Crie 5 mensagens de follow-up para recuperar leads sem parecer insistente.`
}

];

function renderizar(){

const lista = document.getElementById("lista-prompts");

const busca =
document.getElementById("busca")
.value
.toLowerCase();

const nivel =
document.getElementById("filtroNivel")
.value;

lista.innerHTML = "";

prompts.forEach((p,index)=>{

const texto =
(p.titulo + p.prompt + p.categoria)
.toLowerCase();

const buscaOk =
texto.includes(busca);

const nivelOk =
nivel === "todos" ||
p.nivel === nivel;

if(!buscaOk || !nivelOk) return;

const card =
document.createElement("div");

card.className = "card";

card.setAttribute(
"data-nivel",
p.nivel
);

card.innerHTML = `

<div class="nivel nivel-${p.nivel}">
${p.nivel.toUpperCase()}
</div>

<h3>${p.titulo}</h3>

<p><strong>Categoria:</strong> ${p.categoria}</p>

<p><strong>Quando usar:</strong> ${p.quando}</p>

<pre class="prompt-text">${p.prompt}</pre>

<div class="acoes">

<button class="btn-copy" onclick="copiar(this)">
📋 Copiar
</button>

<button class="btn-favorito" onclick="favoritar(this)">
☆ Favoritar
</button>

<button onclick="chat(this)">
🤖 ChatGPT
</button>

<button onclick="gemini(this)">
✨ Gemini
</button>

</div>

`;

lista.appendChild(card);

});

}

renderizar();

</script>

</main>

</body>
</html>
