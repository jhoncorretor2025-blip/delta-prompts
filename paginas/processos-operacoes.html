<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Processos & Operações | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js?v=20260815"></script><main><h1>🔧 Processos & Operações</h1><p>Prompts para organizar rotinas, padronizar tarefas e reduzir retrabalho.</p><section class="card"><h2>🎯 Objetivo</h2><p>Transformar conhecimento informal em processos claros, simples e fáceis de melhorar.</p></section><div id="lista-prompts"></div></main><script>const prompts=[['🗺️ Mapear um processo','Mapeie este processo: [DESCREVA]. Identifique início, entradas, etapas, decisões, responsáveis, ferramentas, saídas e exceções. Aponte informações que faltam.'],['✂️ Simplificar um processo','Analise este processo: [ETAPAS]. Identifique atividades que podem ser eliminadas, combinadas, automatizadas ou reorganizadas sem comprometer qualidade e controle.'],['📋 Criar procedimento padrão','Transforme esta rotina [ROTINA] em um procedimento operacional padrão com objetivo, responsável, pré-requisitos, passo a passo, exceções e checklist final.'],['✅ Criar checklist','Crie um checklist operacional para [TAREFA]. Organize por antes, durante e depois. Inclua pontos críticos e critérios claros de conclusão.'],['🔄 Melhorar passagem entre setores','Analise esta passagem de trabalho entre [SETOR A] e [SETOR B]: [PROCESSO]. Identifique falhas de comunicação, informações obrigatórias e responsabilidades.'],['🤖 Encontrar automações','Analise estas tarefas repetitivas: [LISTA]. Identifique o que pode ser automatizado, o benefício, risco, ferramenta necessária e o que deve continuar com revisão humana.'],['🚨 Plano para falhas operacionais','Crie um plano de resposta para esta falha recorrente: [PROBLEMA]. Inclua contenção imediata, investigação da causa, correção, prevenção e acompanhamento.'],['⏱️ Reduzir tempo de execução','Processo atual: [DESCRIÇÃO]. Tempo médio: [TEMPO]. Analise gargalos e proponha mudanças para reduzir tempo sem sacrificar qualidade.'],['📊 Indicadores operacionais','Defina indicadores para acompanhar [PROCESSO]. Para cada indicador explique fórmula, fonte dos dados, frequência, meta e ação quando sair do esperado.'],['🧠 Análise de causa raiz','Problema: [PROBLEMA]. Evidências: [DADOS]. Conduza uma análise de causa raiz usando 5 Porquês e outras hipóteses, diferenciando causa comprovada de suposição.']];document.getElementById('lista-prompts').innerHTML=prompts.map((p,i)=>`<article class="card"><h2>${p[0]}</h2><pre class="prompt-text">${p[1]}</pre><button onclick="navigator.clipboard.writeText(prompts[${i}][1])">📋 Copiar</button></article>`).join('');</script></body></html>
