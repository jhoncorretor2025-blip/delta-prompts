<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp Profissional | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js?v=20260730"></script><main><h1>📲 WhatsApp Profissional</h1><p>Prompts para atendimento, vendas e relacionamento com clientes de forma humana e profissional.</p><section class="card"><h2>💡 Como usar</h2><p>Informe o contexto real da conversa e escolha o tom desejado. Revise nomes, valores e condições antes de enviar.</p></section><div id="lista-prompts"></div></main><script>const prompts=[['👋 Primeira resposta ao cliente','Crie uma resposta de WhatsApp para este primeiro contato: [MENSAGEM DO CLIENTE]. Meu negócio: [NEGÓCIO]. Objetivo: entender a necessidade e conduzir para o próximo passo. Tom: humano, profissional e curto.'],['🔎 Qualificar um cliente','Crie uma sequência curta de perguntas para qualificar um cliente interessado em [PRODUTO/SERVIÇO], sem transformar a conversa em interrogatório.'],['⏳ Cliente parou de responder','Crie 4 opções de follow-up para um cliente que não respondeu após [CONTEXTO]. Varie entre lembrete gentil, ajuda, informação útil e encerramento respeitoso.'],['💰 Responder pedido de desconto','Cliente disse: [MENSAGEM]. Crie uma resposta que reconheça a preocupação com preço, investigue a objeção e apresente valor sem pressionar nem inventar vantagens.'],['📅 Confirmar agendamento','Crie uma mensagem curta para confirmar [AGENDAMENTO] em [DATA/HORA], incluindo informações essenciais e forma simples de remarcar.'],['😠 Responder cliente insatisfeito','Responda esta reclamação: [MENSAGEM]. Demonstre escuta, reconheça o problema sem admitir fatos não confirmados, explique o próximo passo e mantenha tom profissional.'],['📢 Criar mensagem de oferta','Crie uma mensagem de WhatsApp para divulgar [OFERTA] a [PÚBLICO]. Use linguagem curta, benefício real e CTA claro. Não invente urgência ou escassez.'],['🤝 Pós-venda','Crie uma mensagem de pós-venda para [PRODUTO/SERVIÇO], perguntando sobre a experiência e oferecendo ajuda sem pedir avaliação de forma forçada.'],['🧹 Melhorar mensagem antes de enviar','Melhore esta mensagem de WhatsApp: [TEXTO]. Corrija português, deixe mais clara, natural e profissional, preservando minha intenção e sem ficar formal demais.'],['📚 Criar respostas rápidas','Crie 10 respostas rápidas para WhatsApp Business de [TIPO DE NEGÓCIO], cobrindo saudação, horário, preço, prazo, localização, pagamento, agendamento, dúvidas, follow-up e encerramento.']];document.getElementById('lista-prompts').innerHTML=prompts.map((p,i)=>`<article class="card"><h2>${p[0]}</h2><pre class="prompt-text">${p[1]}</pre><button onclick="navigator.clipboard.writeText(prompts[${i}][1])">📋 Copiar</button></article>`).join('');</script></body></html>
