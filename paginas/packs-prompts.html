{t:'4. WhatsApp',p:'Crie uma mensagem curta de WhatsApp para apresentar este imóvel a um cliente interessado, com linguagem humana e convite para visita.',en:'Create a short WhatsApp message to present this property to an interested client, with human language and an invitation to visit.'}

{t:'2. Criar prompt',p:'Com base no conceito, escreva um prompt detalhado para geração de imagem, priorizando composição, iluminação, realismo e coerência visual.',en:'Based on the concept, write a detailed prompt for image generation, prioritizing composition, lighting, realism, and visual coherence.'},
{t:'3. Melhorar resultado',p:'Analise o resultado descrito a seguir e reescreva o prompt corrigindo os problemas: [DESCREVA O RESULTADO E O QUE NÃO GOSTOU].',en:'Analyze the result described below and rewrite the prompt fixing the issues: [DESCRIBE THE RESULT AND WHAT YOU DID NOT LIKE].'}

{t:'1. Descarregar',p:'Vou enviar tudo que está na minha cabeça. Apenas organize os itens por assunto e não crie tarefas novas: [CONTEÚDO].',en:'I will send everything that is on my mind. Just organize the items by subject and do not create new tasks: [CONTENT].'},
{t:'2. Priorizar',p:'Classifique os itens em: urgente, importante, pode esperar e pode eliminar. Explique brevemente os casos duvidosos.',en:'Classify the items into: urgent, important, can wait, and can eliminate. Briefly explain the doubtful cases.'},

]},

{t:'2. Escolher oportunidades',p:'Com base nas minhas respostas, identifique as 5 melhores oportunidades de uso de IA, ordenadas da mais fácil para a mais avançada.',en:'Based on my answers, identify the 5 best AI usage opportunities, ordered from easiest to most advanced.'},
{t:'3. Plano prático',p:'Crie um plano de 7 dias para eu testar essas aplicações de IA sem precisar saber programação.',en:'Create a 7-day plan for me to test these AI applications without needing to know how to code.'}
]},

]},
{categoria:'Marketing',nivel:'intermediario',titulo:'🛒 Pack Vendas Completo',descricao:'Do perfil do cliente até fechar a venda.',passos:[

{t:'2. Abordagem inicial',p:'Crie 3 formas diferentes de abordar esse cliente pela primeira vez (WhatsApp, ligação e presencial), sem parecer forçado ou insistente.',en:'Create 3 different ways to approach this customer for the first time (WhatsApp, phone call, and in-person), without sounding forced or pushy.'},
{t:'3. Responder objeções',p:'Liste as objeções mais prováveis para [PRODUTO/SERVIÇO] e crie uma resposta natural e honesta para cada uma, sem pressão excessiva.',en:'List the most likely objections for [PRODUCT/SERVICE] and create a natural, honest response for each, without excessive pressure.'},
{t:'4. Fechar venda',p:'Crie uma sequência de mensagens para conduzir esse cliente até a decisão final, incluindo um follow-up caso ele não responda.',en:'Create a sequence of messages to guide this customer toward the final decision, including a follow-up in case they do not respond.'}
]}
];

const packs=dadosBrutos.map((p,i)=>{
  const obj={id:'pack-'+i,categoria:p.categoria,nivel:p.nivel,titulo:p.titulo,descricao:p.descricao,novo:i>=6};
  obj.passos=p.passos.map((s,j)=>{
    const placeholders=[...new Set((s.p.match(/\[([^\]]+)\]/g)||[]).map(x=>x.slice(1,-1)))];
    return{id:'pack-'+i+'-passo-'+j,titulo:s.t,prompt:s.p,promptEn:s.en,placeholders};
  });
  return obj;
});

const idiomaAtivo={};
let categoriaAtual='todos';

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function nivelLabel(n){return n==='avancado'?'🔴 Avançado':n==='intermediario'?'🟡 Intermediário':'🟢 Básico'}
function mostrarToast(texto){const t=document.getElementById('toast');if(!t)return;t.textContent=texto;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}

function _loadFav(){try{return JSON.parse(localStorage.getItem('deltaFavoritos'))||[]}catch(e){return[]}}
function _saveFav(l){try{localStorage.setItem('deltaFavoritos',JSON.stringify(l))}catch(e){}}
function isFav(id){return _loadFav().some(f=>f.id===id)}
function textoBase(passo){return idiomaAtivo[passo.id]==='en'?(passo.promptEn||passo.prompt):passo.prompt}
function textoFinalPasso(passo){let t=textoBase(passo);(passo.placeholders||[]).forEach((ph,idx)=>{const el=document.getElementById('campo-'+passo.id+'-'+idx);const val=el?el.value.trim():'';if(val){const re=new RegExp('\\['+ph.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]','g');t=t.replace(re,val)}});return t}
function textoCompletoPack(p){return p.passos.map(s=>s.titulo+'\n'+textoFinalPasso(s)).join('\n\n')}
function atualizarBtnFav(pack,btn){if(!btn)return;if(isFav(pack.id)){btn.textContent='❤️ Favoritado';btn.classList.add('is-fav')}else{btn.textContent='🤍 Favoritar';btn.classList.remove('is-fav')}}
function favoritar(id,btn){const pack=packs.find(p=>p.id===id);if(!pack)return;let l=_loadFav();const idx=l.findIndex(f=>f.id===id);if(idx===-1){l.unshift({id,titulo:pack.titulo,texto:textoCompletoPack(pack),categoria:'Packs Prontos',createdAt:Date.now()});_saveFav(l);mostrarToast('💖 Pack adicionado aos favoritos!')}else{l.splice(idx,1);_saveFav(l);mostrarToast('🤍 Removido dos favoritos')}atualizarBtnFav(pack,btn);atualizarStats();window.dispatchEvent(new CustomEvent('delta:favoritos-updated'))}

function _loadUsos(){try{return JSON.parse(localStorage.getItem('deltaPacksUsos'))||{}}catch(e){return{}}}
function _saveUsos(o){try{localStorage.setItem('deltaPacksUsos',JSON.stringify(o))}catch(e){}}
function registrarUso(id){const usos=_loadUsos();usos[id]=(usos[id]||0)+1;_saveUsos(usos)}

function _loadFeedback(){try{return JSON.parse(localStorage.getItem('deltaPacksFeedback'))||{}}catch(e){return{}}}
function _saveFeedback(o){try{localStorage.setItem('deltaPacksFeedback',JSON.stringify(o))}catch(e){}}
function darFeedback(id,tipo){
  const fb=_loadFeedback();const atual=fb[id]&&fb[id].voto;if(!fb[id])fb[id]={voto:null};
  const g=window.deltaAuth;
  if(atual===tipo){fb[id].voto=null;if(g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,tipo,-1)}
  else{if(atual&&g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,atual,-1);fb[id].voto=tipo;if(g&&g.registrarFeedbackGlobal)g.registrarFeedbackGlobal(id,tipo,1)}
  _saveFeedback(fb);atualizarFeedbackUI(id);
  mostrarToast(tipo==='up'?'👍 Obrigado pelo feedback!':'👎 Obrigado, vamos melhorar esse!');
}
function atualizarFeedbackUI(id){
  const fb=_loadFeedback()[id]||{voto:null};
  const up=document.getElementById('fbup-'+id),down=document.getElementById('fbdown-'+id);
  if(up)up.classList.toggle('marcado',fb.voto==='up');
  if(down)down.classList.toggle('marcado',fb.voto==='down');
  const g=window.deltaAuth;
  if(g&&g.obterFeedbackGlobal){g.obterFeedbackGlobal(id).then(r=>{if(up)up.textContent='👍 '+(r.up||0);if(down)down.textContent='👎 '+(r.down||0)})}
}

function alternarIdioma(id){
  const passo=packs.flatMap(p=>p.passos).find(s=>s.id===id);if(!passo)return;
  idiomaAtivo[id]=idiomaAtivo[id]==='en'?'pt':'en';
  const pre=document.getElementById('prompt-'+id),btn=document.getElementById('idioma-'+id);
  if(pre)pre.textContent=textoFinalPasso(passo);
  if(btn){btn.textContent=idiomaAtivo[id]==='en'?'🇧🇷 PT':'🌐 EN';btn.classList.toggle('ativo-en',idiomaAtivo[id]==='en')}
}

async function copiarPasso(id){
  const passo=packs.flatMap(p=>p.passos).find(s=>s.id===id);if(!passo)return;
  registrarUso(id);
  try{await navigator.clipboard.writeText(textoFinalPasso(passo));mostrarToast('📋 Passo copiado!')}catch(e){mostrarToast('Não foi possível copiar')}
}
async function abrirPasso(id,url){
  const passo=packs.flatMap(p=>p.passos).find(s=>s.id===id);if(!passo)return;
  registrarUso(id);
  try{await navigator.clipboard.writeText(textoFinalPasso(passo))}catch(e){}
  mostrarToast('✓ Copiado! Abrindo...');setTimeout(()=>window.open(url,'_blank'),300);
}
async function copiarPackCompleto(id){
  const pack=packs.find(p=>p.id===id);if(!pack)return;
  try{await navigator.clipboard.writeText(textoCompletoPack(pack));mostrarToast('📋 Pack completo copiado!')}catch(e){mostrarToast('Não foi possível copiar')}
}
function compartilhar(id){
  const pack=packs.find(p=>p.id===id);if(!pack)return;
  const url=location.origin+location.pathname+'#'+pack.id;
  const texto='📦 '+pack.titulo+'\n\nConfira esse pack de prompts no Delta Prompts:\n'+url;
  if(navigator.share){navigator.share({title:pack.titulo,text:texto,url:url}).catch(()=>{})}
  else{navigator.clipboard.writeText(texto).then(()=>mostrarToast('🔗 Link copiado! Cole onde quiser compartilhar.'))}
}

function exportarTodos(){
  const linhas=packs.map(p=>p.titulo+' ('+p.categoria+')\n'+p.descricao+'\n\n'+p.passos.map(s=>s.titulo+'\n'+s.prompt).join('\n\n')+'\n\n'+'─'.repeat(40));
  const conteudo='📦 PACKS DE PROMPTS — DELTA PROMPTS\n\n'+linhas.join('\n\n');
  const blob=new Blob([conteudo],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='delta-prompts-packs.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  mostrarToast('📥 Arquivo baixado!');
}
function toggleSugerir(){const box=document.getElementById('sugerirBox');box.style.display=(box.style.display==='none'||!box.style.display)?'block':'none'}
function copiarSugestao(){const texto=document.getElementById('sugestaoTexto').value.trim();if(!texto){mostrarToast('Escreva sua ideia antes de copiar 🙂');return}navigator.clipboard.writeText('💡 Sugestão de pack para o Delta Prompts:\n\n'+texto).then(()=>mostrarToast('📋 Sugestão copiada! Envie pra gente 💌'))}

function atualizarStats(){const favs=_loadFav().filter(f=>f.categoria==='Packs Prontos').length;document.getElementById('statsBar').innerHTML='⭐ Você já favoritou <strong>'+favs+'</strong> pack'+(favs===1?'':'s')+' · 📦 <strong>'+packs.length+'</strong> packs disponíveis'}
function aplicarTema(t){document.documentElement.setAttribute('data-theme',t);const btn=document.getElementById('themeToggle');if(btn)btn.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('deltaTheme',t)}catch(e){}}

function montarFiltroCategoria(){
  const cont=document.getElementById('filtrosCategoria');
  const categorias=[...new Set(packs.map(p=>p.categoria))];
  cont.innerHTML='<button class="'+(categoriaAtual==='todos'?'ativo':'')+'" data-categoria="todos">Todos <span class="count-badge">'+packs.length+'</span></button>'+
    categorias.map(c=>{const n=packs.filter(p=>p.categoria===c).length;return `<button class="${categoriaAtual===c?'ativo':''}" data-categoria="${c}">${c} <span class="count-badge">${n}</span></button>`}).join('');
  cont.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{categoriaAtual=b.dataset.categoria;montarFiltroCategoria();render()}));
}

function render(){
  const termo=norm(document.getElementById('busca').value);
  const filtrados=packs.filter(p=>{
    const texto=norm([p.titulo,p.descricao,p.categoria,p.passos.map(s=>s.titulo+' '+s.prompt).join(' ')].join(' '));
    return(!termo||texto.includes(termo))&&(categoriaAtual==='todos'||p.categoria===categoriaAtual);
  });
  document.getElementById('contador').textContent=filtrados.length+' de '+packs.length+' packs';
  const lista=document.getElementById('lista');
  lista.innerHTML=filtrados.length?filtrados.map(p=>`
    <section class="card pack" id="card-${p.id}">
      <span class="tag">${p.categoria}</span><span class="nivel nivel-${p.nivel}">${nivelLabel(p.nivel)}</span>
      <h2>${p.titulo}</h2>
      <p>${p.descricao}</p>
      ${p.passos.map(s=>`
        <div class="item">
          <strong>${s.titulo}</strong>
          ${s.placeholders.length?`<div class="campos-preenchimento">${s.placeholders.map((ph,idx)=>`<label class="campo-label">✏️ ${ph}<input type="text" id="campo-${s.id}-${idx}" placeholder="Preencha antes de copiar (opcional)"></label>`).join('')}</div>`:''}
          <div class="prompt-text" id="prompt-${s.id}">${s.prompt}</div>
          <div class="acoes-item">
            <button data-acao="copiar-passo" data-id="${s.id}">📋 Copiar este passo</button>
            <button data-acao="chat-passo" data-id="${s.id}">🤖 ChatGPT</button>
            <button data-acao="gemini-passo" data-id="${s.id}">✨ Gemini</button>
            <button id="idioma-${s.id}" data-acao="idioma-passo" data-id="${s.id}">🌐 EN</button>
          </div>
        </div>`).join('')}
      <div class="acoes">
        <button data-acao="copiar-pack" data-id="${p.id}">📋 Copiar Pack Completo</button>
        <button class="favoritar" data-acao="favoritar" data-id="${p.id}">🤍 Favoritar</button>
        <button class="compartilhar" data-acao="compartilhar" data-id="${p.id}">🔗 Compartilhar</button>
      </div>
      <div class="feedback-row"><span style="font-size:12px;color:#8a92a6">Esse pack te ajudou?</span><button id="fbup-${p.id}" data-acao="fbup" data-id="${p.id}">👍 0</button><button id="fbdown-${p.id}" data-acao="fbdown" data-id="${p.id}">👎 0</button></div>
    </section>`).join('') : '<div style="text-align:center;padding:30px;opacity:.7">🔎 Nenhum pack encontrado.</div>';

  filtrados.forEach(p=>{atualizarBtnFav(p,document.querySelector('#card-'+p.id+' .favoritar'));atualizarFeedbackUI(p.id)});
}

document.getElementById('lista').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-acao]');
  if(!btn)return;
  const acao=btn.dataset.acao,id=btn.dataset.id;
  if(acao==='copiar-passo')copiarPasso(id);
  else if(acao==='chat-passo')abrirPasso(id,'https://chatgpt.com/');
  else if(acao==='gemini-passo')abrirPasso(id,'https://gemini.google.com/app');
  else if(acao==='idioma-passo')alternarIdioma(id);
  else if(acao==='copiar-pack')copiarPackCompleto(id);
  else if(acao==='favoritar')favoritar(id,btn);
  else if(acao==='compartilhar')compartilhar(id);
  else if(acao==='fbup')darFeedback(id,'up');
  else if(acao==='fbdown')darFeedback(id,'down');
});

document.getElementById('busca').addEventListener('input',render);
document.getElementById('btnExportar').addEventListener('click',exportarTodos);
document.getElementById('btnSugerir').addEventListener('click',toggleSugerir);
document.getElementById('btnCopiarSugestao').addEventListener('click',copiarSugestao);
document.getElementById('themeToggle').addEventListener('click',()=>{const atual=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';aplicarTema(atual)});

aplicarTema((function(){try{return localStorage.getItem('deltaTheme')||'light'}catch(e){return'light'}})());
montarFiltroCategoria();
atualizarStats();
render();
window.addEventListener('delta:favoritos-updated',atualizarStats);
if(window.deltaLoadAuth){window.deltaLoadAuth().then(()=>{document.querySelectorAll('[id^="fbup-"]').forEach(b=>atualizarFeedbackUI(b.id.replace('fbup-','')))})}
</script></body></html>
