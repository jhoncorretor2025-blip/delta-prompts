<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packs de Prompts | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"><style>.intro{padding:22px;background:linear-gradient(135deg,#fff7ed,#fff);border-radius:18px;margin-bottom:24px}.pack{border-left:5px solid #7a5bff}.prompt-text{white-space:pre-wrap;background:#f8fafc;padding:13px;border-radius:10px;margin:10px 0}.item{margin-top:18px}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{font-size:12px;font-weight:800;background:#fff7ed;padding:5px 9px;border-radius:999px}</style></head><body class="category-page"><div id="menu"></div><script src="/delta-prompts/menu-loader.js?v=20260804"></script><main><h1>📦 Packs de Prompts Prontos</h1><div class="intro"><h3>Um objetivo, vários prompts em sequência</h3><p>Os packs reúnem prompts que funcionam juntos. Você pode usar apenas um ou seguir o kit completo do começo ao fim.</p></div><div id="lista"></div></main><script>
const packs=[
{titulo:'📚 Pack Estudo Inteligente',categoria:'Estudo',descricao:'Para aprender um assunto novo do zero.',prompts:[['1. Entender','Explique [ASSUNTO] para um iniciante usando uma explicação simples, uma analogia cotidiana e um exemplo prático.'],['2. Organizar','Crie um mapa dos 20% de [ASSUNTO] que me darão 80% da compreensão prática. Organize em ordem de aprendizado.'],['3. Praticar','Crie 5 exercícios progressivos sobre [ASSUNTO]. Comece fácil e aumente a dificuldade. Não mostre as respostas até eu tentar.'],['4. Revisar','Faça 10 perguntas curtas para revisar [ASSUNTO], focando nos pontos mais importantes e nos erros mais comuns.']]},
{titulo:'🏠 Pack Corretor de Imóveis',categoria:'Profissional',descricao:'Do imóvel bruto ao anúncio e atendimento.',prompts:[['1. Organizar imóvel','Organize estes dados do imóvel sem inventar informações: [DADOS]. Separe características, localização, diferenciais, valores e informações que ainda faltam.'],['2. Criar anúncio','Com base nestes dados, crie um anúncio imobiliário persuasivo, claro e natural. Destaque os diferenciais reais e finalize com chamada para contato.'],['3. Marketplace','Adapte o anúncio para Facebook Marketplace com título chamativo, descrição objetiva e informações essenciais. Não invente dados.'],['4. WhatsApp','Crie uma mensagem curta de WhatsApp para apresentar este imóvel a um cliente interessado, com linguagem humana e convite para visita.']]},
{titulo:'🎨 Pack Criador de Imagens',categoria:'Criatividade',descricao:'Para transformar uma ideia em um prompt visual melhor.',prompts:[['1. Definir conceito','Transforme esta ideia de imagem em um conceito visual claro: [IDEIA]. Defina personagem, cenário, iluminação, enquadramento, clima e estilo.'],['2. Criar prompt','Com base no conceito, escreva um prompt detalhado para geração de imagem, priorizando composição, iluminação, realismo e coerência visual.'],['3. Melhorar resultado','Analise o resultado descrito a seguir e reescreva o prompt corrigindo os problemas: [DESCREVA O RESULTADO E O QUE NÃO GOSTOU].']]},
{titulo:'📱 Pack Redes Sociais',categoria:'Marketing',descricao:'Para transformar uma ideia em conteúdo completo.',prompts:[['1. Ideias','Gere 10 ideias de conteúdo sobre [TEMA] para [PÚBLICO]. Priorize ideias úteis, específicas e fáceis de produzir.'],['2. Post','Crie um post sobre [IDEIA] com gancho forte, desenvolvimento claro e chamada para ação natural.'],['3. Stories','Transforme o conteúdo em uma sequência de 5 stories curtos que gerem curiosidade e interação.'],['4. Reaproveitar','Reaproveite este conteúdo em 3 formatos diferentes sem apenas repetir as mesmas frases.']]},
{titulo:'🧠 Pack Organização Pessoal',categoria:'Pessoal',descricao:'Para sair da confusão e chegar a um plano simples.',prompts:[['1. Descarregar','Vou enviar tudo que está na minha cabeça. Apenas organize os itens por assunto e não crie tarefas novas: [CONTEÚDO].'],['2. Priorizar','Classifique os itens em: urgente, importante, pode esperar e pode eliminar. Explique brevemente os casos duvidosos.'],['3. Próximo passo','Transforme as prioridades em próximos passos pequenos e executáveis. Mostre apenas o que devo fazer primeiro.']]},
{titulo:'🤖 Pack Começando com IA',categoria:'IA',descricao:'Para quem quer descobrir como usar IA no próprio dia a dia.',prompts:[['1. Mapear rotina','Faça 10 perguntas sobre minha rotina para descobrir onde a inteligência artificial pode me economizar tempo ou melhorar resultados. Faça uma pergunta por vez.'],['2. Escolher oportunidades','Com base nas minhas respostas, identifique as 5 melhores oportunidades de uso de IA, ordenadas da mais fácil para a mais avançada.'],['3. Plano prático','Crie um plano de 7 dias para eu testar essas aplicações de IA sem precisar saber programação.']]}
];function copiar(t){navigator.clipboard.writeText(t);alert('Pack copiado!')}function render(){lista.innerHTML=packs.map(p=>{const completo=p.prompts.map(x=>x[0]+'\n'+x[1]).join('\n\n');return `<section class="card pack"><span class="tag">${p.categoria}</span><h2>${p.titulo}</h2><p>${p.descricao}</p>${p.prompts.map(x=>`<div class="item"><strong>${x[0]}</strong><div class="prompt-text">${x[1]}</div></div>`).join('')}<div class="acoes"><button onclick='copiar(${JSON.stringify(completo)})'>📋 Copiar Pack Completo</button><button onclick='navigator.clipboard.writeText(${JSON.stringify(completo)});window.open("https://chatgpt.com/","_blank")'>🤖 Usar no ChatGPT</button></div></section>`}).join('')}render();</script></body></html>
