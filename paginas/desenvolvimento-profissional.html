<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desenvolvimento Profissional | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js"></script><main><h1>📈 Desenvolvimento Profissional</h1><p>Prompts para evoluir competências, desempenho, posicionamento e crescimento no trabalho.</p><section class="card"><h2>💡 Como usar</h2><p>Descreva sua função, objetivo e contexto. Quanto mais exemplos reais você fornecer, mais útil será o plano.</p></section><div id="lista-prompts"></div></main><script>const prompts=[['🎯 Plano de desenvolvimento individual','Minha função é [FUNÇÃO]. Quero evoluir em [OBJETIVO]. Pontos fortes: [PONTOS]. Dificuldades: [DIFICULDADES]. Crie um PDI de 90 dias com competências, ações práticas e indicadores.'],['🧠 Identificar competências que faltam','Para alcançar [OBJETIVO PROFISSIONAL], analise quais competências técnicas e comportamentais preciso desenvolver. Classifique por prioridade e sugira formas práticas de aprender.'],['📣 Pedir feedback ao gestor','Crie uma forma profissional de pedir feedback ao meu gestor sobre [TEMA], com perguntas específicas que gerem respostas úteis.'],['🔍 Analisar feedback recebido','Recebi este feedback: [FEEDBACK]. Ajude a separar fatos, interpretações e ações práticas. Crie um plano de melhoria sem assumir que toda crítica está correta.'],['🗣️ Preparar conversa de crescimento','Prepare uma conversa com meu gestor sobre crescimento profissional. Contexto: [CONTEXTO]. Resultados: [RESULTADOS]. Objetivo: [OBJETIVO]. Estruture argumentos e perguntas.'],['📊 Demonstrar resultados','Transforme estas atividades e resultados [LISTA] em uma apresentação profissional de impacto, destacando contribuição, evidências e aprendizados sem exagerar.'],['⏱️ Melhorar produtividade no trabalho','Minha rotina profissional é [ROTINA]. Principais dificuldades: [DIFICULDADES]. Analise prioridades, interrupções e tarefas repetitivas e proponha uma rotina mais eficiente.'],['🤝 Melhorar relacionamento profissional','Situação: [CONTEXTO]. Quero melhorar minha relação profissional com [PESSOA/EQUIPE]. Sugira abordagens de comunicação, limites e ações concretas.'],['🚀 Preparar para uma promoção','Quero me preparar para [CARGO/RESPONSABILIDADE]. Compare minha situação atual [DESCRIÇÃO] com as exigências prováveis e crie um plano para demonstrar prontidão.'],['📚 Plano de aprendizado profissional','Quero aprender [COMPETÊNCIA] para aplicar em [TRABALHO]. Crie um plano de estudo prático de [PERÍODO], com exercícios, projetos e critérios para medir evolução.']];document.getElementById('lista-prompts').innerHTML=prompts.map((p,i)=>`<article class="card"><h2>${p[0]}</h2><pre class="prompt-text">${p[1]}</pre><button onclick="navigator.clipboard.writeText(prompts[${i}][1])">📋 Copiar</button></article>`).join('');</script></body></html>
