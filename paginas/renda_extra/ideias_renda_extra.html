<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>💰 Ideias de Renda Extra | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/delta-prompts/style.css">
<link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css">
</head>

<body>

<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js"></script>

<main>

<h1>💰🚀 Ideias Estratégicas de Renda Extra com IA</h1>

<p>
Prompts profissionais para criar, validar e escalar fontes de renda extra com estratégia e inteligência.
</p>

<section class="card">
<h3>🎯 Objetivo</h3>
<p>
Ajudar você a transformar ideias em fontes reais de renda, com estrutura, análise e visão de crescimento.
</p>
</section>

<!-- BUSCA -->
<div class="top-bar">
<input type="text" id="busca" placeholder="🔎 Buscar modelo..." oninput="filtrarPrompts()">
<div class="contador" id="contador"></div>
</div>

<!-- FILTRO NÍVEL -->
<div class="filtro-nivel" style="margin-bottom:20px;">
<button onclick="filtrarNivel(event,'todos')" class="ativo">Todos</button>
<button onclick="filtrarNivel(event,'basico')">🟢 Básico</button>
<button onclick="filtrarNivel(event,'intermediario')">🟡 Intermediário</button>
<button onclick="filtrarNivel(event,'avancado')">🔴 Avançado</button>
</div>

<div id="lista-prompts"></div>

</main>

<script>

const prompts = [

/* ===============================
   2 BÁSICOS PRIMEIRO
=================================*/

{
nivel:"basico",
titulo:"💡 Ideias rápidas para começar hoje",
quando:"Quando quiser sugestões simples e práticas.",
prompt:`💡 Liste 15 ideias de renda extra que possam ser iniciadas imediatamente com pouco investimento.

Inclua:
• 🛠️ Tipo de atividade
• 💰 Como monetizar
• ⏳ Tempo médio para começar`
},

{
nivel:"basico",
titulo:"🌐 Renda extra usando internet",
quando:"Quando quiser ganhar dinheiro online.",
prompt:`🌐 Liste 10 formas realistas de ganhar dinheiro online usando habilidades simples.

Explique:
• 🧠 Habilidade necessária
• 💵 Forma de pagamento
• 📈 Potencial de crescimento`
},

/* ===============================
   6 COMPLETOS
=================================*/

{
nivel:"intermediario",
titulo:"📈 Plano estruturado de renda extra",
quando:"Para transformar habilidade em renda.",
prompt:`Você é especialista em empreendedorismo.

Crie um plano detalhado para transformar a habilidade [INSIRA HABILIDADE] em renda extra.

Estruture:

🎯 Público-alvo  
💰 Modelo de monetização  
📣 Estratégia de divulgação  
🛠️ Passo a passo inicial  
📊 Estimativa de ganhos`
},

{
nivel:"intermediario",
titulo:"🔎 Validação estratégica da ideia",
quando:"Antes de investir tempo ou dinheiro.",
prompt:`Analise a seguinte ideia de renda extra:

[DESCREVA A IDEIA]

Avalie:

📊 Demanda de mercado  
⚔️ Concorrência  
✨ Diferencial competitivo  
⚠️ Riscos  
💵 Potencial de lucro`
},

{
nivel:"intermediario",
titulo:"📢 Estratégia de divulgação orgânica",
quando:"Para crescer sem investir em anúncios.",
prompt:`Crie uma estratégia de divulgação orgânica para promover:

[IDEIA DE RENDA EXTRA]

Inclua:

📱 Redes sociais ideais  
📝 Tipo de conteúdo  
📅 Frequência de postagem  
🧠 Estratégia de autoridade`
},

{
nivel:"avancado",
titulo:"🚀 Escalar renda extra para negócio",
quando:"Quando quiser crescer e escalar.",
prompt:`Você é especialista em crescimento empresarial.

Mostre como transformar a seguinte renda extra em um negócio escalável:

[IDEIA]

Inclua:

🤖 Automação  
👥 Delegação  
🔁 Modelo recorrente  
📈 Estratégia de crescimento`
},

{
nivel:"avancado",
titulo:"🤖 Renda extra com Inteligência Artificial",
quando:"Para usar IA estrategicamente.",
prompt:`Crie 5 modelos de renda extra usando Inteligência Artificial.

Explique:

⚙️ Como funciona  
🛠️ Ferramentas necessárias  
💰 Modelo de monetização  
📊 Potencial de ganho`
},

{
nivel:"avancado",
titulo:"💰 Plano financeiro estratégico",
quando:"Para organizar ganhos e reinvestimento.",
prompt:`Crie um plano financeiro estratégico para organizar e reinvestir lucros de uma renda extra.

Inclua:

🏦 Separação de capital  
📈 Reinvestimento  
🛡️ Reserva financeira  
🚀 Crescimento progressivo`
}

];

const lista = document.getElementById("lista-prompts");
const contador = document.getElementById("contador");
const busca = document.getElementById("busca");

function renderizar(arr){
lista.innerHTML="";
contador.innerText=`Total: ${arr.length} modelo${arr.length!==1?"s":""}`;

arr.forEach(p=>{

const card=document.createElement("div");
card.className="card";
card.dataset.nivel=p.nivel;

card.innerHTML=`
<div class="nivel nivel-${p.nivel}">
${p.nivel==="avancado"?"🔴 Avançado":
p.nivel==="intermediario"?"🟡 Intermediário":"🟢 Básico"}
</div>

<h3>${p.titulo}</h3>
<p><strong>📌 Quando usar:</strong> ${p.quando}</p>
<pre>${p.prompt}</pre>

<div class="acoes">
<button onclick="copiarPrompt(\`${p.prompt}\`)">📋 Copiar</button>
<button onclick="favoritarPrompt('${p.titulo}',\`${p.prompt}\`)">⭐ Favoritar</button>
<button onclick="abrirChatGPT(\`${p.prompt}\`)">💬 ChatGPT</button>
<button onclick="abrirGemini(\`${p.prompt}\`)">🔷 Gemini</button>
</div>
`;

lista.appendChild(card);

});
}

function filtrarPrompts(){
const termo=busca.value.toLowerCase();
const filtrados=prompts.filter(p=>
p.titulo.toLowerCase().includes(termo)||
p.prompt.toLowerCase().includes(termo)
);
renderizar(filtrados);
}

function filtrarNivel(event,nivel){
document.querySelectorAll(".filtro-nivel button")
.forEach(btn=>btn.classList.remove("ativo"));
event.target.classList.add("ativo");

const cards=document.querySelectorAll("#lista-prompts .card");

cards.forEach(card=>{
if(nivel==="todos"){
card.style.display="block";
}else{
card.style.display=
card.dataset.nivel===nivel?"block":"none";
}
});
}

function copiarPrompt(texto){
navigator.clipboard.writeText(texto);
alert("📋 Prompt copiado!");
}

function favoritarPrompt(titulo,conteudo){
const promptsSalvos=JSON.parse(localStorage.getItem("deltaPrompts"))||[];

promptsSalvos.push({
id:Date.now(),
titulo,
categoria:"Renda Extra",
conteudo,
favorito:true
});

localStorage.setItem("deltaPrompts",JSON.stringify(promptsSalvos));
alert("⭐ Adicionado aos favoritos!");
}

function abrirChatGPT(texto){
const url="https://chat.openai.com/?prompt="+encodeURIComponent(texto);
window.open(url,"_blank");
}

function abrirGemini(texto){
const url="https://gemini.google.com/app?prompt="+encodeURIComponent(texto);
window.open(url,"_blank");
}

renderizar(prompts);

</script>

</body>
</html>
