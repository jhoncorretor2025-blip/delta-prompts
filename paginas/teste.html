<h1>🏠 Prompts para Imobiliária</h1>

<p>Prompts estratégicos para corretores, imobiliárias e marketing imobiliário venderem mais usando IA.</p>

<section class="card">
<h2>🎯 Objetivo</h2>
<p>Gerar anúncios, descrições, scripts de venda, qualificação de clientes e estratégias imobiliárias com inteligência artificial.</p>
</section>

<input type="text" id="busca" placeholder="Buscar prompt..." oninput="renderizar()" />

<select id="filtro-nivel" onchange="renderizar()">
<option value="">Todos os níveis</option>
<option value="basico">Básico</option>
<option value="intermediario">Intermediário</option>
<option value="avancado">Avançado</option>
</select>

<div id="lista-prompts"></div>

<script>
const prompts = [

{
categoria: "Anúncios",
nivel: "basico",
titulo: "Descrição de Imóvel para Venda",
quando: "Quando precisar criar anúncio atrativo rapidamente",
prompt: `
Crie uma descrição persuasiva para vender o seguinte imóvel:

Tipo:
Localização:
Quantidade de quartos:
Diferenciais:
Valor:

Use linguagem emocional, destaque benefícios e finalize com chamada para ação.
`
},

{
categoria: "Anúncios",
nivel: "intermediario",
titulo: "Anúncio Magnético para Portais",
quando: "Quando quiser se destacar no Zap, OLX ou VivaReal",
prompt: `
Crie um anúncio altamente persuasivo para portal imobiliário.

Use:
• Título chamativo
• Gatilhos mentais
• Benefícios antes das características
• Chamada para ação forte

Dados do imóvel:
[Inserir informações]
`
},

{
categoria: "Captação",
nivel: "intermediario",
titulo: "Mensagem para Captar Imóvel",
quando: "Quando quiser convencer proprietário a anunciar com você",
prompt: `
Crie uma mensagem estratégica para convencer um proprietário a anunciar o imóvel comigo.

Inclua:
• Autoridade
• Prova social
• Diferencial competitivo
• Benefícios da parceria
`
},

{
categoria: "Atendimento",
nivel: "basico",
titulo: "Resposta Automática para Leads",
quando: "Quando receber contato pelo WhatsApp",
prompt: `
Crie uma resposta automática profissional para lead interessado em imóvel.

Objetivo:
• Gerar conexão
• Entender necessidade
• Avançar para visita
`
},

{
categoria: "Vendas",
nivel: "avancado",
titulo: "Script de Fechamento Imobiliário",
quando: "Quando o cliente está indeciso",
prompt: `
Crie um script estratégico de fechamento para cliente indeciso.

Inclua:
• Quebra de objeções
• Reforço de valor
• Escassez
• Próximo passo claro
`
}

];

const ordemCategorias = [
"Anúncios",
"Captação",
"Atendimento",
"Vendas"
];

function renderizar() {
const lista = document.getElementById("lista-prompts");
const busca = document.getElementById("busca").value.toLowerCase();
const nivelSelecionado = document.getElementById("filtro-nivel").value;

lista.innerHTML = "";

ordemCategorias.forEach(cat => {

const categoriaPrompts = prompts.filter(p => 
p.categoria === cat &&
(p.titulo.toLowerCase().includes(busca) ||
p.prompt.toLowerCase().includes(busca)) &&
(nivelSelecionado === "" || p.nivel === nivelSelecionado)
);

if(categoriaPrompts.length > 0){

const tituloCategoria = document.createElement("h2");
tituloCategoria.textContent = cat;
lista.appendChild(tituloCategoria);

categoriaPrompts.forEach((p, index) => {

const card = document.createElement("section");
card.className = "card";
card.setAttribute("data-nivel", p.nivel);

card.innerHTML = `
<div class="nivel nivel-${p.nivel}">
<strong>${p.titulo}</strong>
<span>Quando usar: ${p.quando}</span>
</div>

<pre>${p.prompt}</pre>

<div class="acoes">
<button onclick="copiarPrompt(\`${p.prompt}\`)">Copiar</button>
<button onclick="favoritarPrompt(${index})">Favoritar</button>
<button onclick="usarChatGPT(\`${p.prompt}\`)">ChatGPT</button>
<button onclick="usarGemini(\`${p.prompt}\`)">Gemini</button>
</div>
`;

lista.appendChild(card);

});

}

});

}

function copiarPrompt(texto){
navigator.clipboard.writeText(texto);
alert("Prompt copiado!");
}

function favoritarPrompt(index){
alert("Adicionado aos favoritos!");
}

function usarChatGPT(prompt){
window.open("https://chat.openai.com/?prompt=" + encodeURIComponent(prompt));
}

function usarGemini(prompt){
window.open("https://gemini.google.com/app?prompt=" + encodeURIComponent(prompt));
}

renderizar();
</script>
