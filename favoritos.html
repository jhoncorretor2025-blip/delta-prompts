<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favoritos | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"><style>.main-content{max-width:1150px;margin:auto;padding:30px 20px}.hero{padding:22px;border:1px solid #e0e7ff;border-radius:20px;background:linear-gradient(135deg,#f5f3ff,#eef2ff);margin-bottom:20px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.header h1{margin:0 0 6px}.header p{margin:0;color:#667085}.count{white-space:nowrap;padding:7px 12px;border-radius:999px;background:#fff;color:#4f46e5;font-weight:800}.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.stat{padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.75);font-size:13px;font-weight:700}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 12px}.tools input{flex:1;min-width:220px;padding:13px;border:1px solid #e5e7eb;border-radius:12px}.clear-all{border:1px solid #fecdd3;background:#fff1f2;color:#be123c;padding:10px 13px;border-radius:11px;font-weight:800;cursor:pointer}.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px}.filters button{white-space:nowrap;border:1px solid #e5e7eb;background:#fff;padding:8px 12px;border-radius:999px;font-weight:800;cursor:pointer}.filters .active{background:#5b5ce2;color:#fff}.group{margin:0 0 30px}.group h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.card{display:flex;flex-direction:column;background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.tag{align-self:flex-start;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-size:11px;font-weight:900}.card h3{margin:12px 0 8px}.preview{white-space:pre-wrap;background:#f8fafc;border:1px solid #edf0f5;border-radius:11px;padding:13px;color:#475467;max-height:92px;overflow:hidden;flex:1;line-height:1.5}.preview.open{max-height:none}.see-more{border:0;background:transparent;color:#4f46e5;font-weight:800;text-align:left;padding:8px 0 0;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1 1 100px;border:0;padding:10px;border-radius:10px;font-weight:800;cursor:pointer}.copy{background:#5b5ce2;color:#fff}.remove{background:#fff1f2;color:#be123c}.colecoes-box{margin:0 0 16px}.colecoes-titulo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.colecoes-titulo h2{font-size:15px;margin:0;color:#344055}.btn-nova-colecao{border:0;background:#eef2ff;color:#4f46e5;padding:7px 12px;border-radius:999px;font-weight:800;font-size:12.5px;cursor:pointer}.colecoes-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}.colecao-chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid #e5e7eb;background:#fff;padding:8px 12px;border-radius:999px;font-weight:800;cursor:pointer;font-size:13px}.colecao-chip.active{background:#4f46e5;color:#fff;border-color:#4f46e5}.colecao-chip .mini-acao{opacity:.6;font-size:11px;padding:0 2px}.colecao-chip .mini-acao:hover{opacity:1}.select-colecao{margin-top:8px;width:100%;padding:8px 10px;border-radius:9px;border:1px solid #e5e7eb;font-size:12.5px;font-family:inherit;background:#fff;color:#475467}
.empty{text-align:center;padding:55px 20px;background:#fff;border:2px dashed #e5e7eb;border-radius:16px;color:#667085}.empty strong{display:block;color:#344054;font-size:18px;margin-bottom:7px}.pagination{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;margin:28px 0}.pagination button{border:1px solid #e5e7eb;background:#fff;padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.pagination button.active{background:#5b5ce2;color:#fff;border-color:#5b5ce2}.pagination button:disabled{opacity:.4;cursor:not-allowed}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);display:none;background:#202236;color:#fff;padding:11px 18px;border-radius:11px;z-index:3000}@media(max-width:600px){.main-content{padding:20px 14px}.header{flex-direction:column}.hero{padding:18px}.tools{margin-top:16px}.tools input,.clear-all{width:100%}.grid{grid-template-columns:1fr}.actions button{flex:1 1 42%}}</style></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js?v=20260829"></script><main class="main-content"><section class="hero"><header class="header"><div><h1>❤️ Meus Favoritos</h1><p>Seus melhores prompts reunidos em um só lugar para encontrar e reutilizar rapidamente.</p></div><div class="count" id="contador">0 favoritos</div></header><div class="stats"><span class="stat" id="statCategorias">📁 0 categorias</span><span class="stat">📄 10 por página</span></div></section><div class="tools"><input id="busca" type="search" placeholder="🔎 Buscar por título, conteúdo ou categoria..."><button class="clear-all" id="limparTudo" type="button">🗑️ Limpar favoritos</button></div><div class="colecoes-box"><div class="colecoes-titulo"><h2>🗂️ Coleções</h2><button type="button" class="btn-nova-colecao" id="btnNovaColecao">+ Nova coleção</button></div><div class="colecoes-chips" id="colecoesChips"></div></div>
<div class="filters" id="filters"></div><div id="conteudo"></div><nav class="pagination" id="pagination"></nav></main><div id="toast">📋 Prompt copiado!</div><script>const conteudo=document.getElementById('conteudo'),contador=document.getElementById('contador'),busca=document.getElementById('busca'),filters=document.getElementById('filters'),pagination=document.getElementById('pagination'),statCategorias=document.getElementById('statCategorias'),limparTudo=document.getElementById('limparTudo');let categoria='Todos',pagina=1,colecaoAtiva='Todas';const POR_PAGINA=10;function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function favs(){try{return window.getFavoritos?window.getFavoritos():JSON.parse(localStorage.getItem('deltaFavoritos')||'[]')}catch(e){return[]}}function categorias(){return['Todos',...new Set(favs().map(x=>x.categoria||'Geral'))]}
function lerColecoesExtras(){try{return JSON.parse(localStorage.getItem('deltaColecoesFavoritos'))||[]}catch(e){return[]}}
function salvarColecoesExtras(l){try{localStorage.setItem('deltaColecoesFavoritos',JSON.stringify(l))}catch(e){}}
function todasColecoes(){const doFavs=[...new Set(favs().map(x=>x.colecao).filter(Boolean))];const extras=lerColecoesExtras();return[...new Set([...doFavs,...extras])].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function salvarFavs(lista){window.saveFavoritos?window.saveFavoritos(lista):localStorage.setItem('deltaFavoritos',JSON.stringify(lista));window.dispatchEvent(new CustomEvent('delta:favoritos-updated'))}
function moverParaColecao(id,nomeColecao){const lista=favs().map(x=>String(x.id)===id?{...x,colecao:nomeColecao||null}:x);salvarFavs(lista);renderColecoesChips();render()}
function criarColecao(){const nome=prompt('Nome da nova coleção:');if(!nome||!nome.trim())return;const nomeLimpo=nome.trim();if(todasColecoes().includes(nomeLimpo)){mostrarToast('Essa coleção já existe');return}const extras=lerColecoesExtras();extras.push(nomeLimpo);salvarColecoesExtras(extras);renderColecoesChips();render();mostrarToast('🗂️ Coleção criada! Use o menu embaixo de cada prompt pra mover ele pra lá.')}
function renomearColecao(nomeAntigo){const novoNome=prompt('Novo nome para "'+nomeAntigo+'":',nomeAntigo);if(!novoNome||!novoNome.trim()||novoNome.trim()===nomeAntigo)return;const nomeLimpo=novoNome.trim();const lista=favs().map(x=>x.colecao===nomeAntigo?{...x,colecao:nomeLimpo}:x);salvarFavs(lista);const extras=lerColecoesExtras().map(c=>c===nomeAntigo?nomeLimpo:c);salvarColecoesExtras(extras);if(colecaoAtiva===nomeAntigo)colecaoAtiva=nomeLimpo;renderColecoesChips();render()}
function excluirColecao(nome){if(!confirm('Excluir a coleção "'+nome+'"? Os prompts continuam nos favoritos, só saem dessa coleção.'))return;const lista=favs().map(x=>x.colecao===nome?{...x,colecao:null}:x);salvarFavs(lista);const extras=lerColecoesExtras().filter(c=>c!==nome);salvarColecoesExtras(extras);if(colecaoAtiva===nome)colecaoAtiva='Todas';renderColecoesChips();render()}
function renderColecoesChips(){const box=document.getElementById('colecoesChips');const cols=todasColecoes();const chips=[{nome:'Todas',fixo:true},{nome:'Sem coleção',fixo:true},...cols.map(c=>({nome:c,fixo:false}))];box.innerHTML=chips.map(c=>`<span class="colecao-chip ${colecaoAtiva===c.nome?'active':''}" data-colecao="${esc(c.nome)}">🗂️ ${esc(c.nome)}${c.fixo?'':` <span class="mini-acao" data-acao-col="renomear" data-colecao-nome="${esc(c.nome)}" title="Renomear">✏️</span><span class="mini-acao" data-acao-col="excluir" data-colecao-nome="${esc(c.nome)}" title="Excluir">🗑️</span>`}</span>`).join('');box.querySelectorAll('.colecao-chip').forEach(chip=>chip.addEventListener('click',e=>{if(e.target.closest('[data-acao-col]'))return;colecaoAtiva=chip.dataset.colecao;pagina=1;renderColecoesChips();render()}));box.querySelectorAll('[data-acao-col]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const nome=b.dataset.colecaoNome;if(b.dataset.acaoCol==='renomear')renomearColecao(nome);else excluirColecao(nome)}))}
function mostrarToast(texto){const toast=document.getElementById('toast');toast.textContent=texto;toast.style.display='block';setTimeout(()=>{toast.style.display='none';toast.textContent='📋 Prompt copiado!'},1800)}
function renderFilters(){const cats=categorias();if(categoria!=='Todos'&&!cats.includes(categoria))categoria='Todos';filters.innerHTML=cats.map(c=>`<button class="${c===categoria?'active':''}" data-cat="${esc(c)}">${c==='Todos'?'✨ Todos':esc(c)}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{categoria=b.dataset.cat;pagina=1;renderFilters();render()})}function filtrados(){const q=busca.value.toLowerCase().trim();return favs().filter(x=>(categoria==='Todos'||(x.categoria||'Geral')===categoria)&&(colecaoAtiva==='Todas'||(colecaoAtiva==='Sem coleção'?!x.colecao:x.colecao===colecaoAtiva))&&((x.titulo||'')+' '+(x.texto||'')+' '+(x.categoria||'')).toLowerCase().includes(q))}function renderPagination(total){const paginas=Math.ceil(total/POR_PAGINA);if(paginas<=1){pagination.innerHTML='';return}if(pagina>paginas)pagina=paginas;let h=`<button data-page="prev" ${pagina===1?'disabled':''}>← Anterior</button>`;for(let i=1;i<=paginas;i++)h+=`<button data-page="${i}" class="${i===pagina?'active':''}">${i}</button>`;h+=`<button data-page="next" ${pagina===paginas?'disabled':''}>Próxima →</button>`;pagination.innerHTML=h;pagination.querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>{pagina=b.dataset.page==='prev'?pagina-1:b.dataset.page==='next'?pagina+1:Number(b.dataset.page);render();document.querySelector('.tools').scrollIntoView({behavior:'smooth',block:'start'})})}function render(){const todos=favs(),f=filtrados(),inicio=(pagina-1)*POR_PAGINA,visiveis=f.slice(inicio,inicio+POR_PAGINA),numCats=new Set(todos.map(x=>x.categoria||'Geral')).size;contador.textContent=todos.length+' '+(todos.length===1?'favorito':'favoritos');statCategorias.textContent='📁 '+numCats+' '+(numCats===1?'categoria':'categorias');limparTudo.style.display=todos.length?'':'none';if(!f.length){conteudo.innerHTML='<div class="empty"><strong>❤️ Nenhum favorito encontrado</strong>'+(todos.length?'Tente mudar a busca ou selecionar outra categoria.':'Explore o site e toque no coração dos prompts que você mais gosta.')+'</div>';pagination.innerHTML='';return}const grupos={};visiveis.forEach(x=>(grupos[x.categoria||'Geral']??=[]).push(x));conteudo.innerHTML=Object.entries(grupos).map(([cat,itens])=>`<section class="group"><h2>📁 ${esc(cat)}</h2><div class="grid">${itens.map(x=>`<article class="card"><span class="tag">${esc(cat)}</span><h3>${esc(x.titulo||'Prompt favorito')}</h3><div class="preview" id="p-${esc(x.id)}">${esc(x.texto||'')}</div><button class="see-more" data-acao="ver">📖 Ver prompt completo</button><div class="actions"><button class="copy" data-acao="copiar" data-id="${esc(x.id)}">📋 Copiar</button><button class="remove" data-acao="remover" data-id="${esc(x.id)}">🗑️ Remover</button></div><select class="select-colecao" data-mover-id="${esc(x.id)}"><option value="">📁 Sem coleção</option>${todasColecoes().map(c=>`<option value="${esc(c)}" ${x.colecao===c?"selected":""}>📁 ${esc(c)}</option>`).join("")}</select></article>`).join('')}</div></section>`).join('');renderPagination(f.length)}function toggleTexto(b){const p=b.previousElementSibling;p.classList.toggle('open');b.textContent=p.classList.contains('open')?'📕 Recolher prompt':'📖 Ver prompt completo'}async function copiar(id){const el=document.getElementById('p-'+id);if(!el)return;try{await navigator.clipboard.writeText(el.innerText);const toast=document.getElementById('toast');toast.style.display='block';setTimeout(()=>toast.style.display='none',1500)}catch(e){}}function remover(id){const n=favs().filter(x=>String(x.id)!==id);window.saveFavoritos?window.saveFavoritos(n):localStorage.setItem('deltaFavoritos',JSON.stringify(n));pagina=1;renderFilters();render()}conteudo.addEventListener('click',e=>{const btn=e.target.closest('button[data-acao]');if(!btn)return;const acao=btn.dataset.acao;if(acao==='ver')toggleTexto(btn);else if(acao==='copiar')copiar(btn.dataset.id);else if(acao==='remover')remover(btn.dataset.id)});conteudo.addEventListener('change',e=>{const sel=e.target.closest('.select-colecao');if(!sel)return;moverParaColecao(sel.dataset.moverId,sel.value)});limparTudo.onclick=()=>{if(!favs().length)return;if(confirm('Deseja remover todos os prompts dos favoritos?')){window.saveFavoritos?window.saveFavoritos([]):localStorage.setItem('deltaFavoritos','[]');categoria='Todos';pagina=1;renderFilters();render()}};busca.addEventListener('input',()=>{pagina=1;render()});document.getElementById('btnNovaColecao').addEventListener('click',criarColecao);document.addEventListener('DOMContentLoaded',()=>{renderFilters();renderColecoesChips();render()});window.addEventListener('delta:favoritos-updated',()=>{pagina=1;renderFilters();renderColecoesChips();render()});</script></body></html>
