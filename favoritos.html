<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Favoritos | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/delta-prompts/style.css">

<style>

pre {
  white-space: pre-wrap;
  font-size: 14px;
  background: #f9fafb;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  margin-bottom: 15px;
}

.meta {
  font-size: 13px;
  opacity: 0.7;
  margin-bottom: 8px;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  flex-wrap: wrap;
  gap: 15px;
}

.contador {
  font-size: 14px;
  opacity: 0.75;
}

</style>

</head>

<body>

<div id="menu"></div>
<script src="/delta-prompts/menu-loader.js"></script>

<main>

  <h1>❤️ Prompts Favoritos</h1>
  <p>Aqui ficam todos os prompts que você marcou como favorito.</p>

  <div class="top-bar">
    <div class="contador" id="contador"></div>
  </div>

  <div id="lista"></div>

</main>

<script>

const lista = document.getElementById("lista");
const contador = document.getElementById("contador");

function carregarFavoritos() {

  lista.innerHTML = "";

  const favoritos = JSON.parse(localStorage.getItem("deltaFavoritos")) || [];

  contador.innerText = `Total de favoritos: ${favoritos.length}`;

  if (favoritos.length === 0) {
    lista.innerHTML = `
      <div class="card">
        <p>⚠️ Nenhum prompt favorito ainda.</p>
        <p>Marque ❤️ nas páginas para aparecer aqui.</p>
      </div>
    `;
    return;
  }

  favoritos.forEach(item => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="meta">📂 ${item.categoria || "Sem categoria"}</div>
      <h3>${item.titulo}</h3>
      <pre>${item.texto}</pre>

      <div class="acoes">
        <button onclick="copiarTexto(\`${item.texto}\`)">📋 Copiar</button>
        <button onclick="removerFavorito('${item.id}')">❌ Remover</button>
      </div>
    `;

    lista.appendChild(card);
  });

}

function copiarTexto(texto) {
  navigator.clipboard.writeText(texto);
  alert("📋 Prompt copiado!");
}

function removerFavorito(id) {

  let favoritos = JSON.parse(localStorage.getItem("deltaFavoritos")) || [];

  favoritos = favoritos.filter(f => f.id !== id);

  localStorage.setItem("deltaFavoritos", JSON.stringify(favoritos));

  carregarFavoritos();
}

document.addEventListener("DOMContentLoaded", carregarFavoritos);

</script>

</body>
</html>
