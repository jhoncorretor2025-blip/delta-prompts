<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favoritos | Delta Prompts</title><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"><style>.main-content{max-width:1150px;margin:auto;padding:30px 20px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.header h1{margin-bottom:5px}.header p{margin:0;color:#667085}.count{padding:7px 12px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-weight:800}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 12px}.tools input{flex:1;min-width:220px;padding:13px;border:1px solid #e5e7eb;border-radius:12px}.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px}.filters button{white-space:nowrap;border:1px solid #e5e7eb;background:#fff;padding:8px 12px;border-radius:999px;font-weight:800}.filters .active{background:#5b5ce2;color:#fff}.group{margin:0 0 30px}.group h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.card{display:flex;flex-direction:column;background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:18px}.tag{align-self:flex-start;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-size:11px;font-weight:900}.preview{white-space:pre-wrap;background:#f8fafc;border-radius:11px;padding:13px;color:#475467;max-height:140px;overflow:auto;flex:1}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:0;padding:10px;border-radius:10px;font-weight:800}.copy{background:#5b5ce2;color:#fff}.remove{background:#fff1f2;color:#be123c}.empty{text-align:center;padding:60px 20px;background:#fff;border:2px dashed #e5e7eb;border-radius:16px;color:#667085}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);display:none;background:#202236;color:#fff;padding:11px 18px;border-radius:11px;z-index:3000}@media(max-width:600px){.header{align-items:flex-start}.header p{font-size:14px}}</style></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js"></script><main class="main-content"><header class="header"><div><h1>❤️ Meus Favoritos</h1><p>Encontre seus prompts salvos por coleção.</p></div><div class="count" id="contador">0 itens</div></header><div class="tools"><input id="busca" type="search" placeholder="🔎 Buscar nos favoritos..."></div><div class="filters" id="filters"></div><div id="conteudo"></div></main><div id="toast">📋 Copiado!</div><script>const conteudo=document.getElementById('conteudo'),contador=document.getElementById('contador'),busca=document.getElementById('busca'),filters=document.getElementById('filters');let categoria='Todos';function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function favs(){return window.getFavoritos?window.getFavoritos():JSON.parse(localStorage.getItem('deltaFavoritos')||'[]')}function categorias(){return['Todos',...new Set(favs().map(x=>x.categoria||'Geral'))]}function renderFilters(){filters.innerHTML=categorias().map(c=>`<button class="${c===categoria?'active':''}" onclick="categoria=${JSON.stringify(c)};renderFilters();render()">${esc(c)}</button>`).join('')}function render(){const todos=favs(),q=busca.value.toLowerCase(),f=todos.filter(x=>(categoria==='Todos'||(x.categoria||'Geral')===categoria)&&(x.titulo+' '+x.texto+' '+(x.categoria||'')).toLowerCase().includes(q));contador.textContent=todos.length+' '+(todos.length===1?'item':'itens');if(!f.length){conteudo.innerHTML='<div class="empty">❤️ Nenhum favorito encontrado.<br>Explore o site e toque no coração para guardar seus melhores prompts.</div>';return}const grupos={};f.forEach(x=>(grupos[x.categoria||'Geral']??=[]).push(x));conteudo.innerHTML=Object.entries(grupos).map(([cat,itens])=>`<section class="group"><h2>📁 ${esc(cat)}</h2><div class="grid">${itens.map(x=>`<article class="card"><span class="tag">${esc(cat)}</span><h3>${esc(x.titulo)}</h3><div class="preview" id="p-${esc(x.id)}">${esc(x.texto)}</div><div class="actions"><button class="copy" onclick="copiar(${JSON.stringify(String(x.id))})">📋 Copiar</button><button class="remove" onclick="remover(${JSON.stringify(String(x.id))})">🗑️ Remover</button></div></article>`).join('')}</div></section>`).join('')}async function copiar(id){const t=document.getElementById('p-'+id).innerText;await navigator.clipboard.writeText(t);const toast=document.getElementById('toast');toast.style.display='block';setTimeout(()=>toast.style.display='none',1500)}function remover(id){const n=favs().filter(x=>String(x.id)!==id);window.saveFavoritos?window.saveFavoritos(n):localStorage.setItem('deltaFavoritos',JSON.stringify(n));if(categoria!=='Todos'&&!n.some(x=>(x.categoria||'Geral')===categoria))categoria='Todos';renderFilters();render()}busca.addEventListener('input',render);document.addEventListener('DOMContentLoaded',()=>{renderFilters();render()});window.addEventListener('delta:favoritos-updated',()=>{renderFilters();render()});</script></body></html>
