name: Canivete - Validação e estabilidade

on:
  push:
    branches: [main]
    paths:
      - 'canivete.html'
      - 'canivete/app/canivete.html'
      - 'sw.js'
      - 'menu-loader.js'
      - '.github/workflows/canivete-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar estrutura do Canivete
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [Path('canivete.html'), Path('canivete/app/canivete.html')]

          for p in files:
              s = p.read_text(encoding='utf-8')
              # HTML exportado dentro do JavaScript pode usar <\/script> para escapar
              # o fechamento interno sem encerrar o script principal da página.
              script_open = len(re.findall(r'<script\b[^>]*>', s, flags=re.I))
              script_close = len(re.findall(r'</script>', s, flags=re.I))
              script_escaped_close = len(re.findall(r'<\\/script>', s, flags=re.I))
              assert script_open == script_close + script_escaped_close, f'{p}: tags script desbalanceadas'
              assert s.count('<section') >= 27, f'{p}: poucas sections'
              assert s.count('data-page=') >= 27, f'{p}: poucos itens de menu'
              expected_app_version = '8.27' if p == Path('canivete.html') else '8.22'
              assert f"const APP_VERSION='{expected_app_version}'" in s, f'{p}: APP_VERSION esperada em {expected_app_version}'
              assert 'CANIVETE_V90_MENUS_CORRIGIDOS' in s, f'{p}: menu V90 não encontrado'
              assert 'CANIVETE-V93-MENU-POLIDO' in s, f'{p}: menu V93 ausente'
              assert 'CANIVETE-V92-MOBILE-FIRST' in s, f'{p}: mobile-first V92 não encontrado'
              assert 'CANIVETE-V94-MENU-UNIFICADO' in s, f'{p}: menu unificado V94 ausente'
              assert 'CANIVETE-V95-INTEGRIDADE-E-DESKTOP' in s, f'{p}: V95 ausente'
              assert 'CANIVETE-V96-MAPA-DO-SISTEMA' in s, f'{p}: V96 ausente'
              assert 'CANIVETE-V97-DESKTOP-POLISH' in s, f'{p}: V97 ausente'
              assert 'CANIVETE-V98-UX-HOME' in s, f'{p}: V98 ausente'
              assert 'CANIVETE_SW_UPDATE_V28' in s, f'{p}: atualização do Service Worker não encontrada'
              assert "EXTRAS · VIDA PRÁTICA" in s, f'{p}: grupo Vida Prática ausente'
              assert "EXTRAS · SAÚDE & ROTINA" in s, f'{p}: grupo Saúde & Rotina ausente'
              assert "EXTRAS · ENTRETENIMENTO & FERRAMENTAS" in s, f'{p}: grupo Entretenimento ausente'

          print('Estrutura HTML/JS básica: OK')

      - name: Validar JavaScript embutido
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          for p in [Path('canivete.html'), Path('canivete/app/canivete.html')]:
              s = p.read_text(encoding='utf-8')
              low = s.lower()
              pos = 0
              scripts = []
              while True:
                  start = low.find('<script', pos)
                  if start < 0:
                      break
                  open_end = low.find('>', start)
                  if open_end < 0:
                      raise SystemExit(f'{p}: tag script de abertura incompleta')
                  end = low.find('</script>', open_end + 1)
                  if end < 0:
                      raise SystemExit(f'{p}: tag script sem fechamento')
                  scripts.append(s[open_end + 1:end])
                  pos = end + len('</script>')
              for i, js in enumerate(scripts, 1):
                  if not js.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                      f.write(js)
                      name=f.name
                  result=subprocess.run(['node','--check',name],text=True,capture_output=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f'{p}: erro de sintaxe no script #{i}')
          print('JavaScript embutido: OK')
