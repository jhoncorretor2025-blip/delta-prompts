name: Aplicar limpeza de despesas vazias
on:
  push:
    paths:
      - 'tools/limpar-novas-despesas-v84.py'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar correção
        run: python tools/limpar-novas-despesas-v84.py
      - name: Commit da correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canivete.html
          git diff --cached --quiet || git commit -m 'fix: remover despesas vazias'
          git push
