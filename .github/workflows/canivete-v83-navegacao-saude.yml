name: Canivete v8.3 - Navegação de saúde

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar aba de suplementos
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('canivete.html')
          s=p.read_text(encoding='utf-8')
          if 'CANIVETE-V83-NAVEGACAO-SAUDE' in s:
              raise SystemExit(0)
          s=s.replace("const APP_VERSION='8.2'","const APP_VERSION='8.3'",1)
          patch=r'''
          <!-- CANIVETE-V83-NAVEGACAO-SAUDE -->
          <script>
          (function(){
            function sincronizar(){
              const f=document.getElementById('btnFiltroRemedio_vitamina');
              const t=document.querySelector('.health-tab81[data-health-tab="vitamina"]');
              if(f && t && !f.dataset.sync83){
                f.dataset.sync83='1';
                f.addEventListener('click',function(){setTimeout(()=>t.click(),30)});
              }
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sincronizar);else sincronizar();
            document.addEventListener('click',e=>{if(e.target.closest('[data-page="saude"]'))setTimeout(sincronizar,180)});
          })();
          </script>
          '''
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canivete.html
          git commit -m "CANIVETE-V83-NAVEGACAO-SAUDE: sincronizar suplementos" || exit 0
          git push
