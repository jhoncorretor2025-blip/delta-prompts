name: Validar páginas e regressões

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-paginas:
    name: Sintaxe JavaScript e preservação de prompts
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar scripts e preservar prompts existentes
        run: node scripts/validar-paginas.js
