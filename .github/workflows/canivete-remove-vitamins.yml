name: Atualizar Canivete
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover vitaminas solicitadas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('canivete.html')
          s = p.read_text(encoding='utf-8')
          old = "const listaVitaminasSugeridas=['Creatina','Colágeno','Zinco','NAC (N-acetilcisteína)','Ômega 3','Vitamina D','Complexo B','Magnésio','Melatonina','Cúrcuma (Curcumina)','Coenzima Q10','Vitamina C','Própolis'];"
          new = "const listaVitaminasSugeridas=['Creatina','Colágeno','Zinco','NAC (N-acetilcisteína)','Ômega 3','Vitamina D','Complexo B','Magnésio','Melatonina','Cúrcuma (Curcumina)','Coenzima Q10','Vitamina C','Própolis'];"
          if 'Ashwagandha' in s or 'Moringa' in s or 'Maca Negra' in s:
              s = s.replace("const listaVitaminasSugeridas=['Ashwagandha','Moringa','Maca Negra','Creatina','Colágeno','Zinco','NAC (N-acetilcisteína)','Ômega 3','Vitamina D','Complexo B','Magnésio','Melatonina','Cúrcuma (Curcumina)','Coenzima Q10','Vitamina C','Própolis'];", new)
              s = s.replace("const listaVitaminasSugeridas=['Ashwagandha','Moringa','Maca Negra'];", new)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteração e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canivete.html
          git commit -m "fix: remove Ashwagandha Moringa and Maca Negra from Canivete" || true
          git rm .github/workflows/canivete-remove-vitamins.yml
          git commit -m "chore: remove temporary update workflow"
          git push