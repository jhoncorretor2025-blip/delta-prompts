name: Canivete v8.0 - Corrigir versão visível
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir versão visível
        shell: python
        run: |
          from pathlib import Path
          p=Path('canivete.html')
          s=p.read_text(encoding='utf-8')
          marker='CANIVETE-V80-BADGE-FIX'
          if marker in s:
              raise SystemExit(0)
          s=s.replace('v7.9','v8.0')
          s=s.replace('</body>', '<!-- '+marker+' -->\\n</body>', 1)
          p.write_text(s,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canivete.html
          if git diff --cached --quiet; then echo "Sem alteração"; else git commit -m "Corrige versão visível do Canivete para v8.0"; git push; fi
