name: Canivete - Corrigir resumo Usado hoje
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir resumo Usado hoje
        shell: python
        run: |
          from pathlib import Path
          p=Path('canivete.html')
          s=p.read_text(encoding='utf-8')
          marker='CANIVETE-V86-USADO-HOJE'
          if marker in s:
              raise SystemExit(0)

          patch="""
<!-- CANIVETE-V86-USADO-HOJE -->
<script>
(function(){
  function atualizarResumoUsadosHoje(){
    var usados=Array.from(document.querySelectorAll('button')).filter(function(b){
      return /usado\s+hoje/i.test((b.textContent||'').trim());
    }).length;
    Array.from(document.querySelectorAll('*')).forEach(function(el){
      if(el.children.length===0 && /usadas?\s+hoje/i.test((el.textContent||'').trim())){
        var box=el.parentElement;
        if(!box)return;
        var n=box.querySelector('.metric,.stat b,strong');
        if(n)n.textContent=String(usados);
      }
    });
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');
    if(!b)return;
    if(/marcar\s+que\s+usei\s+hoje|usar\s+hoje|usado\s+hoje/i.test((b.textContent||'').trim())){
      setTimeout(atualizarResumoUsadosHoje,100);
      setTimeout(atualizarResumoUsadosHoje,400);
    }
  },true);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',atualizarResumoUsadosHoje);else atualizarResumoUsadosHoje();
  setTimeout(atualizarResumoUsadosHoje,1200);
})();
</script>
"""
          s=s.replace('</body>',patch+'\n</body>',1)
          s=s.replace("const APP_VERSION='8.3'","const APP_VERSION='8.6'",1)
          s=s.replace("const APP_VERSION='8.4'","const APP_VERSION='8.6'",1)
          s=s.replace("const APP_VERSION='8.5'","const APP_VERSION='8.6'",1)
          s=s.replace('v8.3','v8.6')
          s=s.replace('v8.4','v8.6')
          s=s.replace('v8.5','v8.6')
          p.write_text(s,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canivete.html
          if git diff --cached --quiet; then echo "Sem alteração"; else git commit -m "Canivete v8.6: corrigir contador Usado hoje"; git push; fi
