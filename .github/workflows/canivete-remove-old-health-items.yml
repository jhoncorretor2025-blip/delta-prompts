name: Limpar itens antigos do Canivete
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar migração dos dados antigos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('canivete.html')
          s=p.read_text(encoding='utf-8')
          marker="function _salvarRemedios(l){"
          migration="""function limparItensSaudeAntigos(){
  try{
    const nomesRemover=new Set(['ashwagandha','moringa','maca negra','combo ashwagandha + moringa + maca negra']);
    const lista=_lerRemedios();
    const limpa=lista.filter(r=>!nomesRemover.has(String(r.nome||'').trim().toLowerCase()));
    if(limpa.length!==lista.length)_salvarRemedios(limpa);
  }catch(e){}
}
"""
          if 'function limparItensSaudeAntigos()' not in s:
              s=s.replace(marker,migration+marker,1)
              anchor="renderSenhas();renderContatos();renderDatas();renderLinks();renderListaRemedios();"
              s=s.replace(anchor,"limparItensSaudeAntigos();renderSenhas();renderContatos();renderDatas();renderLinks();renderListaRemedios();",1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commitar e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canivete.html
          git commit -m "fix: remove legacy Ashwagandha Moringa and Maca Negra data" || true
          git rm .github/workflows/canivete-remove-old-health-items.yml
          git commit -m "chore: remove temporary migration workflow"
          git push