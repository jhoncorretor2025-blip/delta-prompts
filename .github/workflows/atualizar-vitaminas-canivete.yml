name: Atualizar vitaminas do Canivete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar lista de vitaminas e suplementos
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('canivete.html')
          text = path.read_text(encoding='utf-8')

          nova = "const listaVitaminasSugeridas=['Vitamina D','Magnésio','Ômega 3','Coenzima Q10','Multivitamínico / Multimineral','Vitamina C','Vitamina K','Complexo B','Probiótico','Zinco'];"
          padrao = r"const listaVitaminasSugeridas=\[[^;]*\];"
          novo_texto, n = re.subn(padrao, nova, text, count=1)

          if n != 1:
              raise SystemExit('Não foi possível localizar a lista de vitaminas.')

          path.write_text(novo_texto, encoding='utf-8')

      - name: Salvar alteração e remover workflow temporário
        shell: bash
        run: |
          git config user.name "Canivete Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canivete.html
          git diff --cached --quiet && echo "Nenhuma alteração necessária." || git commit -m "Atualiza vitaminas e suplementos mais usados"
          rm -f .github/workflows/atualizar-vitaminas-canivete.yml
          git add -u .github/workflows/atualizar-vitaminas-canivete.yml
          git diff --cached --quiet || git commit -m "Remove workflow temporario"
          git push
