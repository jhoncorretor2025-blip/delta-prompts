name: Atualizar Canivete - Analise Financeira

on:
  push:
    paths:
      - '.github/workflows/atualizar-canivete-analise.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Limpar itens antigos de saude
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('canivete.html')
          s = p.read_text(encoding='utf-8')
          marker = "function _salvarRemedios(l){"
          migration = '''function limparItensSaudeAntigos(){
            try{
              const nomesRemover=new Set(['ashwagandha','moringa','maca negra','combo ashwagandha + moringa + maca negra']);
              const lista=_lerRemedios();
              const limpa=lista.filter(r=>!nomesRemover.has(String(r.nome||'').trim().toLowerCase()));
              if(limpa.length!==lista.length)_salvarRemedios(limpa);
            }catch(e){}
          }
          '''
          if 'function limparItensSaudeAntigos()' not in s:
              s=s.replace(marker,migration+marker,1)
              anchor="renderSenhas();renderContatos();renderDatas();renderLinks();renderListaRemedios();"
              if anchor in s:
                  s=s.replace(anchor,"limparItensSaudeAntigos();renderSenhas();renderContatos();renderDatas();renderLinks();renderListaRemedios();",1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Atualizar Canivete
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('canivete.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          .analysis-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}.analysis-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}.analysis-card h3{margin:0 0 7px;font-size:15px}.analysis-big{font-size:28px;font-weight:900;margin:5px 0}.analysis-list{display:grid;gap:9px;margin-top:12px}.analysis-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f5}.analysis-item:last-child{border-bottom:0}.analysis-name{min-width:0}.analysis-name strong{display:block;font-size:13px}.analysis-name small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.analysis-tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;white-space:nowrap}.tag-essential{background:#fef2f2;color:#991b1b}.tag-reducible{background:#ecfdf3;color:#166534}.tag-negotiable{background:#eff6ff;color:#1d4ed8}.tag-planned{background:#f5f3ff;color:#6d28d9}.scenario{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.scenario-box{border:1px solid var(--line);border-radius:12px;padding:13px;background:#f8fafc}.scenario-box strong{display:block;font-size:12px}.scenario-box b{display:block;font-size:21px;margin-top:5px}.analysis-note{background:#eff6ff;border:1px solid #dbeafe;color:#1e40af;border-radius:12px;padding:13px;font-size:13px;line-height:1.5;margin-top:12px}.analysis-warn{background:#fffbeb;border-color:#fde68a;color:#92400e}.analysis-good{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
          @media(max-width:900px){.analysis-grid{grid-template-columns:1fr 1fr}}
          @media(max-width:600px){.analysis-grid{grid-template-columns:1fr}.scenario{grid-template-columns:1fr}.analysis-card{padding:16px}.analysis-big{font-size:25px}}
          '''
          if '.analysis-grid{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          nav_old='<button type="button" data-page="projecoes">📈 Projeções</button>'
          nav_new='<button type="button" data-page="projecoes">📈 Projeções</button><button type="button" data-page="analise">🧠 Análise</button>'
          if 'data-page="analise"' not in s:
              s=s.replace(nav_old,nav_new,1)

          section=r'''
          <section id="analise" class="section"><div class="card hero"><h2>🧠 Análise da sua vida financeira</h2><p class="sub">Entenda o que é essencial, o que pode ser reduzido e o que pode fazer diferença no futuro.</p><div class="notice">💡 Nem toda despesa deve ser cortada. Alimentação, impostos e outras obrigações fazem parte da vida. A análise destaca principalmente aquilo que pode ser ajustado.</div></div><div class="analysis-grid"><div class="analysis-card"><h3>🔴 Gastos difíceis de reduzir</h3><div class="analysis-big" id="aEssential">R$ 0,00</div><small class="small">Essenciais ou obrigatórios</small></div><div class="analysis-card"><h3>🟡 Gastos que podem ser negociados</h3><div class="analysis-big" id="aNegotiable">R$ 0,00</div><small class="small">Podem ter algum espaço para economia</small></div><div class="analysis-card"><h3>🟢 Potencial de economia</h3><div class="analysis-big green" id="aPotential">R$ 0,00</div><small class="small">Estimativa, não uma obrigação de corte</small></div></div><div class="grid two"><div class="card"><h2>🔎 Onde vale olhar primeiro?</h2><div id="analysisItems" class="analysis-list"></div></div><div class="card"><h2>🔮 O que pode acontecer no futuro?</h2><p class="sub">Veja o impacto de pequenas mudanças, sem assumir que você precisa cortar tudo.</p><div class="scenario"><div class="scenario-box"><strong>Hoje</strong><b id="scenarioCurrent">R$ 0,00</b><small class="small">sobra mensal estimada</small></div><div class="scenario-box"><strong>Com economia sugerida</strong><b class="green" id="scenarioBetter">R$ 0,00</b><small class="small">sobra mensal simulada</small></div></div><div class="analysis-note" id="scenarioYear">Em 12 meses, a diferença estimada seria de R$ 0,00.</div><div class="analysis-note analysis-warn">⚠️ A análise é uma orientação. Não significa que você deva deixar de pagar despesas essenciais ou obrigatórias.</div></div></div><div class="card" style="margin-top:16px"><h2>💡 Como interpretar</h2><div id="analysisAdvice" class="notice">Preencha suas despesas para receber uma orientação personalizada.</div></div><div class="step-actions"><span class="step-hint">Análise financeira</span><button class="btn continue" type="button" onclick="showPage('dashboard')">← Voltar ao painel</button></div></section>
          '''
          if '<section id="analise"' not in s:
              marker='<section id="projecoes" class="section">'
              s=s.replace(marker,section+marker,1)

          funcs=r'''
          function classifyExpense(name){let x=String(name||'').toLowerCase();if(/iptu|imposto|taxa|aluguel|financiamento|condom|água|energia|alimenta|saúde|farmácia|licenciamento|seguro|empréstimo/.test(x))return ['essential','Essencial / obrigatório','tag-essential',0];if(/internet|telefone|combust|gasolina|manutenção|educação|curso|cartão|parcelamento/.test(x))return ['negotiable','Pode ser negociado','tag-negotiable',.08];if(/academia|roupas|higiene|lazer|entretenimento|bares|restaurante|besteira|uber|pets|presente|viagem|barbearia|salão|aplicativo|assinatura|netflix|compras|investimento/.test(x))return ['reducible','Pode ser reduzido','tag-reducible',.20];return ['planned','Avaliar','tag-planned',.10]}
          function renderAnalysis(){let c=calc(),essential=0,negotiable=0,potential=0,items=[];d.expenses.forEach(e=>{let v=n(e.value),cl=classifyExpense(e.name);if(!v)return;if(cl[0]==='essential')essential+=v;else if(cl[0]==='negotiable'){negotiable+=v;potential+=v*cl[3]}else if(cl[0]==='reducible'){potential+=v*cl[3]}items.push({...e,v,cl})});items.sort((a,b)=>(b.v*b.cl[3])-(a.v*a.cl[3]));document.getElementById('aEssential').textContent=money(essential);document.getElementById('aNegotiable').textContent=money(negotiable);document.getElementById('aPotential').textContent=money(potential);let top=items.filter(x=>x.cl[3]>0).slice(0,8);document.getElementById('analysisItems').innerHTML=top.length?top.map(x=>`<div class="analysis-item"><div class="analysis-name"><strong>${x.icon||'🧾'} ${safe(x.name)}</strong><small>${money(x.v)}/mês · potencial estimado ${money(x.v*x.cl[3])}/mês</small></div><span class="analysis-tag ${x.cl[2]}">${x.cl[1]}</span></div>`).join(''):'<div class="empty">💡 Informe valores nas despesas para descobrir onde pode existir espaço para economia.</div>';let better=c.net+potential;document.getElementById('scenarioCurrent').textContent=money(c.net);document.getElementById('scenarioBetter').textContent=money(better);document.getElementById('scenarioYear').textContent=`Em 12 meses, uma economia de cerca de ${money(potential)}/mês representaria até ${money(potential*12)} de diferença.`;document.getElementById('analysisAdvice').textContent=potential>0?`Você não precisa cortar tudo. Comece pelas despesas marcadas como “Pode ser reduzido” e “Pode ser negociado”. Uma pequena redução mensal pode aumentar sua sobra e acelerar suas metas.`:'Preencha algumas despesas com valores para que o sistema possa identificar oportunidades de economia.'}
          '''
          if 'function classifyExpense(' not in s:
              s=s.replace('function render(){',funcs+'\nfunction render(){',1)

          s=s.replace('function refresh(){totals();status();projection();renderExpenseSummary()}','function refresh(){totals();status();projection();renderExpenseSummary();renderAnalysis()}')
          if "analise:['Análise" not in s:
              s=s.replace("projecoes:['Projeções','Veja o crescimento estimado.']}","projecoes:['Projeções','Veja o crescimento estimado.'],analise:['Análise financeira','Descubra onde pode economizar e o impacto no futuro.']}",1)

          advanced='<a href="canivete-avancado.html" class="btn light" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">🧠 Visão Avançada</a>'
          if 'canivete-avancado.html' not in s:
              s=s.replace('<div class="actions"><button class="btn light" type="button" onclick="exportData()">⬇️ Exportar</button>', '<div class="actions">'+advanced+'<button class="btn light" type="button" onclick="exportData()">⬇️ Exportar</button>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Publicar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canivete.html
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar acesso à visao avancada e limpeza de itens antigos"
          git push
