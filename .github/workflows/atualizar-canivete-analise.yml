name: Atualizar Canivete - Analise e UX v8.9

on:
  push:
    paths:
      - '.github/workflows/atualizar-canivete-analise.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Aplicar melhorias do Canivete v8.9
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('canivete.html')
          s=p.read_text(encoding='utf-8')

          # 1) Versao
          s=s.replace("const APP_VERSION='8.8'", "const APP_VERSION='8.9'", 1)
          s=s.replace('v8.7</span>', 'v8.9</span>')
          s=s.replace('Canivete v8.7', 'Canivete v8.9')

          # 2) Visual mobile e area de toque das abas de saude
          css=r'''
          /* CANIVETE V8.9 - UX MOBILE */
          .health-tabs81{position:relative!important;z-index:1000!important;pointer-events:auto!important;isolation:isolate}
          .health-tab81{position:relative!important;z-index:1001!important;pointer-events:auto!important;touch-action:manipulation!important;-webkit-tap-highlight-color:rgba(37,99,235,.12);min-height:44px}
          .v89-quick-help{margin:0 0 16px;padding:14px 16px;border:1px solid #dbeafe;background:#eff6ff;color:#1e40af;border-radius:14px;display:flex;align-items:center;gap:12px;line-height:1.45;font-size:13px}
          .v89-quick-help strong{display:block;margin-bottom:2px}
          .v89-advanced-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
          @media(max-width:760px){
            .health-tabs81{margin-left:0!important;margin-right:0!important;top:4px!important}
            .health-tab81{font-size:12px!important;padding:10px 6px!important;min-height:46px!important}
            .v89-quick-help{padding:12px;font-size:12px;align-items:flex-start}
            .v89-advanced-link{width:100%;justify-content:center}
            .bottom-nav{z-index:40!important}
          }
          '''
          if 'CANIVETE V8.9 - UX MOBILE' not in s:
              s=s.replace('</style>',css+'</style>',1)

          # 3) Orientacao simples no inicio do painel
          marker='<section id="dashboard" class="section active">'
          helpbox='<div class="v89-quick-help"><div style="font-size:25px">🧭</div><div><strong>Comece pelo essencial</strong><span>Preencha sua renda e suas despesas primeiro. Depois use Dívidas, Metas, Histórico e Análise para enxergar o futuro do seu dinheiro.</span></div></div>'
          if 'v89-quick-help' not in s and marker in s:
              s=s.replace(marker,marker+helpbox,1)

          # 4) Corrigir as abas no celular usando pointer events e uma troca direta de filtro
          js=r'''
          <script id="CANIVETE_V89_MOBILE_TABS">
          (function(){
            function ativarAba89(tipo){
              document.querySelectorAll('#saude .health-tab81').forEach(function(b){b.classList.toggle('active',b.dataset.healthTab===tipo)});
              if(typeof setFiltroTipoRemedio==='function') setFiltroTipoRemedio(tipo);
              var sv=document.getElementById('sugestoesVitaminas'),sm=document.getElementById('sugestoesMedicamentos'),sc=document.getElementById('sugestoesChas');
              if(sv&&sv.parentElement)sv.parentElement.style.display=tipo==='vitamina'?'block':'none';
              if(sm&&sm.parentElement)sm.parentElement.style.display=tipo==='medicamento'?'block':'none';
              if(sc&&sc.parentElement)sc.parentElement.style.display=tipo==='cha'?'block':'none';
            }
            function preparar(){
              document.querySelectorAll('#saude .health-tab81').forEach(function(tab){
                tab.style.pointerEvents='auto';tab.style.position='relative';tab.style.zIndex='1001';tab.style.touchAction='manipulation';
                if(tab.dataset.v89ok)return;
                tab.dataset.v89ok='1';
                tab.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();ativarAba89(tab.dataset.healthTab)},{passive:false});
                tab.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();ativarAba89(tab.dataset.healthTab)},{passive:false});
              });
            }
            document.addEventListener('pointerdown',function(e){var t=e.target.closest&&e.target.closest('#saude .health-tab81');if(t){t.style.pointerEvents='auto';t.style.zIndex='1001'}},true);
            document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('#saude .health-tab81');if(t)ativarAba89(t.dataset.healthTab)},true);
            var mo=new MutationObserver(preparar);mo.observe(document.body,{subtree:true,childList:true});
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',preparar);else preparar();
          })();
          </script>
          '''
          if 'CANIVETE_V89_MOBILE_TABS' not in s:
              s=s.replace('</body>',js+'</body>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar alteracao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('canivete.html').read_text(encoding='utf-8')
          assert "const APP_VERSION='8.9'" in s
          assert 'CANIVETE_V89_MOBILE_TABS' in s
          assert 'CANIVETE V8.9 - UX MOBILE' in s
          assert s.count('<html')==1 and s.count('</html>')==1
          print('Canivete v8.9 validado com sucesso')
          PY

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canivete.html
          git diff --cached --quiet && exit 0
          git commit -m "Canivete v8.9 - UX mobile e navegacao [skip ci]"
          git push
