name: Auditoria de caminhos internos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-local-links:
    name: Verificar links e recursos locais
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auditar referências HTML e CSS
        run: node .github/scripts/auditar-caminhos-repositorio.js
