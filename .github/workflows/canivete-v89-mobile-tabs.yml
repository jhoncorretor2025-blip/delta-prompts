name: Canivete v8.9 - Corrigir abas de saúde no celular

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir abas de saúde e versão
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('canivete.html')
          s=p.read_text(encoding='utf-8')
          if 'CANIVETE-V89-MOBILE-TABS' in s:
              raise SystemExit(0)

          css='''\n<!-- CANIVETE-V89-MOBILE-TABS -->\n<style id="CANIVETE-V89-MOBILE-TABS">\n@media (max-width:760px){\n  .canivete-health-tabs{position:relative!important;z-index:9999!important;pointer-events:auto!important;isolation:isolate!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important;}\n  .canivete-health-tabs button{position:relative!important;z-index:10000!important;pointer-events:auto!important;touch-action:manipulation!important;min-height:52px!important;-webkit-tap-highlight-color:rgba(37,99,235,.12)!important;}\n  .canivete-health-tabs button *{pointer-events:none!important;}\n}\n</style>\n'''
          js='''\n<!-- CANIVETE-V89-MOBILE-TABS-SCRIPT -->\n<script id="CANIVETE-V89-MOBILE-TABS-SCRIPT">\n(function(){\n  function fixHealthTabs(){\n    var names=['medicamentos','suplementos','consultas','chás','chas'];\n    var buttons=Array.from(document.querySelectorAll('button')).filter(function(b){\n      var t=(b.textContent||'').trim().toLowerCase();\n      return names.indexOf(t)>=0;\n    });\n    if(buttons.length<2)return;\n    var parent=buttons[0].parentElement;\n    if(parent){\n      parent.classList.add('canivete-health-tabs');\n      parent.style.position='relative';\n      parent.style.zIndex='9999';\n      parent.style.pointerEvents='auto';\n    }\n    buttons.forEach(function(b){\n      b.classList.add('canivete-health-tab');\n      b.style.position='relative';\n      b.style.zIndex='10000';\n      b.style.pointerEvents='auto';\n      b.style.touchAction='manipulation';\n    });\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fixHealthTabs);else fixHealthTabs();\n  [300,800,1500].forEach(function(ms){setTimeout(fixHealthTabs,ms);});\n  new MutationObserver(fixHealthTabs).observe(document.documentElement,{childList:true,subtree:true});\n})();\n</script>\n'''
          if '</head>' in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if '</body>' in s:
              s=s.replace('</body>',js+'\n</body>',1)
          s=re.sub(r'v8\\.[0-9]+','v8.9',s)
          s=re.sub(r'(APP_VERSION\\s*=\\s*[\"\\'])8\\.[0-9]+([\"\\'])',r'\\g<1>8.9\\g<2>',s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canivete.html
          git commit -m "CANIVETE v8.9: corrigir abas de saúde no celular" || exit 0
          git push
