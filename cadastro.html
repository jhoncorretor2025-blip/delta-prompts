<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Novo Prompt | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body{background:#f4f6fb;margin:0;font-family:Arial,sans-serif}
.hero{max-width:900px;margin:40px auto;padding:20px}
.top{text-align:center;margin-bottom:25px}
.top h1{font-size:34px;margin-bottom:8px}
.top p{color:#666}
.form-card{background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.field{margin-bottom:18px}
label{display:block;font-weight:700;margin-bottom:8px}
input,select,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:none;border-color:#5b5ce2}
textarea{min-height:180px;resize:vertical}
.info{display:flex;justify-content:space-between;color:#777;font-size:13px;margin-top:8px}
.preview{background:#f7f7f7;border-radius:12px;padding:15px;margin-top:20px;white-space:pre-wrap}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:none;padding:14px;border-radius:12px;font-weight:700;cursor:pointer}
.salvar{background:#5b5ce2;color:#fff}
.limpar{background:#ececec}
@media(max-width:700px){.actions{flex-direction:column}}
</style>
</head>
<body>
<div id="menu"></div>
<script src="menu-loader.js?v=20260814"></script>
<main>
<section class="hero">
<div class="top">
<h1>🚀 Novo Prompt</h1>
<p>Crie e organize seus prompts rapidamente</p>
<div id="contadorPrompts"></div>
</div>
<div class="form-card">
<div class="field">
<label>Título</label>
<input id="titulo" placeholder="Nome do prompt">
</div>
<div class="field">
<label>Objetivo</label>
<input id="objetivo" placeholder="Ex: vendas, estudo, conteúdo">
</div>
<div class="field">
<label>Categoria</label>
<select id="categoria">
<option value="estudo">📚 Estudo</option>
<option value="saude">💊 Saúde</option>
<option value="imagens">🎨 Imagens</option>
<option value="trabalho">💼 Trabalho</option>
<option value="imobiliario">🏠 Imobiliário</option>
<option value="marketing">📈 Marketing</option>
<option value="outros">⭐ Outros</option>
</select>
</div>
<div class="field">
<label>Prompt</label>
<textarea id="conteudo" placeholder="Digite seu prompt aqui..." oninput="atualizarPreview()"></textarea>
<div class="info"><span id="chars">0 caracteres</span></div>
</div>
<div class="preview" id="preview">Pré-visualização aparecerá aqui...</div>
<div class="actions">
<button class="btn limpar" onclick="limparCampos()">🗑 Limpar</button>
<button class="btn salvar" onclick="salvarPrompt()">💾 Salvar Prompt</button>
</div>
</div>
</section>
</main>
<script>
const prompts=JSON.parse(localStorage.getItem('deltaPrompts'))||[];
document.getElementById('contadorPrompts').innerHTML=`📦 ${prompts.length} prompts cadastrados`;
conteudo.value=localStorage.getItem('rascunhoPrompt')||'';
function atualizarPreview(){
const texto=conteudo.value;
preview.textContent=texto||'Pré-visualização aparecerá aqui...';
chars.textContent=texto.length+' caracteres';
localStorage.setItem('rascunhoPrompt',texto);
}
function limparCampos(){
titulo.value='';objetivo.value='';conteudo.value='';
localStorage.removeItem('rascunhoPrompt');
atualizarPreview();
}
function salvarPrompt(){
const tituloValor=titulo.value.trim();
const categoriaValor=categoria.value;
const conteudoValor=conteudo.value.trim();
if(!tituloValor||!conteudoValor){alert('Preencha título e conteúdo');return;}
const prompt={id:Date.now(),titulo:tituloValor,objetivo:objetivo.value,categoria:categoriaValor,conteudo:conteudoValor,favorito:false};
prompts.push(prompt);
localStorage.setItem('deltaPrompts',JSON.stringify(prompts));
alert('Prompt salvo 🚀');
window.location.href=`/delta-prompts/paginas/${categoriaValor}.html`;
}
atualizarPreview();
</script>
</body>
</html>
