<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Novo Prompt | Delta Prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
.hero {
  max-width: 800px;
  margin: 50px auto;
  text-align: center;
}

.hero h1 {
  font-size: 30px;
  margin-bottom: 10px;
}

.hero p {
  color: #666;
  margin-bottom: 30px;
}

.form-card {
  background: #fff;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  border: 1px solid #e5e5e5;
  text-align: left;
}

.field {
  margin-bottom: 20px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.field textarea {
  min-height: 140px;
  resize: vertical;
}

.btn-primary {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #5b5ce2;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="menu"></div>
<script src="menu-loader.js"></script>

<main>
<section class="hero">

<h1>➕ Novo Prompt</h1>
<p>Crie e salve rapidamente seu prompt personalizado.</p>

<div class="form-card">

<div class="field">
<input id="titulo" type="text" placeholder="Título do Prompt">
</div>

<div class="field">
<select id="categoria">
<option value="estudo">Estudo</option>
<option value="saude">Saúde</option>
<option value="imagens">Imagens</option>
<option value="trabalho">Trabalho</option>
<option value="imobiliario">Imobiliário</option>
<option value="marketing">Marketing</option>
<option value="outros">Outros</option>
</select>
</div>

<div class="field">
<textarea id="conteudo" placeholder="Digite seu prompt aqui..."></textarea>
</div>

<button class="btn-primary" onclick="salvarPrompt()">💾 Salvar Prompt</button>

</div>
</section>
</main>

<script>
function salvarPrompt() {
  const titulo = document.getElementById("titulo").value.trim();
  const categoria = document.getElementById("categoria").value;
  const conteudo = document.getElementById("conteudo").value.trim();

  if (!titulo || !conteudo) {
    alert("Preencha título e conteúdo.");
    return;
  }

  const prompt = {
    id: Date.now(),
    titulo,
    categoria,
    conteudo,
    favorito: false
  };

  const prompts = JSON.parse(localStorage.getItem("deltaPrompts")) || [];
  prompts.push(prompt);
  localStorage.setItem("deltaPrompts", JSON.stringify(prompts));

  window.location.href = `/delta-prompts/paginas/${categoria}.html`;
}
</script>

</body>
</html>
