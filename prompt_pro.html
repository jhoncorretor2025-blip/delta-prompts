<!DOCTYPE html><html lang='pt-br'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Gerador Pro | Delta Prompts</title><link rel='stylesheet' href='style.css'><style>body{background:#f4f6fb;font-family:Arial;margin:0}.hero{max-width:1100px;margin:35px auto;padding:20px}.top{text-align:center;margin-bottom:25px}.badge{display:inline-block;background:#eef2ff;color:#4338ca;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700}.card{background:#fff;padding:30px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin-bottom:18px}label{display:block;font-weight:700;margin-bottom:8px}input,textarea,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}textarea{min-height:120px}input:focus,textarea:focus,select:focus{outline:none;border-color:#5b5ce2}.actions{display:flex;gap:10px;margin-top:15px}.btn{flex:1;padding:15px;border:none;border-radius:12px;font-weight:700;cursor:pointer}.primary{background:#5b5ce2;color:#fff}.secondary{background:#ececec}.result{display:none;margin-top:25px}.preview{background:#f7f7f7;padding:15px;border-radius:12px;margin-top:10px;color:#666}@media(max-width:800px){.grid,.actions{grid-template-columns:1fr;display:grid}}</style></head><body><div id='menu'></div><script src='menu-loader.js'></script><section class='hero'><div class='top'><span class='badge'>⚡ Ferramenta Pro</span><h1>Gerador Estratégico</h1><p>Monte prompts profissionais em segundos</p><div id='stats'></div></div><div class='card'><div class='field'><label>Contexto</label><textarea id='contexto' oninput='salvarRascunho()'></textarea></div><div class='field'><label>Objetivo</label><textarea id='objetivo' oninput='salvarRascunho()'></textarea></div><div class='grid'><div class='field'><label>Público</label><input id='publico'></div><div class='field'><label>Restrições</label><input id='restricoes'></div></div><div class='grid'><div class='field'><label>Tom</label><select id='tom'><option>Profissional</option><option>Persuasivo</option><option>Casual</option><option>Autoridade</option></select></div><div class='field'><label>Formato</label><select id='formato'><option>Passo a passo</option><option>Lista</option><option>Plano</option><option>Tabela</option></select></div></div><div class='field'><label>Profundidade</label><select id='nivel'><option>Básico</option><option>Detalhado</option><option>Avançado</option><option>Extremo</option></select></div><div class='preview' id='preview'>💡 Seu prompt aparecerá aqui...</div><div class='actions'><button class='btn secondary' onclick='limparFormulario()'>🧹 Limpar</button><button class='btn primary' onclick='gerarPrompt()'>🚀 Gerar</button></div><div class='result' id='resultado'><div class='field'><label>Prompt Final</label><textarea id='promptFinal'></textarea></div><div class='actions'><button class='btn primary' onclick='copiarPrompt()'>📋 Copiar</button><button class='btn secondary' onclick='baixarTxt()'>⬇️ Baixar TXT</button></div></div></div></section><script>const usos=Number(localStorage.getItem('usoPromptPro')||0);stats.innerHTML='📈 Usado '+usos+'x';['contexto','objetivo'].forEach(id=>{document.getElementById(id).value=localStorage.getItem(id)||''});function salvarRascunho(){localStorage.setItem('contexto',contexto.value);localStorage.setItem('objetivo',objetivo.value);preview.textContent='Contexto: '+contexto.value.slice(0,80)+' | Objetivo: '+objetivo.value.slice(0,80)}function gerarPrompt(){if(!contexto.value||!objetivo.value){alert('Preencha contexto e objetivo');return}const texto=`Você é especialista. Contexto: ${contexto.value} Objetivo: ${objetivo.value} Público: ${publico.value} Tom: ${tom.value} Formato: ${formato.value} Profundidade: ${nivel.value} Restrições: ${restricoes.value}. Organize de forma prática.`;promptFinal.value=texto;resultado.style.display='block';localStorage.setItem('usoPromptPro',usos+1)}function copiarPrompt(){navigator.clipboard.writeText(promptFinal.value);alert('Copiado 🚀')}function baixarTxt(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([promptFinal.value],{type:'text/plain'}));a.download='prompt.txt';a.click()}function limparFormulario(){document.querySelectorAll('textarea,input').forEach(e=>e.value='');resultado.style.display='none';localStorage.removeItem('contexto');localStorage.removeItem('objetivo');salvarRascunho()}salvarRascunho();</script></body></html>
