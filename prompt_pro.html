<!DOCTYPE html><html lang='pt-br'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Gerador Pro | Delta Prompts</title><link rel='stylesheet' href='style.css'><style>body{background:#f4f6fb;font-family:Arial,sans-serif;margin:0}.hero{width:calc(100% - 260px);max-width:1400px;margin:35px auto;padding:25px}.top{text-align:center;margin-bottom:25px}.top h1{font-size:48px;margin:10px 0}.top p{font-size:18px;color:#666}.badge{display:inline-block;background:#eef2ff;color:#4338ca;padding:10px 18px;border-radius:999px;font-weight:700}.card{background:#fff;padding:40px;border-radius:24px;box-shadow:0 12px 35px rgba(0,0,0,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-bottom:24px}.hint{font-size:13px;color:#888;margin-top:6px}label{display:block;font-weight:700;margin-bottom:10px;font-size:17px}input,textarea,select{width:100%;padding:18px;border:1px solid #d9d9d9;border-radius:14px;font-size:16px;box-sizing:border-box}textarea{min-height:180px}input::placeholder,textarea::placeholder{color:#999}input:focus,textarea:focus,select:focus{outline:none;border-color:#5b5ce2}.preview{padding:18px;background:#f5f6ff;border-radius:14px;font-size:15px}.actions{display:flex;gap:14px;margin-top:25px}.btn{flex:1;padding:18px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#5b5ce2;color:#fff}.secondary{background:#ececec}.result{display:none;margin-top:30px}#promptFinal{min-height:260px}@media(max-width:1100px){.hero{width:95%}.grid{grid-template-columns:1fr}.actions{flex-direction:column}.top h1{font-size:36px}}</style></head><body><div id='menu'></div><script src='menu-loader.js'></script><section class='hero'><div class='top'><span class='badge'>⚡ Ferramenta Pro</span><h1>Gerador Estratégico</h1><p>Monte prompts profissionais em segundos</p><div id='stats'></div></div><div class='card'><div class='field'><label>Contexto</label><textarea id='contexto' placeholder='Ex: Sou corretor de imóveis e quero criar conteúdo para atrair clientes no Instagram...' oninput='salvarRascunho()'></textarea><div class='hint'>Explique o cenário atual</div></div><div class='field'><label>Objetivo</label><textarea id='objetivo' placeholder='Ex: Criar 10 ideias de posts persuasivos com CTA para gerar leads...' oninput='salvarRascunho()'></textarea><div class='hint'>O que você quer que a IA entregue?</div></div><div class='grid'><div class='field'><label>Público</label><input id='publico' placeholder='Ex: Corretores iniciantes, mulheres 30+, empresários'></div><div class='field'><label>Restrições</label><input id='restricoes' placeholder='Ex: sem emojis, curto, linguagem simples'></div></div><div class='grid'><div class='field'><label>Tom</label><select id='tom'><option>Profissional</option><option>Persuasivo</option><option>Casual</option><option>Autoridade</option></select></div><div class='field'><label>Formato</label><select id='formato'><option>Passo a passo</option><option>Lista</option><option>Plano</option><option>Tabela</option></select></div></div><div class='field'><label>Profundidade</label><select id='nivel'><option>Básico</option><option>Detalhado</option><option>Avançado</option><option>Extremo</option></select></div><div class='preview' id='preview'>💡 Preencha os campos acima. Aqui aparecerá um resumo.</div><div class='actions'><button class='btn secondary' onclick='limparFormulario()'>🧹 Limpar</button><button class='btn primary' onclick='gerarPrompt()'>🚀 Gerar</button></div><div class='result' id='resultado'><div class='field'><label>Prompt Final</label><textarea id='promptFinal'></textarea></div><div class='actions'><button class='btn primary' onclick='copiarPrompt()'>📋 Copiar</button><button class='btn secondary' onclick='baixarTxt()'>⬇️ Baixar TXT</button></div></div></div></section><script>const usos=Number(localStorage.getItem('usoPromptPro')||0);stats.innerHTML='📈 Usado '+usos+'x';['contexto','objetivo'].forEach(id=>document.getElementById(id).value=localStorage.getItem(id)||'');function salvarRascunho(){localStorage.setItem('contexto',contexto.value);localStorage.setItem('objetivo',objetivo.value);preview.textContent='Contexto: '+contexto.value.slice(0,120)+' | Objetivo: '+objetivo.value.slice(0,120)}function gerarPrompt(){if(!contexto.value||!objetivo.value){alert('Preencha contexto e objetivo');return}promptFinal.value=`Você é especialista. Contexto: ${contexto.value} Objetivo: ${objetivo.value} Público: ${publico.value} Tom: ${tom.value} Formato: ${formato.value} Profundidade: ${nivel.value} Restrições: ${restricoes.value}`;resultado.style.display='block';localStorage.setItem('usoPromptPro',usos+1)}function copiarPrompt(){navigator.clipboard.writeText(promptFinal.value);alert('Copiado 🚀')}function baixarTxt(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([promptFinal.value],{type:'text/plain'}));a.download='prompt.txt';a.click()}function limparFormulario(){document.querySelectorAll('textarea,input').forEach(e=>e.value='');resultado.style.display='none';salvarRascunho()}salvarRascunho();</script></body></html>
