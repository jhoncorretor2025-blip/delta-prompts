<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><title>Painel Admin | Delta Prompts</title><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex"><link rel="stylesheet" href="/delta-prompts/style.css"><link rel="stylesheet" href="/delta-prompts/css/melhoriaspaginas.css"><style>
.admin-box{padding:20px;border-radius:16px;border:1px solid #e5e7eb;background:#fff;margin:20px 0}
.admin-box h3{margin:0 0 14px}
.admin-lista{display:flex;flex-direction:column;gap:0}
.admin-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.admin-item:last-child{border-bottom:0}
.admin-posicao{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#eef2ff;color:#5b5ce2;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.admin-nome{flex:1;font-weight:700;font-size:14px;word-break:break-word}
.admin-numeros{flex:0 0 auto;font-size:12.5px;color:#667085;font-weight:700;white-space:nowrap}
.admin-bloqueado{text-align:center;padding:60px 20px}
.admin-bloqueado h1{font-size:26px}
.vazio-mini{text-align:center;padding:20px;color:#8a92a6;font-size:13.5px}
[data-theme="dark"] .admin-box{background:var(--bg-card,#16213e);border-color:rgba(255,255,255,.1)}
[data-theme="dark"] .admin-item{border-color:rgba(255,255,255,.08)}
[data-theme="dark"] .admin-numeros{color:#a0a0a0}
</style></head><body><div id="menu"></div><script src="/delta-prompts/menu-loader.js?v=20260908b"></script><main>

<div id="conteudoAdmin">
  <div class="vazio-mini" style="padding:60px 20px">🔄 Verificando acesso...</div>
</div>

</main>
<button class="theme-toggle" id="themeToggle" title="Alternar tema claro/escuro">🌙</button>
<script>
function aplicarTema(t){document.documentElement.setAttribute('data-theme',t);const btn=document.getElementById('themeToggle');if(btn)btn.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('deltaTheme',t)}catch(e){}}
document.getElementById('themeToggle').addEventListener('click',()=>{const atual=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';aplicarTema(atual)});
aplicarTema((function(){try{return localStorage.getItem('deltaTheme')||'light'}catch(e){return'light'}})());

const ADMIN_EMAIL='jhoncorretor2025@gmail.com';

function aguardarMudancaAuth(){
  return new Promise(resolve=>{
    window.addEventListener('delta-auth-changed',function ouvir(e){
      window.removeEventListener('delta-auth-changed',ouvir);
      resolve(e.detail&&e.detail.user?e.detail.user:null);
    });
  });
}

function renderBloqueado(){
  document.getElementById('conteudoAdmin').innerHTML=`
    <div class="admin-bloqueado">
      <h1>🚫 Acesso restrito</h1>
      <p>Essa página é só para o administrador do site. Entre com a conta certa pra acessar.</p>
      <a href="/delta-prompts/index.html" style="display:inline-block;margin-top:14px;padding:12px 22px;background:var(--delta-accent,#5b5ce2);color:#fff;font-weight:700;border-radius:12px;text-decoration:none">🏠 Voltar para a Página Inicial</a>
    </div>`;
}

function labelPagina(caminho){
  if(!caminho)return'(desconhecida)';
  const partes=caminho.replace(/^\/delta-prompts\//,'').replace(/\.html$/,'');
  return partes||'Página Inicial';
}

async function renderPainel(user){
  document.getElementById('conteudoAdmin').innerHTML=`
    <h1>🔐 Painel Administrativo</h1>
    <p>Estatísticas agregadas de <strong>todos os usuários</strong> do Delta Prompts. Logado como ${user.email}.</p>

    <div class="admin-box">
      <h3>👍 Prompts mais bem avaliados (feedback global)</h3>
      <div class="admin-lista" id="listaFeedback"><div class="vazio-mini">Carregando...</div></div>
    </div>

    <div class="admin-box">
      <h3>📈 Páginas mais visitadas</h3>
      <div class="admin-lista" id="listaPageviews"><div class="vazio-mini">Carregando...</div></div>
    </div>

    <div class="admin-box">
      <h3>🔗 Verificar links do menu</h3>
      <p style="margin:0 0 12px;color:#667085;font-size:13.5px">Testa todos os links do menu de verdade (igual um visitante veria) e avisa se algum estiver quebrado.</p>
      <button type="button" id="btnChecarLinks" style="border:0;background:var(--delta-accent,#5b5ce2);color:#fff;font-weight:800;border-radius:10px;padding:10px 18px;cursor:pointer">🔍 Checar agora</button>
      <div class="admin-lista" id="listaLinks" style="margin-top:14px"></div>
    </div>

    <div class="admin-box">
      <h3>📊 Contagem Real de Prompts por Página</h3>
      <p style="margin:0 0 12px;color:#667085;font-size:13.5px">Compara o número real de prompts (extraído automaticamente de cada página) com o número mostrado no menu — avisa quando estão diferentes.</p>
      <button type="button" id="btnContarPrompts" style="border:0;background:var(--delta-accent,#5b5ce2);color:#fff;font-weight:800;border-radius:10px;padding:10px 18px;cursor:pointer">📊 Recalcular agora</button>
      <div class="admin-lista" id="listaContagem" style="margin-top:14px"></div>
    </div>

    <div class="admin-box">
      <h3>📝 Corrigir Contadores do Menu</h3>
      <p style="margin:0 0 12px;color:#667085;font-size:13.5px">Depois de recalcular acima, gera o texto do menu.html já com os números certos, pronto pra você copiar e substituir.</p>
      <button type="button" id="btnGerarMenuCorrigido" style="border:1px solid #e5e7eb;background:#fff;color:#344055;font-weight:800;border-radius:10px;padding:10px 18px;cursor:pointer">📝 Gerar menu.html corrigido</button>
      <textarea id="menuCorrigidoTexto" readonly style="display:none;width:100%;box-sizing:border-box;min-height:160px;margin-top:12px;font-family:monospace;font-size:11px;padding:10px;border:1px solid #e5e7eb;border-radius:10px"></textarea>
      <button type="button" id="btnCopiarMenuCorrigido" style="display:none;margin-top:8px;border:0;background:#16a34a;color:#fff;font-weight:800;border-radius:10px;padding:8px 16px;cursor:pointer;font-size:12.5px">📋 Copiar texto</button>
    </div>

    <div class="admin-box">
      <h3>📅 Log de Publicações (histórico real do GitHub)</h3>
      <p style="margin:0 0 12px;color:#667085;font-size:13.5px">As últimas publicações feitas no site, direto do histórico do repositório.</p>
      <div class="admin-lista" id="listaPublicacoes"><div class="vazio-mini">Carregando...</div></div>
    </div>

    <div class="admin-box">
      <h3>💬 Sugestões dos Usuários (centralizadas)</h3>
      <p style="margin:0 0 12px;color:#667085;font-size:13.5px">Todas as sugestões enviadas pelo botão "💡 Sugerir" em qualquer página do site, num só lugar.</p>
      <div class="admin-lista" id="listaSugestoes"><div class="vazio-mini">Carregando...</div></div>
    </div>
  `;

  document.getElementById('btnChecarLinks').addEventListener('click',checarLinksMenu);
  document.getElementById('btnContarPrompts').addEventListener('click',contarPromptsReais);
  document.getElementById('btnGerarMenuCorrigido').addEventListener('click',gerarMenuCorrigido);
  carregarPublicacoes();
  carregarSugestoes();

  try{
    const topFeedback=await window.deltaAuth.obterTopFeedback(20);
    const boxFb=document.getElementById('listaFeedback');
    if(!topFeedback.length){
      boxFb.innerHTML='<div class="vazio-mini">Ainda não há dados de feedback suficientes.</div>';
    }else{
      boxFb.innerHTML=topFeedback.map((p,i)=>`
        <div class="admin-item">
          <span class="admin-posicao">${i+1}</span>
          <span class="admin-nome">${p.id}</span>
          <span class="admin-numeros">👍 ${p.up} · 👎 ${p.down}</span>
        </div>`).join('');
    }
  }catch(e){
    document.getElementById('listaFeedback').innerHTML='<div class="vazio-mini">Erro ao carregar. Confira as regras do Firestore.</div>';
  }

  try{
    const topPaginas=await window.deltaAuth.obterTopPageViews(30);
    const boxPv=document.getElementById('listaPageviews');
    if(!topPaginas.length){
      boxPv.innerHTML='<div class="vazio-mini">Ainda não há visualizações registradas.</div>';
    }else{
      boxPv.innerHTML=topPaginas.map((p,i)=>`
        <div class="admin-item">
          <span class="admin-posicao">${i+1}</span>
          <span class="admin-nome">${labelPagina(p.path)}</span>
          <span class="admin-numeros">👁️ ${p.views}</span>
        </div>`).join('');
    }
  }catch(e){
    document.getElementById('listaPageviews').innerHTML='<div class="vazio-mini">Erro ao carregar. Confira as regras do Firestore.</div>';
  }
}

async function checarLinksMenu(){
  const box=document.getElementById('listaLinks');
  box.innerHTML='<div class="vazio-mini">🔄 Buscando o menu...</div>';
  try{
    const resMenu=await fetch('/delta-prompts/menu.html?v='+Date.now());
    const textoMenu=await resMenu.text();
    const links=[...new Set([...textoMenu.matchAll(/href="(\/delta-prompts\/[^"]+\.html)"/g)].map(m=>m[1]))];
    box.innerHTML=`<div class="vazio-mini">🔄 Checando ${links.length} links...</div>`;
    const resultados=[];
    for(const link of links){
      try{
        const r=await fetch(link+'?v='+Date.now(),{method:'GET',cache:'no-store'});
        resultados.push({link,ok:r.ok,status:r.status});
      }catch(e){
        resultados.push({link,ok:false,status:'erro de rede'});
      }
    }
    const quebrados=resultados.filter(r=>!r.ok);
    if(!quebrados.length){
      box.innerHTML=`<div class="vazio-mini">✅ Todos os ${links.length} links do menu estão funcionando!</div>`;
    }else{
      box.innerHTML=`<div style="color:#b91c1c;font-weight:800;margin-bottom:8px">⚠️ ${quebrados.length} de ${links.length} links com problema:</div>`+
        quebrados.map(q=>`<div class="admin-item"><span class="admin-nome">${q.link}</span><span class="admin-numeros" style="color:#b91c1c">${q.status}</span></div>`).join('');
    }
  }catch(e){
    box.innerHTML='<div class="vazio-mini">Erro ao checar os links. Tente novamente.</div>';
  }
}

let ultimaContagem=null; // guarda o resultado pra reaproveitar em gerarMenuCorrigido

async function contarPromptsReais(){
  const box=document.getElementById('listaContagem');
  box.innerHTML='<div class="vazio-mini">🔄 Carregando índice de busca e menu...</div>';
  try{
    const [resIdx,resMenu]=await Promise.all([
      fetch('/delta-prompts/search-index.js?v='+Date.now()),
      fetch('/delta-prompts/menu.html?v='+Date.now())
    ]);
    const textoIdx=await resIdx.text();
    const textoMenu=await resMenu.text();

    // extrai o array do search-index.js (window.deltaSearchIndex = [...])
    const m=textoIdx.match(/window\.deltaSearchIndex\s*=\s*(\[[\s\S]*\]);/);
    if(!m){box.innerHTML='<div class="vazio-mini">Não consegui ler o índice de busca.</div>';return}
    const indice=JSON.parse(m[1]);

    const contagemReal={};
    indice.forEach(p=>{const link=(p.link||'').replace(/^\/delta-prompts\//,'');contagemReal[link]=(contagemReal[link]||0)+1});

    // extrai contadores do menu: <a href="/delta-prompts/paginas/x.html">Nome <span class="menu-count">N</span></a>
    const regexMenu=/href="\/delta-prompts\/([^"]+\.html)"[^>]*>([^<]*)<span class="menu-count">(\d+)<\/span>/g;
    const contagemMenu={};
    let mm;
    while((mm=regexMenu.exec(textoMenu))){
      contagemMenu[mm[1]]={nome:mm[2].trim(),valor:parseInt(mm[3],10)};
    }

    const linhas=[];
    Object.keys(contagemMenu).forEach(link=>{
      const real=contagemReal[link]||0;
      const noMenu=contagemMenu[link].valor;
      if(real!==noMenu&&real>0){ // so avisa quando ha discrepancia relevante (indice extraiu algo)
        linhas.push({link,nome:contagemMenu[link].nome,real,noMenu});
      }
    });

    ultimaContagem={contagemReal,contagemMenu};

    if(!linhas.length){
      box.innerHTML='<div class="vazio-mini">✅ Todos os contadores do menu batem com a contagem real (dentro do que o índice conseguiu detectar).</div>';
    }else{
      box.innerHTML=`<div style="color:#c2410c;font-weight:800;margin-bottom:8px">⚠️ ${linhas.length} página(s) com número diferente:</div>`+
        linhas.map(l=>`<div class="admin-item"><span class="admin-nome">${l.nome}</span><span class="admin-numeros">menu: ${l.noMenu} → real: <strong>${l.real}</strong></span></div>`).join('');
    }
  }catch(e){
    box.innerHTML='<div class="vazio-mini">Erro ao calcular. Tente novamente.</div>';
  }
}

async function gerarMenuCorrigido(){
  if(!ultimaContagem){await contarPromptsReais()}
  if(!ultimaContagem)return;
  try{
    const resMenu=await fetch('/delta-prompts/menu.html?v='+Date.now());
    let textoMenu=await resMenu.text();
    const {contagemReal}=ultimaContagem;
    textoMenu=textoMenu.replace(/href="\/delta-prompts\/([^"]+\.html)"([^>]*>[^<]*<span class="menu-count">)(\d+)(<\/span>)/g,(match,link,antes,valorAntigo,depois)=>{
      const real=contagemReal[link];
      if(real&&real!==parseInt(valorAntigo,10)){
        return `href="/delta-prompts/${link}"${antes}${real}${depois}`;
      }
      return match;
    });
    const area=document.getElementById('menuCorrigidoTexto');
    area.value=textoMenu;
    area.style.display='block';
    document.getElementById('btnCopiarMenuCorrigido').style.display='inline-block';
    document.getElementById('btnCopiarMenuCorrigido').onclick=()=>{
      navigator.clipboard.writeText(textoMenu).then(()=>{
        const btn=document.getElementById('btnCopiarMenuCorrigido');
        const original=btn.textContent;btn.textContent='✓ Copiado!';setTimeout(()=>btn.textContent=original,1500);
      });
    };
  }catch(e){
    mostrarToastAdmin('Erro ao gerar o menu corrigido.');
  }
}

function mostrarToastAdmin(texto){
  const t=document.createElement('div');
  t.textContent=texto;
  t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 18px;border-radius:12px;z-index:9999;font-size:13px;font-weight:700';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

async function carregarPublicacoes(){
  const box=document.getElementById('listaPublicacoes');
  try{
    const r=await fetch('https://api.github.com/repos/jhoncorretor2025-blip/delta-prompts/commits?per_page=25');
    if(!r.ok){box.innerHTML='<div class="vazio-mini">Não foi possível carregar o histórico agora.</div>';return}
    const commits=await r.json();
    box.innerHTML=commits.map(c=>{
      const msg=(c.commit.message||'').split('\n')[0];
      const data=new Date(c.commit.author.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
      const hora=new Date(c.commit.author.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      return `<div class="admin-item"><span class="admin-nome" style="flex:1">${msg}</span><span class="admin-numeros">${data} ${hora}</span></div>`;
    }).join('');
  }catch(e){
    box.innerHTML='<div class="vazio-mini">Não foi possível carregar o histórico agora.</div>';
  }
}

async function carregarSugestoes(){
  const box=document.getElementById('listaSugestoes');
  try{
    if(!window.deltaAuth||!window.deltaAuth.obterSugestoes){box.innerHTML='<div class="vazio-mini">Sistema de sugestões ainda carregando, tente recarregar a página.</div>';return}
    const sugestoes=await window.deltaAuth.obterSugestoes(50);
    if(!sugestoes.length){
      box.innerHTML='<div class="vazio-mini">Nenhuma sugestão enviada ainda.</div>';
      return;
    }
    box.innerHTML=sugestoes.map(s=>{
      const data=s.ts&&s.ts.seconds?new Date(s.ts.seconds*1000).toLocaleDateString('pt-BR'):'';
      return `<div class="admin-item" style="align-items:flex-start;flex-direction:column;gap:4px"><div style="font-weight:700;font-size:13.5px">${(s.texto||'').replace(/</g,'&lt;')}</div><div style="font-size:11.5px;color:#8a92a6">📍 ${s.pagina||'?'} · ${data}</div></div>`;
    }).join('');
  }catch(e){
    box.innerHTML='<div class="vazio-mini">Erro ao carregar sugestões. Confira as regras do Firestore (coleção "sugestoes").</div>';
  }
}

async function iniciar(){
  if(!window.deltaLoadAuth){renderBloqueado();return}
  const promessaAuth=aguardarMudancaAuth();
  await window.deltaLoadAuth();
  const user=await promessaAuth;
  if(user&&user.email===ADMIN_EMAIL){
    renderPainel(user);
  }else{
    renderBloqueado();
  }
}
iniciar();
</script>
</body></html>
